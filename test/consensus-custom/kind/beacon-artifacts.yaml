apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beacon-artifacts
  namespace: solo-orbit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: beacon-zip-loader
  namespace: solo-orbit
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - { name: artifacts, mountPath: /data }
  volumes:
    - name: artifacts
      persistentVolumeClaim:
        claimName: beacon-artifacts
