#
# Submits PREPARE_UPGRADE as a Kubernetes Job. ${ZIP_HASH} is the SHA-384 of the uploaded package (envsubst).
apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-freeze-prepare
  namespace: solo-orbit
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: beacon
          image: ghcr.io/hashgraph/solo-operator/beacon:dev
          imagePullPolicy: IfNotPresent
          args:
            - "freeze"
            - "prepare"
            - "-c"
            - "/etc/beacon/config.yaml"
            - "--upgrade-zip-hash"
            - "${ZIP_HASH}"
            - "--yes"
          volumeMounts:
            - { name: config, mountPath: /etc/beacon/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: keys, mountPath: /etc/beacon/keys, readOnly: true }
      volumes:
        - name: config
          configMap: { name: beacon-config }
        - name: keys
          secret: { secretName: beacon-keys }
