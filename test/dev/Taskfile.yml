version: '3'

# -----------------------------------------------------------------------------
# Builds a Hedera consensus-node deployment package ("build.zip") for exercising
# the solo-operator UC sidecar locally.
#
# The package mirrors the real extracted upgrade layout the consensus node
# writes into its --marker-path, and additionally carries the UC manifests at
#   manifests/consensus-node-components.yaml  — image + DETERMINISTIC layer hashes
#                                               (RootFS diff_ids) computed straight
#                                               from the published consensus-node
#                                               image, so the operator's deterministic
#                                               verification (internal/registry/checker.go)
#                                               passes against it.
#   manifests/infrastructure-versions.yaml    — provisioner daemon/CLI versions the UC
#                                               reads into NetworkUpgradeExecute.spec.provisioner
#                                               (drives requiresInfraAccess). Omitted when
#                                               PROVISIONER_{DAEMON,CLI}_VERSION are both "".
#
# The node config overlaid onto the package is vendored under ./overlay (see
# overlay/README.md for provenance), so the only network download is the
# consensus-node software zip itself.
#
# Usage:
#   task setup     # download both consensus-node source zips (base + upgrade)
#   task build     # produce staging/build-v<base>.zip and staging/build-v<upgrade>.zip
#
# Tooling required for the UC manifest step: `crane` and `jq`.
#   go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
# -----------------------------------------------------------------------------

vars:
  # Node config overlaid onto the extracted package (vendored — no external clone).
  OVERLAY_DIR: overlay
  # hiero-local-node revision the vendored overlay/ was sourced from. Bump this
  # and run `task overlay:update` to refresh the vendored files.
  HIERO_LOCAL_NODE_COMMIT: "e2a7aeaa6664bc8eef580e16687ca9eea00e0d0d"

  # Two REAL versions are built:
  #   BASE    — the version the network is deployed at (docs/example node CRs use
  #             this consensus-node image tag). Its zip is kept for other tests.
  #   UPGRADE — the next version, uploaded via beacon (special file 0.0.150) / NMT
  #             to drive an upgrade of the deployed base network.
  # Each must exist BOTH as a published source zip on builds.hedera.com AND as a
  # consensus-node container image (the UC manifest pins the image + layer hashes).
  HEDERA_BASE_VERSION: "0.74.0"
  HEDERA_UPGRADE_VERSION: "0.74.2"

  STAGING_DIR: staging
  EXTRACT_DIR: extracted

  # Consensus-node image the UC manifest points at. Layer hashes are the RootFS
  # diff_ids of THIS image, per platform, so deterministic verification matches
  # what the operator computes via go-containerregistry. The version is supplied
  # per build (base or upgrade) by build:one.
  CN_IMAGE: "gcr.io/hedera-registry/consensus-node"
  # Extra registries that publish the SAME consensus-node image, listed as space-
  # separated repos (no tag; the tag is CN_VERSION). Each is added to the manifest
  # as a second registry ONLY when it publishes CN_VERSION with identical layer
  # hashes, so the multi-registry SoftwareVersionSource path can be exercised. A
  # mirror that lacks the version (or differs) is skipped, so the manifest stays
  # valid. Set to "" to force a single-registry manifest.
  CN_IMAGE_MIRRORS: "artifacts.hashgraph.io/consensus-node-docker-release-local/consensus-node"
  # Optional decoy registry (full image ref WITH tag) added as an extra candidate to
  # test the operator skipping a registry it cannot pull from: a real public host but
  # an image/tag that does not exist. Empty by default so the normal build is not
  # affected. It is appended AFTER the valid registries (never registries[0], which
  # weaver uses for the single SoftwareVersion fallback), and its layer hashes are not
  # checked. Set e.g. CN_DECOY_REGISTRY=artifacts.hashgraph.io/consensus-node-docker-release-local/consensus-node:0.0.0-invalid
  CN_DECOY_REGISTRY: ""
  # Space-separated platforms to emit layer hashes for. A platform the image
  # does not publish is skipped with a warning.
  CN_PLATFORMS: "linux/amd64 linux/arm64"

  # Provisioner daemon/CLI versions declared in manifests/infrastructure-versions.yaml.
  # The UC reads these (internal/uc/manifest.go) into NetworkUpgradeExecute.spec.provisioner;
  # the operator's requiresInfraAccess compares them against the Orbit's
  # orbit.hiero.org/provisioner-{daemon,cli}-version annotations to decide whether host
  # infra work is required. Default tracks the current solo-weaver release. Set both to
  # "" to omit the manifest entirely (no provisioner declared → infra access never required).
  PROVISIONER_DAEMON_VERSION: '{{ .PROVISIONER_DAEMON_VERSION | default "0.32.0" }}'
  PROVISIONER_CLI_VERSION: '{{ .PROVISIONER_CLI_VERSION | default "0.32.0" }}'

silent: true
tasks:
  setup:
    desc: "Download both consensus-node source zips (base + upgrade)"
    cmds:
      - task: setup:one
        vars: { VERSION: '{{ .HEDERA_BASE_VERSION }}' }
      - task: setup:one
        vars: { VERSION: '{{ .HEDERA_UPGRADE_VERSION }}' }

  setup:one:
    internal: true
    desc: "Download a single consensus-node source zip for VERSION"
    vars:
      # Derived: "0.74.0" -> "0.74"
      SHORT: '{{ regexReplaceAll `^(\d+\.\d+).*` .VERSION "${1}" }}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        ZIP="build-v{{ .VERSION }}.zip"
        URL="https://builds.hedera.com/node/software/v{{ .SHORT }}/${ZIP}"

        info "Checking Hedera artifact \`${ZIP}\`"
        if [ ! -f "${ZIP}" ]; then
          info "Downloading ${ZIP} from ${URL}"
          curl -sSLO "${URL}" && ok "Downloaded ${ZIP}" || { err "Failed to download ${ZIP}"; exit 1; }
        else
          ok "${ZIP} already exists, skipping download"
        fi
        '

  build:
    desc: "Build both deployment zips (base + upgrade) with per-version UC manifests"
    deps: [setup]
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        # Clean staging once so building the second zip does not wipe the first.
        mkdir -p {{ .STAGING_DIR }}
        rm -f {{ .STAGING_DIR }}/*.zip || true
        '
      - task: build:one
        vars: { VERSION: '{{ .HEDERA_BASE_VERSION }}' }
      - task: build:one
        vars: { VERSION: '{{ .HEDERA_UPGRADE_VERSION }}' }
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        info "Staging tree"
        tree {{ .STAGING_DIR }} 2>/dev/null || ls -la {{ .STAGING_DIR }}
        '

  build:uc-manifest:
    desc: "Generate manifests/consensus-node-components.yaml with deterministic layer hashes (RootFS diff_ids)"
    vars:
      # Output directory for the manifest; defaults into the extracted tree so it
      # is captured by the zip step. Override with OUT_DIR=... for standalone use.
      OUT_DIR: '{{ .OUT_DIR | default (printf "%s/manifests" .EXTRACT_DIR) }}'
      # Version of the consensus-node image the manifest pins. Supplied per build
      # by build:one; defaults to the base version for standalone use.
      CN_VERSION: '{{ .CN_VERSION | default .HEDERA_BASE_VERSION }}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        IMAGE="{{ .CN_IMAGE }}:{{ .CN_VERSION }}"
        OUT_DIR="{{ .OUT_DIR }}"
        MANIFEST="$OUT_DIR/consensus-node-components.yaml"

        command -v crane >/dev/null 2>&1 || { err "crane not found — install: go install github.com/google/go-containerregistry/cmd/crane@v0.22.0"; exit 1; }
        command -v jq    >/dev/null 2>&1 || { err "jq not found — install jq"; exit 1; }

        info "Computing deterministic layer hashes for $IMAGE"
        mkdir -p "$OUT_DIR"

        # Compute layer hashes (RootFS diff_ids) per platform. Save each platform diff_ids
        # to a temp file so a mirror can be checked byte-identical before it is listed as
        # a second registry. Fail if no platform yielded any diff_ids (a bad image ref must
        # not produce an empty manifest). Temp files, not bash associative arrays, so this
        # also runs on the macOS system bash (3.2).
        layers_block="$(mktemp)"
        registries_block="$(mktemp)"
        ids_dir="$(mktemp -d)"
        trap "rm -rf \"$layers_block\" \"$registries_block\" \"$ids_dir\"" EXIT
        emitted_platforms=""
        for p in {{ .CN_PLATFORMS }}; do
          if ! cfg="$(crane config "$IMAGE" --platform "$p" 2>/dev/null)"; then
            warn "skip $p — image does not publish this platform"
            continue
          fi
          ids="$(printf "%s" "$cfg" | jq -r ".rootfs.diff_ids[]?")"
          if [ -z "$ids" ]; then
            warn "skip $p — no rootfs.diff_ids in config"
            continue
          fi
          printf "%s" "$ids" > "$ids_dir/$(printf "%s" "$p" | tr / _)"
          emitted_platforms="$emitted_platforms $p"
          {
            echo "        $p:"
            while IFS= read -r d; do echo "          - \"$d\""; done <<< "$ids"
          } >> "$layers_block"
          ok "$p: $(printf "%s\n" "$ids" | grep -c .) layer hash(es)"
        done
        [ -n "$emitted_platforms" ] || { err "no layer hashes computed for $IMAGE on any of: {{ .CN_PLATFORMS }}"; exit 1; }

        # registries: the primary image, plus any mirror that publishes CN_VERSION
        # with identical diff_ids on every emitted platform. A mirror that lacks the
        # version or differs is skipped, so the manifest stays valid and deterministic.
        echo "      - image: \"$IMAGE\"" >> "$registries_block"
        for m in {{ .CN_IMAGE_MIRRORS }}; do
          mref="$m:{{ .CN_VERSION }}"
          match=1
          for p in $emitted_platforms; do
            if mcfg="$(crane config "$mref" --platform "$p" 2>/dev/null)"; then
              mids="$(printf "%s" "$mcfg" | jq -r ".rootfs.diff_ids[]?")"
              [ "$mids" = "$(cat "$ids_dir/$(printf "%s" "$p" | tr / _)")" ] || match=0
            else
              match=0
            fi
          done
          if [ "$match" = 1 ]; then
            echo "      - image: \"$mref\"" >> "$registries_block"
            ok "mirror matches, added as a registry: $mref"
          else
            warn "mirror skipped (missing version or non-deterministic): $mref"
          fi
        done

        # Optional decoy: a reachable public host with an image/tag that does not
        # exist, appended last so registries[0] stays valid. Exercises the operator
        # skipping a candidate it cannot pull.
        if [ -n "{{ .CN_DECOY_REGISTRY }}" ]; then
          echo "      - image: \"{{ .CN_DECOY_REGISTRY }}\"" >> "$registries_block"
          warn "decoy registry added (intentionally unpullable): {{ .CN_DECOY_REGISTRY }}"
        fi

        {
          echo "schemaVersion: 1"
          echo "images:"
          echo "  consensusNode:"
          echo "    version: \"{{ .CN_VERSION }}\""
          echo "    deterministic:"
          echo "      supported: true"
          echo "      layerHashes:"
          cat "$layers_block"
          echo "    registries:"
          cat "$registries_block"
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '

  build:infra-manifest:
    desc: "Generate manifests/infrastructure-versions.yaml declaring provisioner daemon/CLI versions"
    vars:
      # Output directory for the manifest; defaults into the extracted tree so it
      # is captured by the zip step. Override with OUT_DIR=... for standalone use.
      OUT_DIR: '{{ .OUT_DIR | default (printf "%s/manifests" .EXTRACT_DIR) }}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }

        OUT_DIR="{{ .OUT_DIR }}"
        MANIFEST="$OUT_DIR/infrastructure-versions.yaml"
        DAEMON_VERSION="{{ .PROVISIONER_DAEMON_VERSION }}"
        CLI_VERSION="{{ .PROVISIONER_CLI_VERSION }}"

        # Both empty → omit the manifest so the UC declares no provisioner versions
        # (NetworkUpgradeExecute.spec.provisioner stays nil → infra access never required).
        if [ -z "$DAEMON_VERSION" ] && [ -z "$CLI_VERSION" ]; then
          warn "PROVISIONER_{DAEMON,CLI}_VERSION both empty — skipping infrastructure-versions.yaml"
          exit 0
        fi

        info "Writing infrastructure-versions.yaml (daemon=${DAEMON_VERSION:-<unset>} cli=${CLI_VERSION:-<unset>})"
        mkdir -p "$OUT_DIR"
        {
          echo "provisioner:"
          echo "  daemon:"
          echo "    version: \"$DAEMON_VERSION\""
          echo "  cli:"
          echo "    version: \"$CLI_VERSION\""
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '

  build:one:
    internal: true
    desc: "Extract build-v<VERSION>.zip, overlay config, embed the UC manifest, and re-zip"
    vars:
      ZIP: 'build-v{{ .VERSION }}.zip'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔧  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        info "Building deployment zip for {{ .VERSION }}"

        # Fresh extract tree for this version (staging is cleaned once by `build`).
        rm -rf {{ .EXTRACT_DIR }} || true
        mkdir -p {{ .EXTRACT_DIR }}
        mkdir -p {{ .STAGING_DIR }}

        if [ ! -f "{{ .ZIP }}" ]; then
          err "Source file {{ .ZIP }} not found — run \`task setup\` first"
          exit 1
        fi

        info "Extracting {{ .ZIP }}"
        unzip -q {{ .ZIP }} -d {{ .EXTRACT_DIR }}

        if [ -d "./{{ .OVERLAY_DIR }}" ]; then
          info "Overlaying vendored node configuration from ./{{ .OVERLAY_DIR }}"
          cp -Rf ./{{ .OVERLAY_DIR }}/* {{ .EXTRACT_DIR }}/
        else
          err "Vendored overlay ./{{ .OVERLAY_DIR }} not found"
          exit 1
        fi

        pushd {{ .EXTRACT_DIR }} >/dev/null

        # Curate data/config/ to the HIP-1494 package set. The base zip and the
        # vendored overlay ship node-local files (e.g. evm-addresses-blocklist.csv,
        # CNtoBNConfig/, a default block-nodes.json) that are NOT part of the HIP
        # package format. The consensus node receives config only via operator-created
        # config CRs, so leaving unrecognised files in data/config/ makes the UC abort
        # at execute time. Keep only the filenames HIP-1494 defines for data/config/.
        info "Curating data/config to the HIP-1494 package set"
        keep="application.properties application-override.properties api-permission.properties bootstrap.properties node.properties feeSchedules.json simpleFeesSchedules.json throttles.json genesis-network.json"
        if [ -d data/config ]; then
          for path in data/config/* data/config/.[!.]*; do
            [ -e "$path" ] || continue
            base="$(basename "$path")"
            case " $keep " in
              *" $base "*) ;;
              *) warn "Pruning non-HIP config: data/config/$base"; rm -rf "$path" ;;
            esac
          done
        fi

        # Per-CN block-node config fixtures (issue #1071). Per HIP-1494 the UC selects
        # the file matching the target node NODE_ID and stages it verbatim as
        # data/config/block-nodes.json. This dev network deploys no block node and runs
        # with blockStream.streamMode=RECORDS (streaming disabled), so the fixture is an
        # empty node list: valid CN schema ({"nodes":[<addr>:<streamingPort>,priority]}),
        # parses cleanly, and — since the block-node subsystem still initialises at
        # startup — avoids the connection-attempt warnings a populated-but-unreachable
        # entry would emit. Add a node object here only when a block node is deployed.
        info "Adding per-node block-nodes config fixtures"
        mkdir -p block-nodes/config
        for nid in 0 1 2; do
          printf "%s\n" "{\"nodes\":[]}" > "block-nodes/config/block-nodes-${nid}.json"
        done

        if [ -f "data/config/bootstrap.properties" ]; then
          info "Modifying bootstrap properties"
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i "" "s/contracts.maxNumWithHapiSigsAccess=.*//g" data/config/bootstrap.properties
          else
            sed -i "s/contracts.maxNumWithHapiSigsAccess=.*//g" data/config/bootstrap.properties
          fi
        fi

        # Ensure genesis-network.json exists for Hedera 0.71+ compatibility
        if [ ! -f "data/config/genesis-network.json" ]; then
          info "Creating genesis-network.json for Hedera 0.71+ compatibility"
          mkdir -p data/config
          if [ -f "./genesis-network.json" ]; then
            cp ./genesis-network.json data/config/
          else
            err "genesis-network.json not found"
            exit 1
          fi
        else
          info "genesis-network.json already exists"
        fi

        popd >/dev/null

        # Embed the UC manifest (manifests/consensus-node-components.yaml), pinned
        # to the image for THIS version, into the extracted tree so the zip captures it.
        '
      - task: build:uc-manifest
        vars: { OUT_DIR: '{{ .EXTRACT_DIR }}/manifests', CN_VERSION: '{{ .VERSION }}' }
      - task: build:infra-manifest
        vars: { OUT_DIR: '{{ .EXTRACT_DIR }}/manifests' }
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔧  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }

        pushd {{ .EXTRACT_DIR }} >/dev/null

        # config.txt is host-specific; the consensus node regenerates it.
        [ -f "config.txt" ] && rm config.txt || true

        info "Creating {{ .ZIP }}"
        zip -r ../{{ .STAGING_DIR }}/{{ .ZIP }} * >/dev/null

        popd >/dev/null

        ok "Created {{ .STAGING_DIR }}/{{ .ZIP }} (real VERSION={{ .VERSION }})"
        '

  clean:
    desc: "Remove generated artifacts (extracted tree + staging zips)"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        rm -rf {{ .EXTRACT_DIR }} {{ .STAGING_DIR }}
        echo "✅  Cleaned {{ .EXTRACT_DIR }} and {{ .STAGING_DIR }}"
        '

  overlay:update:
    desc: "Refresh vendored ./overlay from hiero-local-node @ HIERO_LOCAL_NODE_COMMIT"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        COMMIT="{{ .HIERO_LOCAL_NODE_COMMIT }}"
        SRC="compose-network/network-node"
        TMP="$(mktemp -d)"
        trap "rm -rf \"$TMP\"" EXIT

        info "Cloning hiero-local-node @ $COMMIT"
        git clone --quiet https://github.com/hiero-ledger/hiero-local-node.git "$TMP/hln"
        git -C "$TMP/hln" checkout --quiet "$COMMIT"

        [ -d "$TMP/hln/$SRC" ] || { err "$SRC not found at $COMMIT"; exit 1; }

        info "Refreshing ./{{ .OVERLAY_DIR }}"
        # Preserve our provenance README across the refresh.
        README="{{ .OVERLAY_DIR }}/README.md"
        SAVED=""
        if [ -f "$README" ]; then SAVED="$(mktemp)"; cp "$README" "$SAVED"; fi
        rm -rf "{{ .OVERLAY_DIR }}"
        cp -R "$TMP/hln/$SRC" "{{ .OVERLAY_DIR }}"
        if [ -n "$SAVED" ]; then cp "$SAVED" "$README"; rm -f "$SAVED"; fi

        ok "Updated ./{{ .OVERLAY_DIR }} from hiero-local-node @ $COMMIT"
        echo "   Update the commit in overlay/README.md if it changed, then commit the diff."
        '
