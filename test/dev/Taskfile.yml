version: '3'

# -----------------------------------------------------------------------------
# Builds a Hedera consensus-node deployment package ("build.zip") for exercising
# the solo-operator UC sidecar locally.
#
# The package mirrors the real extracted upgrade layout the consensus node
# writes into its --marker-path, and additionally carries a UC manifest at
#   manifests/consensus-node-components.yaml
# with DETERMINISTIC layer hashes (RootFS diff_ids) computed straight from the
# published consensus-node image, so the operator's deterministic verification
# (internal/registry/checker.go) passes against it.
#
# The node config overlaid onto the package is vendored under ./overlay (see
# overlay/README.md for provenance), so the only network download is the
# consensus-node software zip itself.
#
# Usage:
#   task setup     # download the consensus-node source build-v<ver>.zip
#   task build     # produce staging/build-v<ver>.zip and staging/build-v9.99.99.zip
#
# Tooling required for the UC manifest step: `crane` and `jq`.
#   go install github.com/google/go-containerregistry/cmd/crane@latest
# -----------------------------------------------------------------------------

vars:
  # Node config overlaid onto the extracted package (vendored — no external clone).
  OVERLAY_DIR: overlay
  # hiero-local-node revision the vendored overlay/ was sourced from. Bump this
  # and run `task overlay:update` to refresh the vendored files.
  HIERO_LOCAL_NODE_COMMIT: "e2a7aeaa6664bc8eef580e16687ca9eea00e0d0d"

  # Primary input — just specify the version number.
  HEDERA_VERSION: "0.74.0"
  # Derived: "0.74.0" -> "0.74"
  HEDERA_VERSION_SHORT: '{{ regexReplaceAll `^(\d+\.\d+).*` .HEDERA_VERSION "${1}" }}'
  HEDERA_ZIP: 'build-v{{ .HEDERA_VERSION }}.zip'
  HEDERA_ZIP_URL: 'https://builds.hedera.com/node/software/v{{ .HEDERA_VERSION_SHORT }}/{{ .HEDERA_ZIP }}'
  # Repackaged copy with VERSION bumped to 9.99.99, used to drive upgrade tests.
  HEDERA_UPGRADE_ZIP: build-v9.99.99.zip

  STAGING_DIR: staging
  EXTRACT_DIR: extracted

  # Consensus-node image the UC manifest points at. Layer hashes are the RootFS
  # diff_ids of THIS image, per platform, so deterministic verification matches
  # what the operator computes via go-containerregistry.
  CN_IMAGE: "gcr.io/hedera-registry/consensus-node"
  CN_VERSION: '{{ .HEDERA_VERSION }}'
  # Space-separated platforms to emit layer hashes for. A platform the image
  # does not publish is skipped with a warning.
  CN_PLATFORMS: "linux/amd64 linux/arm64"

silent: true
tasks:
  setup:
    desc: "Download the consensus-node source build-v<ver>.zip"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        info "Checking Hedera artifact \`{{ .HEDERA_ZIP }}\`"
        if [ ! -f "{{ .HEDERA_ZIP }}" ]; then
          info "Downloading {{ .HEDERA_ZIP }} from {{ .HEDERA_ZIP_URL }}"
          curl -sSLO {{ .HEDERA_ZIP_URL }} && ok "Downloaded {{ .HEDERA_ZIP }}" || { err "Failed to download {{ .HEDERA_ZIP }}"; exit 1; }
        else
          ok "{{ .HEDERA_ZIP }} already exists, skipping download"
        fi

        info "Setup complete"
        '

  build:
    desc: "Build build.zip (base + upgrade) including the UC manifest with deterministic layer hashes"
    deps: [setup]
    cmds:
      - task: build:hedera-zip
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        info "Staging tree"
        tree {{ .STAGING_DIR }} 2>/dev/null || ls -la {{ .STAGING_DIR }}
        '

  build:uc-manifest:
    desc: "Generate manifests/consensus-node-components.yaml with deterministic layer hashes (RootFS diff_ids)"
    vars:
      # Output directory for the manifest; defaults into the extracted tree so it
      # is captured by the zip step. Override with OUT_DIR=... for standalone use.
      OUT_DIR: '{{ .OUT_DIR | default (printf "%s/manifests" .EXTRACT_DIR) }}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        IMAGE="{{ .CN_IMAGE }}:{{ .CN_VERSION }}"
        OUT_DIR="{{ .OUT_DIR }}"
        MANIFEST="$OUT_DIR/consensus-node-components.yaml"

        command -v crane >/dev/null 2>&1 || { err "crane not found — install: go install github.com/google/go-containerregistry/cmd/crane@latest"; exit 1; }
        command -v jq    >/dev/null 2>&1 || { err "jq not found — install jq"; exit 1; }

        info "Computing deterministic layer hashes for $IMAGE"
        mkdir -p "$OUT_DIR"

        # Build the layerHashes block in a temp file so we can fail if no platform
        # yielded any diff_ids (a bad image ref must not produce an empty manifest).
        layers_block="$(mktemp)"
        trap "rm -f \"$layers_block\"" EXIT
        emitted=0
        for p in {{ .CN_PLATFORMS }}; do
          if ! cfg="$(crane config "$IMAGE" --platform "$p" 2>/dev/null)"; then
            warn "skip $p — image does not publish this platform"
            continue
          fi
          ids="$(printf "%s" "$cfg" | jq -r ".rootfs.diff_ids[]?")"
          if [ -z "$ids" ]; then
            warn "skip $p — no rootfs.diff_ids in config"
            continue
          fi
          {
            echo "        $p:"
            while IFS= read -r d; do echo "          - \"$d\""; done <<< "$ids"
          } >> "$layers_block"
          ok "$p: $(printf "%s\n" "$ids" | grep -c .) layer hash(es)"
          emitted=$((emitted+1))
        done
        [ "$emitted" -gt 0 ] || { err "no layer hashes computed for $IMAGE on any of: {{ .CN_PLATFORMS }}"; exit 1; }

        {
          echo "schemaVersion: 1"
          echo "images:"
          echo "  consensusNode:"
          echo "    version: \"{{ .CN_VERSION }}\""
          echo "    deterministic:"
          echo "      supported: true"
          echo "      layerHashes:"
          cat "$layers_block"
          echo "    registries:"
          echo "      - image: \"$IMAGE\""
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '

  build:hedera-zip:
    desc: "Extract the source package, overlay config, embed the UC manifest, and re-zip"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔧  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        info "Building Hedera ZIP artifacts for staging"

        # Clean up previous builds
        rm -rf {{ .EXTRACT_DIR }} || true
        rm -f {{ .STAGING_DIR }}/*.zip || true
        mkdir -p {{ .EXTRACT_DIR }}
        mkdir -p {{ .STAGING_DIR }}

        if [ ! -f "{{ .HEDERA_ZIP }}" ]; then
          err "Source file {{ .HEDERA_ZIP }} not found — run \`task setup\` first"
          exit 1
        fi

        info "Extracting {{ .HEDERA_ZIP }}"
        unzip -q {{ .HEDERA_ZIP }} -d {{ .EXTRACT_DIR }}

        if [ -d "./{{ .OVERLAY_DIR }}" ]; then
          info "Overlaying vendored node configuration from ./{{ .OVERLAY_DIR }}"
          cp -Rf ./{{ .OVERLAY_DIR }}/* {{ .EXTRACT_DIR }}/
        else
          err "Vendored overlay ./{{ .OVERLAY_DIR }} not found"
          exit 1
        fi

        pushd {{ .EXTRACT_DIR }} >/dev/null

        # Per-CN block-node config fixtures (issue #1071) — MOCK files; NMT only
        # selects the file matching install -g <node_id>, it does not parse them.
        info "Adding per-node block-nodes config fixtures"
        mkdir -p block-nodes/config
        printf "%s\n" "{\"nodeId\":0}" > block-nodes/config/block-nodes-0.json
        printf "%s\n" "{\"nodeId\":1}" > block-nodes/config/block-nodes-1.json
        printf "%s\n" "{\"nodeId\":2}" > block-nodes/config/block-nodes-2.json

        if [ -f "data/config/bootstrap.properties" ]; then
          info "Modifying bootstrap properties"
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i "" "s/contracts.maxNumWithHapiSigsAccess=.*//g" data/config/bootstrap.properties
          else
            sed -i "s/contracts.maxNumWithHapiSigsAccess=.*//g" data/config/bootstrap.properties
          fi
        fi

        # Ensure genesis-network.json exists for Hedera 0.71+ compatibility
        if [ ! -f "data/config/genesis-network.json" ]; then
          info "Creating genesis-network.json for Hedera 0.71+ compatibility"
          mkdir -p data/config
          if [ -f "./genesis-network.json" ]; then
            cp ./genesis-network.json data/config/
          else
            err "genesis-network.json not found"
            exit 1
          fi
        else
          info "genesis-network.json already exists"
        fi

        popd >/dev/null

        # Embed the UC manifest (manifests/consensus-node-components.yaml) into the
        # extracted tree so it is captured by both zips below.
        '
      - task: build:uc-manifest
        vars: { OUT_DIR: '{{ .EXTRACT_DIR }}/manifests' }
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔧  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }

        pushd {{ .EXTRACT_DIR }} >/dev/null

        info "Creating {{ .HEDERA_ZIP }} for NMT"
        zip -r ../{{ .STAGING_DIR }}/{{ .HEDERA_ZIP }} * >/dev/null

        info "Creating {{ .HEDERA_UPGRADE_ZIP }} for upgrade testing"
        if [ -f "VERSION" ]; then
          cp VERSION VERSION.backup
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i "" "s/VERSION=.*$/VERSION=9.99.99/g" VERSION
          else
            sed -i "s/VERSION=.*$/VERSION=9.99.99/g" VERSION
          fi
          zip -r ../{{ .STAGING_DIR }}/{{ .HEDERA_UPGRADE_ZIP }} * >/dev/null
          mv VERSION.backup VERSION
        else
          echo "VERSION=9.99.99" > VERSION
          zip -r ../{{ .STAGING_DIR }}/{{ .HEDERA_UPGRADE_ZIP }} * >/dev/null
          rm VERSION
        fi

        # config.txt is host-specific; the consensus node regenerates it.
        [ -f "config.txt" ] && rm config.txt || true

        popd >/dev/null

        ok "Hedera ZIP artifacts created:"
        ok "  - {{ .STAGING_DIR }}/{{ .HEDERA_ZIP }} (base version)"
        ok "  - {{ .STAGING_DIR }}/{{ .HEDERA_UPGRADE_ZIP }} (upgrade version)"
        '

  clean:
    desc: "Remove generated artifacts (extracted tree + staging zips)"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        rm -rf {{ .EXTRACT_DIR }} {{ .STAGING_DIR }}
        echo "✅  Cleaned {{ .EXTRACT_DIR }} and {{ .STAGING_DIR }}"
        '

  overlay:update:
    desc: "Refresh vendored ./overlay from hiero-local-node @ HIERO_LOCAL_NODE_COMMIT"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        COMMIT="{{ .HIERO_LOCAL_NODE_COMMIT }}"
        SRC="compose-network/network-node"
        TMP="$(mktemp -d)"
        trap "rm -rf \"$TMP\"" EXIT

        info "Cloning hiero-local-node @ $COMMIT"
        git clone --quiet https://github.com/hiero-ledger/hiero-local-node.git "$TMP/hln"
        git -C "$TMP/hln" checkout --quiet "$COMMIT"

        [ -d "$TMP/hln/$SRC" ] || { err "$SRC not found at $COMMIT"; exit 1; }

        info "Refreshing ./{{ .OVERLAY_DIR }}"
        # Preserve our provenance README across the refresh.
        README="{{ .OVERLAY_DIR }}/README.md"
        SAVED=""
        if [ -f "$README" ]; then SAVED="$(mktemp)"; cp "$README" "$SAVED"; fi
        rm -rf "{{ .OVERLAY_DIR }}"
        cp -R "$TMP/hln/$SRC" "{{ .OVERLAY_DIR }}"
        if [ -n "$SAVED" ]; then cp "$SAVED" "$README"; rm -f "$SAVED"; fi

        ok "Updated ./{{ .OVERLAY_DIR }} from hiero-local-node @ $COMMIT"
        echo "   Update the commit in overlay/README.md if it changed, then commit the diff."
        '
