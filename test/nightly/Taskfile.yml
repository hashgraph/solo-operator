version: '3'

tasks:
  setup:rustfs:
    desc: Install RustFS and create the solo-streams and solo-backups buckets
    cmds:
      - helm repo add rustfs https://charts.rustfs.com
      - helm repo update
      - helm upgrade --install --namespace rustfs --create-namespace --values setup/rustfs-values.yaml --version 1.0.1 --wait --timeout 300s rustfs rustfs/rustfs
      - |
        kubectl run rustfs-buckets --rm -i --restart=Never -n rustfs --image=amazon/aws-cli:2.17.0 \
          --env=AWS_ACCESS_KEY_ID=solo-operator --env=AWS_SECRET_ACCESS_KEY=changeme --env=AWS_DEFAULT_REGION=us-east-1 \
          --command -- sh -c '
            for b in solo-streams solo-backups; do
              aws --endpoint-url http://rustfs-svc.rustfs.svc.cluster.local:9000 s3api head-bucket --bucket "$b" 2>/dev/null ||
                aws --endpoint-url http://rustfs-svc.rustfs.svc.cluster.local:9000 s3 mb "s3://$b"
            done'

  deploy:orbit:
    desc: Create the solo-orbit namespace and deploy Orbit
    cmds:
      - kubectl create namespace solo-orbit --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f common/orbit.yaml

  deploy:common:
    desc: Deploy common secrets
    deps: [deploy:orbit]
    cmds:
      - kubectl apply -f common/secrets.yaml

  deploy:nodes:
    desc: Deploy all node secrets and consensus capsules
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node0/secrets.yaml
      - kubectl apply -f node0/consensus-capsule.yaml
      - kubectl apply -f node1/secrets.yaml
      - kubectl apply -f node1/consensus-capsule.yaml
      - kubectl apply -f node2/secrets.yaml
      - kubectl apply -f node2/consensus-capsule.yaml
      - kubectl apply -f node3/secrets.yaml
      - kubectl apply -f node3/consensus-capsule.yaml

  deploy:genesis:
    desc: Run network genesis
    deps: [deploy:nodes]
    cmds:
      - kubectl apply -f network-genesis/network-genesis.yaml
      - echo ">> Waiting for genesis to complete..."
      - kubectl wait --for=jsonpath='{.status.phase}'=Succeeded networkgenesis/network-genesis -n solo-orbit --timeout=300s
      - echo ">> Genesis completed successfully"

  deploy:
    desc: Full deploy — rustfs + orbit + nodes + genesis + wait for pods ready
    cmds:
      - task: setup:rustfs
      - task: deploy:genesis
      - echo ">> Waiting for all consensus node pods to be ready..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n solo-orbit --timeout=300s
      - echo ">> All nodes ready"
