# Mirror Importer Secrets
# Used by Hedera Mirror Node to download streams from S3/MinIO
apiVersion: v1
kind: Secret
metadata:
  name: mirror-secrets
  namespace: solo-orbit
  labels:
    app.kubernetes.io/managed-by: solo-operator
type: Opaque
stringData:
  # ACCESS_KEY: solo
  # SECRET_KEY: changeme
  # TYPE: S3
  # URI: http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000
  HEDERA_MIRROR_IMPORTER_DOWNLOADER_SOURCES_0_CREDENTIALS_ACCESSKEY: "solo"
  HEDERA_MIRROR_IMPORTER_DOWNLOADER_SOURCES_0_CREDENTIALS_SECRETKEY: "changeme"
  HEDERA_MIRROR_IMPORTER_DOWNLOADER_SOURCES_0_TYPE: "S3"
  HEDERA_MIRROR_IMPORTER_DOWNLOADER_SOURCES_0_URI: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
---
# Uploader Secrets (Cheetah)
# Used by Cheetah stream uploaders (blocks, records, events)
apiVersion: v1
kind: Secret
metadata:
  name: uploader-mirror-secrets
  namespace: solo-orbit
  labels:
    app.kubernetes.io/managed-by: solo-operator
type: Opaque
stringData:
  # MinIO/S3 credentials
  AWS_ACCESS_KEY_ID: "solo-operator"
  AWS_SECRET_ACCESS_KEY: "changeme"
  S3_ACCESS_KEY: "solo-operator"
  S3_SECRET_KEY: "changeme"
  # GCS credentials (empty if not using GCS)
  GCS_ACCESS_KEY: ""
  GCS_SECRET_KEY: ""
---
# Backup Uploader Secrets (rclone)
# Used by backup uploader sidecar for state backups
apiVersion: v1
kind: Secret
metadata:
  name: backup-uploader-secrets
  namespace: solo-orbit
  labels:
    app.kubernetes.io/managed-by: solo-operator
type: Opaque
stringData:
  # MinIO/S3 credentials for rclone
  AWS_ACCESS_KEY_ID: "solo-operator"
  AWS_SECRET_ACCESS_KEY: "changeme"
  S3_ACCESS_KEY: "solo-operator"
  S3_SECRET_KEY: "changeme"
  RCLONE_S3_ACCESS_KEY_ID: "solo-operator"
  RCLONE_S3_SECRET_ACCESS_KEY: "changeme"
---
# Relay Operator Credentials
# Used by relay and relay-websocket HelmCapsules (OPERATOR_ID_MAIN / OPERATOR_KEY_MAIN).
# This is the well-known solo genesis key for account 0.0.2
apiVersion: v1
kind: Secret
metadata:
  name: relay-operator-creds
  namespace: solo-orbit
  labels:
    app.kubernetes.io/managed-by: solo-operator
type: Opaque
stringData:
  values.yaml: |
    config:
      OPERATOR_ID_MAIN: "0.0.2"
      # Test-only key — solo genesis account 0.0.2 (not a real secret) # gitleaks:allow # pragma: allowlist secret # noqa: S105
      OPERATOR_KEY_MAIN: "302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137"

