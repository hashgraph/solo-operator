tenant:
  name: minio-tenant
  configSecret:
    name: myminio-env-configuration
    accessKey: solo-operator
    secretKey: changeme
  pools:
    - servers: 1
      name: pool-0
      volumesPerServer: 2
      size: 2Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
  mountPath: /export
  subPath: /data
  metrics:
    enabled: false
  certificate:
    requestAutoCert: false
  features:
    bucketDNS: false
    enableSFTP: false
  buckets:
    - name: "solo-streams"
    - name: "solo-backups"
  podManagementPolicy: Parallel
  env:
    - name: MINIO_BROWSER_LOGIN_ANIMATION
      value: "off"
