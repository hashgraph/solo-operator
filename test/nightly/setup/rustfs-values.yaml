# RustFS (S3-compatible object storage) for the nightly kind cluster. Chart: https://charts.rustfs.com
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

secret:
  rustfs:
    access_key: solo-operator
    secret_key: changeme

ingress:
  enabled: false

storageclass:
  name: standard
  dataStorageSize: 10Gi
  logStorageSize: 1Gi
