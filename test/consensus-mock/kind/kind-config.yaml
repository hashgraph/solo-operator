#
# Publishes registry.yaml's NodePort as localhost:5001 for host-side docker push/crane.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30500
        hostPort: 5001
        protocol: TCP
