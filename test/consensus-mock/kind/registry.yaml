apiVersion: v1
kind: Namespace
metadata:
  name: local-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: local-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: local-registry
spec:
  type: NodePort
  clusterIP: 10.96.100.100
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
