version: '3'

# Standalone Taskfile for consensus-mock (see README.md); invoke as `task -d test/consensus-mock <task>`.

includes:
  root:
    taskfile: ../../Taskfile.yml
    dir: ../..
    internal: true
  example:
    taskfile: ../../docs/example/Taskfile.yml
    dir: ../../docs/example
    internal: true

vars:
  # MOCK_IMG (not IMG) avoids colliding with root Taskfile's own IMG var.
  MOCK_IMG: '{{.MOCK_IMG | default "ghcr.io/hashgraph/solo-operator/consensus-mock:dev"}}'
  CN_PLATFORMS: "linux/amd64 linux/arm64"
  CLUSTER: solo-operator
  NS: solo-orbit
  V1: "0.1.0"
  V2: "0.2.0"
  IMG_REPO: ghcr.io/hashgraph/solo-operator/consensus-mock
  IMG_V1: '{{.IMG_REPO}}:{{.V1}}'
  IMG_V2: '{{.IMG_REPO}}:{{.V2}}'
  # internal/resources/consensus/defaults.go: GenesisInitImage (hardcoded, not per-capsule configurable).
  GENESIS_INIT_IMG: "busybox:1.36.1"
  # Well-known 0.0.2 genesis payer key, also used by docs/beacon/Taskfile.yml.
  ACCOUNT2_KEY_HEX: "302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137"

silent: true
tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  e2e:
    desc: "Full pipeline: build+load mock/beacon/operator images, kind cluster, Helm install, deploy, prepare+freeze"
    cmds:
      - task: cluster
      - task: docker:build:versions
      - task: kind:load:versions
      - task: kind:load:beacon
      - task: kind:load:uc
      - task: kind:load:genesis-init
      - task: operator:deploy
      - task: deploy
      - task: beacon:config
      - task: beacon:prepare
      - task: beacon:freeze

  build:
    desc: "Build the consensus-mock binary for the current platform"
    cmds:
      - go build -o bin/consensus-mock .

  build:all:linux-amd64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/consensus-mock-linux-amd64 .
      - chmod +x bin/consensus-mock-linux-amd64

  build:all:linux-arm64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/consensus-mock-linux-arm64 .
      - chmod +x bin/consensus-mock-linux-arm64

  build:all:
    desc: "Cross-compile consensus-mock for linux/amd64 and linux/arm64 (parallel)"
    run: once
    deps: [build:all:linux-amd64, build:all:linux-arm64]

  hash:
    desc: "Generate SHA256 checksums for the cross-compiled binaries"
    run: once
    deps: [build:all]
    cmds:
      - cd bin && sha256sum consensus-mock-linux-amd64 > consensus-mock-linux-amd64.sha256
      - cd bin && sha256sum consensus-mock-linux-arm64 > consensus-mock-linux-arm64.sha256

  docker:build:
    desc: "Build the consensus-mock image (tag with MOCK_IMG=...)"
    deps: [hash]
    cmds:
      - docker build -t {{.MOCK_IMG}} .

  docker:push:
    desc: "Push the consensus-mock image built by docker:build"
    cmds:
      - docker push {{.MOCK_IMG}}

  build:manifest:
    desc: "Generate manifests/consensus-node-components.yaml with real deterministic layer hashes for IMAGE"
    vars:
      OUT_DIR: '{{.OUT_DIR | default "manifests"}}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        [ -n "{{.IMAGE}}" ] || { err "IMAGE=<pushed consensus-mock image ref> is required"; exit 1; }
        command -v crane >/dev/null 2>&1 || { err "crane not found — install: go install github.com/google/go-containerregistry/cmd/crane@v0.22.0"; exit 1; }
        command -v jq    >/dev/null 2>&1 || { err "jq not found — install jq"; exit 1; }

        OUT_DIR="{{.OUT_DIR}}"
        MANIFEST="$OUT_DIR/consensus-node-components.yaml"
        mkdir -p "$OUT_DIR"

        info "Computing deterministic layer hashes for {{.IMAGE}}"
        layers_block="$(mktemp)"
        trap "rm -f \"$layers_block\"" EXIT
        emitted=0
        for p in {{.CN_PLATFORMS}}; do
          if ! cfg="$(crane config "{{.IMAGE}}" --platform "$p" 2>/dev/null)"; then
            warn "skip $p — image does not publish this platform"
            continue
          fi
          ids="$(printf "%s" "$cfg" | jq -r ".rootfs.diff_ids[]?")"
          if [ -z "$ids" ]; then
            warn "skip $p — no rootfs.diff_ids in config"
            continue
          fi
          {
            echo "        $p:"
            while IFS= read -r d; do echo "          - \"$d\""; done <<< "$ids"
          } >> "$layers_block"
          ok "$p: $(printf "%s\n" "$ids" | grep -c .) layer hash(es)"
          emitted=$((emitted+1))
        done
        [ "$emitted" -gt 0 ] || { err "no layer hashes computed for {{.IMAGE}} on any of: {{.CN_PLATFORMS}}"; exit 1; }

        {
          echo "schemaVersion: 1"
          echo "images:"
          echo "  consensusNode:"
          echo "    version: \"mock\""
          echo "    deterministic:"
          echo "      supported: true"
          echo "      layerHashes:"
          cat "$layers_block"
          echo "    registries:"
          echo "      - image: \"{{.IMAGE}}\""
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '

  # ── local kind harness (0.1.0 -> 0.2.0 upgrade flow via beacon Jobs) ────────

  docker:build:v1:
    desc: "Build consensus-mock image tagged {{.V1}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V1}}' }

  docker:build:v2:
    desc: "Build consensus-mock image tagged {{.V2}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V2}}' }

  docker:build:versions:
    desc: "Build both consensus-mock version tags ({{.V1}}, {{.V2}}) — same code, different tags"
    deps: [docker:build:v1, docker:build:v2]

  kind:load:v1:
    desc: "Load consensus-mock:{{.V1}} into kind"
    cmds:
      - kind load docker-image {{.IMG_V1}} --name {{.CLUSTER}}

  kind:load:v2:
    desc: "Load consensus-mock:{{.V2}} into kind"
    cmds:
      - kind load docker-image {{.IMG_V2}} --name {{.CLUSTER}}

  kind:load:versions:
    desc: "Load both consensus-mock version tags into kind"
    deps: [kind:load:v1, kind:load:v2]

  kind:load:beacon:
    desc: "Build the beacon image, tag :dev, and load it into kind"
    cmds:
      - task: root:docker:build:beacon
      - task: root:kind:load:beacon

  kind:load:uc:
    desc: "Build the UC sidecar image, tag :dev, and load it into kind"
    cmds:
      - task: root:docker:build:uc
      - task: root:kind:load:uc

  kind:load:genesis-init:
    desc: "Pull and load the genesis-init image ({{.GENESIS_INIT_IMG}}) into kind"
    cmds:
      - |
        # kind load docker-image chokes on multi-arch manifest lists; pull+save one platform instead.
        PLATFORM="linux/$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
        TAR="$(mktemp -t genesis-init.XXXX.tar)"
        docker pull --platform "$PLATFORM" {{.GENESIS_INIT_IMG}}
        docker save --platform "$PLATFORM" -o "$TAR" {{.GENESIS_INIT_IMG}}
        kind load image-archive "$TAR" --name {{.CLUSTER}}
        rm -f "$TAR"

  cluster:
    desc: "Reset the kind cluster ({{.CLUSTER}}) and install CRDs"
    cmds:
      - task: root:kind:reset

  operator:deploy:
    desc: "Build solo-operator from local source, load it into kind, and deploy via Helm — never pulls from a registry"
    cmds:
      - task: root:docker:build
      - task: root:kind:load
      - |
        helm upgrade --install solo-operator ../../charts/solo-operator \
          --namespace solo-operator --create-namespace --wait --timeout 120s \
          --set image.tag=dev --set image.pullPolicy=Never --set crds.install=false
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=solo-operator -n solo-operator --timeout=120s

  deploy:
    desc: "Deploy a single-node network (node0) running consensus-mock:MOCK_TAG (default {{.V1}}) + genesis"
    vars:
      # MOCK_TAG (not VERSION) avoids colliding with root Taskfile's own VERSION var.
      MOCK_TAG: '{{.MOCK_TAG | default .V1}}'
    cmds:
      # example:deploy:common depends on example:deploy:orbit (the shared
      # common/orbit.yaml) — apply kind/orbit.yaml last so ours wins.
      - task: example:deploy:common
      - kubectl apply -f kind/orbit.yaml
      - IMAGE_TAG={{.MOCK_TAG}} envsubst < kind/consensus-capsule.yaml | kubectl apply -f -
      - kubectl apply -f ../../docs/example/node0/secrets.yaml
      - kubectl apply -f ../../docs/example/network-genesis/network-genesis.yaml
      - echo ">> Waiting for genesis to complete..."
      - kubectl wait --for=jsonpath='{.status.phase}'=Succeeded networkgenesis/network-genesis -n {{.NS}} --timeout=300s
      - echo ">> Waiting for node0 pod to be ready ..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n {{.NS}} --timeout=60s
      - echo ">> node0 ready on consensus-mock:{{.MOCK_TAG}}"

  beacon:config:
    desc: "Apply beacon's config ConfigMap + payer key Secret, pointed at node0's own Service"
    cmds:
      - kubectl apply -f kind/beacon-config.yaml
      - |
        bash -lc '
        set -euo pipefail
        PEM="$(printf -- "-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n" \
          "$(echo "{{.ACCOUNT2_KEY_HEX}}" | xxd -r -p | base64)")"
        kubectl create secret generic beacon-keys -n {{.NS}} \
          --from-literal=account2.pem="$PEM" --from-literal=account2.pass="" \
          --dry-run=client -o yaml | kubectl apply -f -
        '

  beacon:delete-job:
    internal: true
    desc: "Delete a beacon Job if it exists, so it can be re-applied (Job specs are immutable)"
    cmds:
      - kubectl delete job {{.JOB}} -n {{.NS}} --ignore-not-found

  beacon:wait-job:
    internal: true
    desc: "Wait for a beacon Job to complete and print its log"
    vars:
      TIMEOUT: '{{.TIMEOUT | default "60s"}}'
    cmds:
      - kubectl wait --for=condition=complete --timeout={{.TIMEOUT}} job/{{.JOB}} -n {{.NS}}
      - kubectl logs -n {{.NS}} job/{{.JOB}}

  beacon:stage-manifest:
    internal: true
    desc: "Stage a placeholder manifest so the UC can build a NetworkUpgradePrepare CR"
    vars:
      UPGRADE_PATH: /opt/hgcapp/services-hedera/HapiApp2.0/data/upgrade/current
    cmds:
      - kubectl exec node0-0 -c consensus-node -n {{.NS}} -- mkdir -p {{.UPGRADE_PATH}}/manifests
      - kubectl cp kind/placeholder-manifest.yaml {{.NS}}/node0-0:{{.UPGRADE_PATH}}/manifests/consensus-node-components.yaml -c consensus-node

  beacon:prepare:
    desc: "Run a beacon Job: freeze prepare (PREPARE_UPGRADE) against node0, and wait for its Prepare CR to succeed"
    cmds:
      - task: beacon:stage-manifest
      - |
        bash -lc '
        set -euo pipefail
        BASELINE="$(kubectl get networkupgradeprepares -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null)"

        kubectl delete job beacon-freeze-prepare -n {{.NS}} --ignore-not-found >/dev/null
        kubectl apply -f kind/job-freeze-prepare.yaml
        kubectl wait --for=condition=complete --timeout=60s job/beacon-freeze-prepare -n {{.NS}}
        kubectl logs -n {{.NS}} job/beacon-freeze-prepare

        echo ">> waiting for a new NetworkUpgradePrepare CR..."
        NAME=""
        for i in $(seq 1 90); do
          for n in $(kubectl get networkupgradeprepares -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null); do
            case " $BASELINE " in *" $n "*) ;; *) NAME="$n" ;; esac
          done
          [ -n "$NAME" ] && break
          sleep 1
        done
        [ -n "$NAME" ] || { echo "!! no new NetworkUpgradePrepare CR appeared" >&2; exit 1; }

        echo ">>   NetworkUpgradePrepare/$NAME — waiting for Succeeded..."
        kubectl wait --for=jsonpath="{.status.phase}"=Succeeded networkupgradeprepares/"$NAME" -n {{.NS}} --timeout=60s
        '

  beacon:freeze:
    desc: "Run a beacon Job: freeze upgrade (FREEZE_UPGRADE), scheduled {{.FREEZE_DELAY_MIN | default \"2\"}} min out; waits for its Freeze CR to succeed"
    vars:
      FREEZE_DELAY_MIN: '{{.FREEZE_DELAY_MIN | default "2"}}'
      WAIT_SECS:
        sh: echo "$(( {{.FREEZE_DELAY_MIN}} * 60 + 60 ))"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        BASELINE="$(kubectl get networkupgradefreezes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null)"

        kubectl delete job beacon-freeze-upgrade -n {{.NS}} --ignore-not-found >/dev/null
        START=$(date -u -v+{{.FREEZE_DELAY_MIN}}M "+%Y-%m-%d.%H:%M:%S" 2>/dev/null \
          || date -u -d "+{{.FREEZE_DELAY_MIN}} min" "+%Y-%m-%d.%H:%M:%S")
        echo ">> freeze start-time (UTC): $START"
        START_TIME="$START" envsubst < kind/job-freeze-upgrade.yaml | kubectl apply -f -
        kubectl wait --for=condition=complete --timeout={{.WAIT_SECS}}s job/beacon-freeze-upgrade -n {{.NS}}
        kubectl logs -n {{.NS}} job/beacon-freeze-upgrade

        echo ">> waiting for a new NetworkUpgradeFreeze CR..."
        NAME=""
        for i in $(seq 1 {{.WAIT_SECS}}); do
          for n in $(kubectl get networkupgradefreezes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null); do
            case " $BASELINE " in *" $n "*) ;; *) NAME="$n" ;; esac
          done
          [ -n "$NAME" ] && break
          sleep 1
        done
        [ -n "$NAME" ] || { echo "!! no new NetworkUpgradeFreeze CR appeared" >&2; exit 1; }

        echo ">>   NetworkUpgradeFreeze/$NAME — waiting for Succeeded..."
        kubectl wait --for=jsonpath="{.status.phase}"=Succeeded networkupgradefreezes/"$NAME" -n {{.NS}} --timeout={{.WAIT_SECS}}s
        '

  beacon:abort:
    desc: "Run a beacon Job: freeze abort (FREEZE_ABORT) against node0"
    cmds:
      - task: beacon:delete-job
        vars: { JOB: beacon-freeze-abort }
      - kubectl apply -f kind/job-freeze-abort.yaml
      - task: beacon:wait-job
        vars: { JOB: beacon-freeze-abort }

  beacon:watch:
    desc: "Watch the NetworkUpgrade* CRs advance (UC -> operator) — leave running in its own terminal"
    cmds:
      - |
        # kubectl -w only supports one resource type at a time, so poll instead.
        while true; do
          echo "──── $(date -u) ────"
          kubectl -n {{.NS}} get networkupgradeprepares,networkupgradefreezes,networkupgradeexecutes,networkupgradefreezeaborts
          sleep 2
        done

  uc:logs:
    desc: "Tail the UC sidecar log on node0 (marker detection, CR creation, ACTIVE)"
    cmds:
      - kubectl -n {{.NS}} logs -f node0-0 -c uc

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf bin manifests
