version: '3'

# -----------------------------------------------------------------------------
# Standalone Taskfile for consensus-mock, a fast fake consensus-node used to
# time the UC-driven upgrade flow (see README.md). Not wired into the root
# Taskfile — invoke as `task -d test/consensus-mock <task>`.
# -----------------------------------------------------------------------------

includes:
  root:
    taskfile: ../../Taskfile.yml
    dir: ../..
  example:
    taskfile: ../../docs/example/Taskfile.yml
    dir: ../../docs/example

vars:
  # Named MOCK_IMG, not IMG — the root Taskfile (included below as `root:`)
  # also defines a top-level IMG var, and go-task merges included taskfiles'
  # top-level vars into one global namespace, so a same-named var here would
  # pick up root's (non-empty) value instead of this default.
  MOCK_IMG: '{{.MOCK_IMG | default "ghcr.io/hashgraph/solo-operator/consensus-mock:dev"}}'
  CN_PLATFORMS: "linux/amd64 linux/arm64"
  # kind cluster name (matches root Taskfile's kind:* tasks).
  CLUSTER: solo-operator
  # Namespace all the kind/*.yaml manifests hardcode — not templated, so not a
  # var either (a var here would look configurable without actually being so).
  NS: solo-orbit
  V1: "0.1.0"
  V2: "0.2.0"
  # softwareVersion.repository is a required CRD field (BuildImage always
  # joins repository + "/" + imageName), so the local/kind tag must be
  # repository-qualified too, matching the existing IMG default above.
  IMG_REPO: ghcr.io/hashgraph/solo-operator/consensus-mock
  IMG_V1: '{{.IMG_REPO}}:{{.V1}}'
  IMG_V2: '{{.IMG_REPO}}:{{.V2}}'
  # Well-known 0.0.2 genesis payer key — same value docs/beacon/Taskfile.yml
  # derives its PEM from (ACCOUNT2_KEY_HEX) and docs/example/network-genesis
  # bootstraps against; public, dev-only. Kept as one hex source of truth
  # here too, rather than committing its pre-rendered PEM as a static Secret.
  ACCOUNT2_KEY_HEX: "302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137"

silent: true
tasks:
  build:
    desc: "Build the consensus-mock binary for the current platform"
    cmds:
      - go build -o bin/consensus-mock .

  build:all:linux-amd64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/consensus-mock-linux-amd64 .
      - chmod +x bin/consensus-mock-linux-amd64

  build:all:linux-arm64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/consensus-mock-linux-arm64 .
      - chmod +x bin/consensus-mock-linux-arm64

  build:all:
    desc: "Cross-compile consensus-mock for linux/amd64 and linux/arm64 (parallel)"
    run: once
    deps: [build:all:linux-amd64, build:all:linux-arm64]

  hash:
    desc: "Generate SHA256 checksums for the cross-compiled binaries"
    run: once
    deps: [build:all]
    cmds:
      - cd bin && sha256sum consensus-mock-linux-amd64 > consensus-mock-linux-amd64.sha256
      - cd bin && sha256sum consensus-mock-linux-arm64 > consensus-mock-linux-arm64.sha256

  docker:build:
    desc: "Build the consensus-mock image (tag with MOCK_IMG=...)"
    deps: [hash]
    cmds:
      - docker build -t {{.MOCK_IMG}} .

  docker:push:
    desc: "Push the consensus-mock image built by docker:build"
    cmds:
      - docker push {{.MOCK_IMG}}

  build:manifest:
    desc: "Generate manifests/consensus-node-components.yaml with real deterministic layer hashes for IMAGE"
    vars:
      OUT_DIR: '{{.OUT_DIR | default "manifests"}}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        [ -n "{{.IMAGE}}" ] || { err "IMAGE=<pushed consensus-mock image ref> is required"; exit 1; }
        command -v crane >/dev/null 2>&1 || { err "crane not found — install: go install github.com/google/go-containerregistry/cmd/crane@v0.22.0"; exit 1; }
        command -v jq    >/dev/null 2>&1 || { err "jq not found — install jq"; exit 1; }

        OUT_DIR="{{.OUT_DIR}}"
        MANIFEST="$OUT_DIR/consensus-node-components.yaml"
        mkdir -p "$OUT_DIR"

        info "Computing deterministic layer hashes for {{.IMAGE}}"
        layers_block="$(mktemp)"
        trap "rm -f \"$layers_block\"" EXIT
        emitted=0
        for p in {{.CN_PLATFORMS}}; do
          if ! cfg="$(crane config "{{.IMAGE}}" --platform "$p" 2>/dev/null)"; then
            warn "skip $p — image does not publish this platform"
            continue
          fi
          ids="$(printf "%s" "$cfg" | jq -r ".rootfs.diff_ids[]?")"
          if [ -z "$ids" ]; then
            warn "skip $p — no rootfs.diff_ids in config"
            continue
          fi
          {
            echo "        $p:"
            while IFS= read -r d; do echo "          - \"$d\""; done <<< "$ids"
          } >> "$layers_block"
          ok "$p: $(printf "%s\n" "$ids" | grep -c .) layer hash(es)"
          emitted=$((emitted+1))
        done
        [ "$emitted" -gt 0 ] || { err "no layer hashes computed for {{.IMAGE}} on any of: {{.CN_PLATFORMS}}"; exit 1; }

        {
          echo "schemaVersion: 1"
          echo "images:"
          echo "  consensusNode:"
          echo "    version: \"mock\""
          echo "    deterministic:"
          echo "      supported: true"
          echo "      layerHashes:"
          cat "$layers_block"
          echo "    registries:"
          echo "      - image: \"{{.IMAGE}}\""
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '

  # ── local kind harness (0.1.0 -> 0.2.0 upgrade flow via beacon Jobs) ────────

  docker:build:v1:
    desc: "Build consensus-mock image tagged {{.V1}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V1}}' }

  docker:build:v2:
    desc: "Build consensus-mock image tagged {{.V2}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V2}}' }

  docker:build:versions:
    desc: "Build both consensus-mock version tags ({{.V1}}, {{.V2}}) — same code, different tags"
    deps: [docker:build:v1, docker:build:v2]

  kind:load:v1:
    desc: "Load consensus-mock:{{.V1}} into kind"
    cmds:
      - kind load docker-image {{.IMG_V1}} --name {{.CLUSTER}}

  kind:load:v2:
    desc: "Load consensus-mock:{{.V2}} into kind"
    cmds:
      - kind load docker-image {{.IMG_V2}} --name {{.CLUSTER}}

  kind:load:versions:
    desc: "Load both consensus-mock version tags into kind"
    deps: [kind:load:v1, kind:load:v2]

  kind:load:beacon:
    desc: "Build the beacon image, tag :dev, and load it into kind"
    cmds:
      - task: root:docker:build:beacon
      - task: root:kind:load:beacon

  cluster:
    desc: "Reset the kind cluster ({{.CLUSTER}}) and install CRDs"
    cmds:
      - task: root:kind:reset

  deploy:
    desc: "Deploy a single-node network (node0) running consensus-mock:MOCK_TAG (default {{.V1}}) + genesis"
    vars:
      # Named MOCK_TAG, not VERSION — see the MOCK_IMG comment above; the root
      # Taskfile's own (non-empty) VERSION var would otherwise win over `default`.
      MOCK_TAG: '{{.MOCK_TAG | default .V1}}'
    cmds:
      - task: example:deploy:orbit
      - task: example:deploy:common
      - IMAGE_TAG={{.MOCK_TAG}} envsubst < kind/consensus-capsule.yaml | kubectl apply -f -
      - kubectl apply -f ../../docs/example/node0/secrets.yaml
      - kubectl apply -f ../../docs/example/network-genesis/network-genesis.yaml
      - echo ">> Waiting for genesis to complete..."
      - kubectl wait --for=jsonpath='{.status.phase}'=Succeeded networkgenesis/network-genesis -n {{.NS}} --timeout=300s
      - echo ">> Waiting for node0 pod to be ready (consensus-mock starts in seconds, not minutes)..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n {{.NS}} --timeout=60s
      - echo ">> node0 ready on consensus-mock:{{.MOCK_TAG}}"

  beacon:config:
    desc: "Apply beacon's config ConfigMap + payer key Secret, pointed at node0's own Service"
    cmds:
      - kubectl apply -f kind/beacon-config.yaml
      - |
        bash -lc '
        set -euo pipefail
        PEM="$(printf -- "-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n" \
          "$(echo "{{.ACCOUNT2_KEY_HEX}}" | xxd -r -p | base64)")"
        kubectl create secret generic beacon-keys -n {{.NS}} \
          --from-literal=account2.pem="$PEM" --from-literal=account2.pass="" \
          --dry-run=client -o yaml | kubectl apply -f -
        '

  beacon:delete-job:
    internal: true
    desc: "Delete a beacon Job if it exists, so it can be re-applied (Job specs are immutable)"
    cmds:
      - kubectl delete job {{.JOB}} -n {{.NS}} --ignore-not-found

  beacon:wait-job:
    internal: true
    desc: "Wait for a beacon Job to complete and print its log"
    vars:
      TIMEOUT: '{{.TIMEOUT | default "60s"}}'
    cmds:
      - kubectl wait --for=condition=complete --timeout={{.TIMEOUT}} job/{{.JOB}} -n {{.NS}}
      - kubectl logs -n {{.NS}} job/{{.JOB}}

  beacon:prepare:
    desc: "Run a beacon Job: freeze prepare (PREPARE_UPGRADE) against node0"
    cmds:
      - task: beacon:delete-job
        vars: { JOB: beacon-freeze-prepare }
      - kubectl apply -f kind/job-freeze-prepare.yaml
      - task: beacon:wait-job
        vars: { JOB: beacon-freeze-prepare }

  beacon:freeze:
    desc: "Run a beacon Job: freeze upgrade (FREEZE_UPGRADE), scheduled {{.FREEZE_DELAY_MIN | default \"2\"}} min out"
    vars:
      FREEZE_DELAY_MIN: '{{.FREEZE_DELAY_MIN | default "2"}}'
      TIMEOUT:
        sh: echo "$(( {{.FREEZE_DELAY_MIN}} * 60 + 60 ))s"
    cmds:
      - task: beacon:delete-job
        vars: { JOB: beacon-freeze-upgrade }
      - |
        START=$(date -u -v+{{.FREEZE_DELAY_MIN}}M '+%Y-%m-%d.%H:%M:%S' 2>/dev/null \
          || date -u -d '+{{.FREEZE_DELAY_MIN}} min' '+%Y-%m-%d.%H:%M:%S')
        echo ">> freeze start-time (UTC): $START"
        START_TIME="$START" envsubst < kind/job-freeze-upgrade.yaml | kubectl apply -f -
      - task: beacon:wait-job
        vars: { JOB: beacon-freeze-upgrade, TIMEOUT: '{{.TIMEOUT}}' }

  beacon:abort:
    desc: "Run a beacon Job: freeze abort (FREEZE_ABORT) against node0"
    cmds:
      - task: beacon:delete-job
        vars: { JOB: beacon-freeze-abort }
      - kubectl apply -f kind/job-freeze-abort.yaml
      - task: beacon:wait-job
        vars: { JOB: beacon-freeze-abort }

  beacon:watch:
    desc: "Watch the NetworkUpgrade* CRs advance (UC -> operator) — leave running in its own terminal"
    cmds:
      - |
        # kubectl's -w only supports a single resource type per invocation
        # (docs/beacon/Taskfile.yml's own `watch` task hits the same
        # "you may only specify a single resource type" error on kubectl
        # v1.37), so poll all four kinds in a loop instead.
        while true; do
          echo "──── $(date -u) ────"
          kubectl -n {{.NS}} get networkupgradeprepares,networkupgradefreezes,networkupgradeexecutes,networkupgradefreezeaborts
          sleep 2
        done

  uc:logs:
    desc: "Tail the UC sidecar log on node0 (marker detection, CR creation, ACTIVE)"
    cmds:
      - kubectl -n {{.NS}} logs -f node0-0 -c uc

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf bin manifests
