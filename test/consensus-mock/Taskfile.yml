version: '3'

# Standalone Taskfile for consensus-mock (see README.md); invoke as `task -d test/consensus-mock <task>`.

includes:
  root:
    taskfile: ../../Taskfile.yml
    dir: ../..
    internal: true
  example:
    taskfile: ../../docs/example/Taskfile.yml
    dir: ../../docs/example
    internal: true

vars:
  # MOCK_IMG (not IMG) avoids colliding with root Taskfile's own IMG var.
  MOCK_IMG: '{{.MOCK_IMG | default "ghcr.io/hashgraph/solo-operator/consensus-mock:dev"}}'
  CN_PLATFORMS: "linux/amd64 linux/arm64"
  CLUSTER: solo-operator
  NS: solo-orbit
  V1: "0.1.0"
  V2: "0.2.0"
  IMG_REPO: ghcr.io/hashgraph/solo-operator/consensus-mock
  IMG_V1: '{{.IMG_REPO}}:{{.V1}}'
  IMG_V2: '{{.IMG_REPO}}:{{.V2}}'
  # REGISTRY_HOST is the host-side push/crane address (kind-config.yaml); REGISTRY_CLUSTER_ADDR
  # is the in-cluster ClusterIP baked into generated manifests (see kind/registry.yaml).
  REGISTRY_HOST: "localhost:5001"
  REGISTRY_CLUSTER_IP: "10.96.100.100"
  REGISTRY_CLUSTER_ADDR: '{{.REGISTRY_CLUSTER_IP}}:5000'
  # internal/resources/consensus/defaults.go: GenesisInitImage (hardcoded, not per-capsule configurable).
  GENESIS_INIT_IMG: "busybox:1.36.1"
  # Well-known 0.0.2 genesis payer key, also used by docs/beacon/Taskfile.yml.
  ACCOUNT2_KEY_HEX: "302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137"

silent: true
tasks:
  build:
    desc: "Build the consensus-mock images tagged {{.V1}} and {{.V2}} (cross-compiled linux/amd64 + linux/arm64)"
    cmds:
      - task: docker:build:versions

  upgrade:
    desc: "Run the beacon upgrade ({{.V1}} -> {{.V2}}) against a running node0: prepare, freeze, wait for Execute"
    cmds:
      - task: beacon:config
      - task: beacon:prepare
      - task: beacon:freeze
      - task: wait:execute

  e2e:
    desc: "Full pipeline: build+load mock/beacon/operator images, kind cluster, Helm install, deploy, prepare+freeze+execute"
    cmds:
      - task: cluster
      - task: docker:build:versions
      - task: images:load:versions
      - task: kind:load:beacon
      - task: kind:load:uc
      - task: kind:load:genesis-init
      - task: operator:deploy
      - task: deploy
      - task: upgrade

  build:all:linux-amd64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/consensus-mock-linux-amd64 .
      - chmod +x bin/consensus-mock-linux-amd64

  build:all:linux-arm64:
    internal: true
    run: once
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/consensus-mock-linux-arm64 .
      - chmod +x bin/consensus-mock-linux-arm64

  build:all:
    internal: true
    desc: "Cross-compile consensus-mock for linux/amd64 and linux/arm64 (parallel)"
    run: once
    deps: [build:all:linux-amd64, build:all:linux-arm64]

  hash:
    internal: true
    desc: "Generate SHA256 checksums for the cross-compiled binaries"
    run: once
    deps: [build:all]
    cmds:
      - cd bin && sha256sum consensus-mock-linux-amd64 > consensus-mock-linux-amd64.sha256
      - cd bin && sha256sum consensus-mock-linux-arm64 > consensus-mock-linux-arm64.sha256

  docker:build:
    internal: true
    desc: "Build the consensus-mock image (tag with MOCK_IMG=...)"
    deps: [hash]
    cmds:
      - docker build -t {{.MOCK_IMG}} .

  build:manifest:
    internal: true
    desc: "Generate manifests/consensus-node-components.yaml with real deterministic layer hashes for IMAGE"
    vars:
      OUT_DIR: '{{.OUT_DIR | default "manifests"}}'
      # ref written into the manifest; defaults to IMAGE, which computes the hashes.
      CLUSTER_IMAGE: '{{.CLUSTER_IMAGE | default .IMAGE}}'
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        info(){ echo -e "\n\033[1;34m🔷  $1\033[0m"; }
        ok(){ echo -e "\033[1;32m✅  $1\033[0m"; }
        warn(){ echo -e "\033[1;33m⚠️   $1\033[0m"; }
        err(){ echo -e "\033[1;31m❌  $1\033[0m" >&2; }

        [ -n "{{.IMAGE}}" ] || { err "IMAGE=<pushed consensus-mock image ref, host-reachable (e.g. {{.REGISTRY_HOST}}/...)> is required"; exit 1; }
        command -v crane >/dev/null 2>&1 || { err "crane not found — install: go install github.com/google/go-containerregistry/cmd/crane@v0.22.0"; exit 1; }
        command -v jq    >/dev/null 2>&1 || { err "jq not found — install jq"; exit 1; }

        OUT_DIR="{{.OUT_DIR}}"
        MANIFEST="$OUT_DIR/consensus-node-components.yaml"
        mkdir -p "$OUT_DIR"

        info "Computing deterministic layer hashes for {{.IMAGE}}"
        layers_block="$(mktemp)"
        trap "rm -f \"$layers_block\"" EXIT
        emitted=0
        for p in {{.CN_PLATFORMS}}; do
          if ! cfg="$(crane config "{{.IMAGE}}" --platform "$p" 2>/dev/null)"; then
            warn "skip $p — image does not publish this platform"
            continue
          fi
          ids="$(printf "%s" "$cfg" | jq -r ".rootfs.diff_ids[]?")"
          if [ -z "$ids" ]; then
            warn "skip $p — no rootfs.diff_ids in config"
            continue
          fi
          {
            echo "        $p:"
            while IFS= read -r d; do echo "          - \"$d\""; done <<< "$ids"
          } >> "$layers_block"
          ok "$p: $(printf "%s\n" "$ids" | grep -c .) layer hash(es)"
          emitted=$((emitted+1))
        done
        [ "$emitted" -gt 0 ] || { err "no layer hashes computed for {{.IMAGE}} on any of: {{.CN_PLATFORMS}}"; exit 1; }

        {
          echo "schemaVersion: 1"
          echo "images:"
          echo "  consensusNode:"
          echo "    version: \"mock\""
          echo "    deterministic:"
          echo "      supported: true"
          echo "      layerHashes:"
          cat "$layers_block"
          echo "    registries:"
          echo "      - image: \"{{.CLUSTER_IMAGE}}\""
        } > "$MANIFEST"

        ok "Wrote $MANIFEST"
        echo "----------------------------------------"
        cat "$MANIFEST"
        echo "----------------------------------------"
        '


  docker:build:v1:
    internal: true
    desc: "Build consensus-mock image tagged {{.V1}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V1}}' }

  docker:build:v2:
    internal: true
    desc: "Build consensus-mock image tagged {{.V2}}"
    cmds:
      - task: docker:build
        vars: { MOCK_IMG: '{{.IMG_V2}}' }

  docker:build:versions:
    internal: true
    desc: "Build both consensus-mock version tags ({{.V1}}, {{.V2}}) — same code, different tags"
    deps: [docker:build:v1, docker:build:v2]

  kind:load:v1:
    internal: true
    desc: "Load consensus-mock:{{.V1}} into kind"
    cmds:
      - kind load docker-image {{.IMG_V1}} --name {{.CLUSTER}}

  registry:push:v2:
    internal: true
    desc: "Push consensus-mock:{{.V2}} (the upgrade target) to the in-cluster registry"
    cmds:
      - docker tag {{.IMG_V2}} {{.REGISTRY_HOST}}/consensus-mock:{{.V2}}
      - docker push {{.REGISTRY_HOST}}/consensus-mock:{{.V2}}

  images:load:versions:
    internal: true
    desc: "Load consensus-mock:{{.V1}} into kind and push {{.V2}} to the in-cluster registry"
    deps: [kind:load:v1, registry:push:v2]

  kind:load:beacon:
    internal: true
    desc: "Build the beacon image, tag :dev, and load it into kind"
    cmds:
      - task: root:docker:build:beacon
      - task: root:kind:load:beacon

  kind:load:uc:
    internal: true
    desc: "Build the UC sidecar image, tag :dev, and load it into kind"
    cmds:
      - task: root:docker:build:uc
      - task: root:kind:load:uc

  kind:load:genesis-init:
    internal: true
    desc: "Pull and load the genesis-init image ({{.GENESIS_INIT_IMG}}) into kind"
    cmds:
      - |
        # kind load docker-image chokes on multi-arch manifest lists; pull+save one platform instead.
        PLATFORM="linux/$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
        TAR="$(mktemp -t genesis-init.XXXX.tar)"
        docker pull --platform "$PLATFORM" {{.GENESIS_INIT_IMG}}
        docker save --platform "$PLATFORM" -o "$TAR" {{.GENESIS_INIT_IMG}}
        kind load image-archive "$TAR" --name {{.CLUSTER}}
        rm -f "$TAR"

  registry:up:
    internal: true
    desc: "Deploy the in-cluster local registry (kind/registry.yaml) used for real digest/layer-hash verification"
    cmds:
      - kubectl apply -f kind/registry.yaml
      - kubectl wait --for=condition=available --timeout=60s deployment/registry -n local-registry

  cluster:
    internal: true
    desc: "Reset the kind cluster ({{.CLUSTER}}), install CRDs, and deploy the in-cluster registry"
    cmds:
      - task: root:kind:reset
        vars: { KIND_CONFIG: '{{.TASKFILE_DIR}}/kind/kind-config.yaml' }
      - |
        for n in $(kind get nodes --name {{.CLUSTER}}); do
          docker exec "$n" mkdir -p /etc/containerd/certs.d/{{.REGISTRY_CLUSTER_ADDR}}
          printf 'server = "http://{{.REGISTRY_CLUSTER_ADDR}}"\n\n[host."http://{{.REGISTRY_CLUSTER_ADDR}}"]\n  capabilities = ["pull", "resolve"]\n' |
            docker exec -i "$n" tee /etc/containerd/certs.d/{{.REGISTRY_CLUSTER_ADDR}}/hosts.toml >/dev/null
        done
      - task: registry:up

  operator:deploy:
    internal: true
    desc: "Build solo-operator from local source, load it into kind, and deploy via Helm"
    cmds:
      - task: root:docker:build
      - task: root:kind:load
      - |
        helm upgrade --install solo-operator ../../charts/solo-operator \
          --namespace solo-operator --create-namespace --wait --timeout 120s \
          --set image.tag=dev --set image.pullPolicy=Never --set crds.install=false \
          --set registry.allowedHosts[0]={{.REGISTRY_CLUSTER_IP}}
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=solo-operator -n solo-operator --timeout=120s

  deploy:
    internal: true
    desc: "Deploy a single-node network (node0) running consensus-mock:MOCK_TAG (default {{.V1}}) + genesis"
    vars:
      # MOCK_TAG (not VERSION) avoids colliding with root Taskfile's own VERSION var.
      MOCK_TAG: '{{.MOCK_TAG | default .V1}}'
    cmds:
      # apply kind/orbit.yaml last so it wins over example:deploy:common's own orbit.yaml
      - task: example:deploy:common
      - kubectl apply -f kind/orbit.yaml
      - IMAGE_TAG={{.MOCK_TAG}} envsubst < kind/consensus-capsule.yaml | kubectl apply -f -
      - kubectl apply -f ../../docs/example/node0/secrets.yaml
      - kubectl apply -f ../../docs/example/network-genesis/network-genesis.yaml
      - echo ">> Waiting for genesis to complete..."
      - kubectl wait --for=jsonpath='{.status.phase}'=Succeeded networkgenesis/network-genesis -n {{.NS}} --timeout=300s
      - echo ">> Waiting for node0 pod to be ready ..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n {{.NS}} --timeout=60s
      - echo ">> node0 ready on consensus-mock:{{.MOCK_TAG}}"

  beacon:config:
    internal: true
    desc: "Apply beacon's config ConfigMap + payer key Secret, pointed at node0's own Service"
    cmds:
      - kubectl apply -f kind/beacon-config.yaml
      - |
        bash -lc '
        set -euo pipefail
        PEM="$(printf -- "-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n" \
          "$(echo "{{.ACCOUNT2_KEY_HEX}}" | xxd -r -p | base64)")"
        kubectl create secret generic beacon-keys -n {{.NS}} \
          --from-literal=account2.pem="$PEM" --from-literal=account2.pass="" \
          --dry-run=client -o yaml | kubectl apply -f -
        '

  beacon:stage-manifest:
    internal: true
    desc: "Generate a real deterministic-layer-hash manifest for {{.V2}} against the in-cluster registry, and stage it so the UC can build a NetworkUpgradePrepare CR"
    vars:
      UPGRADE_PATH: /opt/hgcapp/services-hedera/HapiApp2.0/data/upgrade/current
    cmds:
      - task: build:manifest
        vars:
          IMAGE: '{{.REGISTRY_HOST}}/consensus-mock:{{.V2}}'
          CLUSTER_IMAGE: '{{.REGISTRY_CLUSTER_ADDR}}/consensus-mock:{{.V2}}'
      - kubectl exec node0-0 -c consensus-node -n {{.NS}} -- mkdir -p {{.UPGRADE_PATH}}/manifests
      - kubectl cp manifests/consensus-node-components.yaml {{.NS}}/node0-0:{{.UPGRADE_PATH}}/manifests/consensus-node-components.yaml -c consensus-node

  beacon:prepare:
    internal: true
    desc: "Run a beacon Job: freeze prepare (PREPARE_UPGRADE) against node0, and wait for its Prepare CR to succeed"
    cmds:
      - task: beacon:stage-manifest
      - |
        bash -lc '
        set -euo pipefail
        BASELINE="$(kubectl get networkupgradeprepares -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null)"

        kubectl delete job beacon-freeze-prepare -n {{.NS}} --ignore-not-found >/dev/null
        kubectl apply -f kind/job-freeze-prepare.yaml
        kubectl wait --for=condition=complete --timeout=60s job/beacon-freeze-prepare -n {{.NS}}
        kubectl logs -n {{.NS}} job/beacon-freeze-prepare

        echo ">> waiting for a new NetworkUpgradePrepare CR..."
        NAME=""
        for i in $(seq 1 90); do
          for n in $(kubectl get networkupgradeprepares -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null); do
            case " $BASELINE " in *" $n "*) ;; *) NAME="$n" ;; esac
          done
          [ -n "$NAME" ] && break
          sleep 1
        done
        [ -n "$NAME" ] || { echo "!! no new NetworkUpgradePrepare CR appeared" >&2; exit 1; }

        echo ">>   NetworkUpgradePrepare/$NAME — waiting for Succeeded..."
        kubectl wait --for=jsonpath="{.status.phase}"=Succeeded networkupgradeprepares/"$NAME" -n {{.NS}} --timeout=60s
        '

  beacon:freeze:
    internal: true
    desc: "Run a beacon Job: freeze upgrade (FREEZE_UPGRADE), scheduled {{.FREEZE_DELAY_SECS | default \"10\"}}s out; waits for its Freeze CR to succeed"
    vars:
      FREEZE_DELAY_SECS: '{{.FREEZE_DELAY_SECS | default "10"}}'
      WAIT_SECS:
        sh: echo "$(( {{.FREEZE_DELAY_SECS}} + 60 ))"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        BASELINE="$(kubectl get networkupgradefreezes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null)"

        # node0-0 and the operator log buffer both get replaced/rotated; capture live to survive that
        rm -f /tmp/consensus-mock-freeze-window-*.log
        nohup kubectl logs -f node0-0 -c consensus-node -n {{.NS}} > /tmp/consensus-mock-freeze-window-consensus-node.log 2>&1 &
        nohup kubectl logs -f node0-0 -c uc -n {{.NS}} > /tmp/consensus-mock-freeze-window-uc.log 2>&1 &
        nohup kubectl logs -f -l app.kubernetes.io/name=solo-operator -n solo-operator > /tmp/consensus-mock-freeze-window-operator.log 2>&1 &

        kubectl delete job beacon-freeze-upgrade -n {{.NS}} --ignore-not-found >/dev/null
        START=$(date -u -v+{{.FREEZE_DELAY_SECS}}S "+%Y-%m-%d.%H:%M:%S" 2>/dev/null \
          || date -u -d "+{{.FREEZE_DELAY_SECS}} sec" "+%Y-%m-%d.%H:%M:%S")
        echo ">> freeze start-time (UTC): $START"
        START_TIME="$START" envsubst < kind/job-freeze-upgrade.yaml | kubectl apply -f -
        kubectl wait --for=condition=complete --timeout={{.WAIT_SECS}}s job/beacon-freeze-upgrade -n {{.NS}}
        kubectl logs -n {{.NS}} job/beacon-freeze-upgrade | tee /tmp/consensus-mock-freeze-window-beacon.log

        echo ">> waiting for a new NetworkUpgradeFreeze CR..."
        NAME=""
        for i in $(seq 1 {{.WAIT_SECS}}); do
          for n in $(kubectl get networkupgradefreezes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null); do
            case " $BASELINE " in *" $n "*) ;; *) NAME="$n" ;; esac
          done
          [ -n "$NAME" ] && break
          sleep 1
        done
        [ -n "$NAME" ] || { echo "!! no new NetworkUpgradeFreeze CR appeared" >&2; exit 1; }

        echo ">>   NetworkUpgradeFreeze/$NAME — waiting for Succeeded..."
        kubectl wait --for=jsonpath="{.status.phase}"=Succeeded networkupgradefreezes/"$NAME" -n {{.NS}} --timeout={{.WAIT_SECS}}s
        '

  wait:execute:
    internal: true
    desc: "Wait for the UC-created NetworkUpgradeExecute CR to succeed, then print the freeze-window marker/detection logs and pod-restart timing"
    vars:
      FREEZE_DELAY_SECS: '{{.FREEZE_DELAY_SECS | default "10"}}'
      ACTIVE_TIMEOUT_SECS: '{{.ACTIVE_TIMEOUT_SECS | default "0"}}'
      WAIT_SECS:
        sh: echo "$(( {{.FREEZE_DELAY_SECS}} + {{.EXECUTE_EXTRA_SECS | default "90"}} ))"
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        BASELINE="$(kubectl get networkupgradeexecutes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null)"
        OLD_UID="$(kubectl get pod node0-0 -n {{.NS}} -o jsonpath="{.metadata.uid}" 2>/dev/null || true)"

        echo ">> waiting for a new NetworkUpgradeExecute CR (scheduled freeze is up to {{.FREEZE_DELAY_SECS}}s out)..."
        NAME=""
        for i in $(seq 1 {{.WAIT_SECS}}); do
          for n in $(kubectl get networkupgradeexecutes -n {{.NS}} -o jsonpath="{.items[*].metadata.name}" 2>/dev/null); do
            case " $BASELINE " in *" $n "*) ;; *) NAME="$n" ;; esac
          done
          [ -n "$NAME" ] && break
          sleep 1
        done
        [ -n "$NAME" ] || { echo "!! no new NetworkUpgradeExecute CR appeared" >&2; exit 1; }

        echo ">>   NetworkUpgradeExecute/$NAME — waiting for Succeeded..."
        kubectl wait --for=jsonpath="{.status.phase}"=Succeeded networkupgradeexecutes/"$NAME" -n {{.NS}} --timeout={{.WAIT_SECS}}s

        if [ "{{.ACTIVE_TIMEOUT_SECS}}" -gt 0 ]; then
          echo ">> waiting for a new node0-0 pod to report platform status ACTIVE (up to {{.ACTIVE_TIMEOUT_SECS}}s)..."
          PS=""
          for i in $(seq 1 {{.ACTIVE_TIMEOUT_SECS}}); do
            UID_NOW="$(kubectl get pod node0-0 -n {{.NS}} -o jsonpath="{.metadata.uid}" 2>/dev/null || true)"
            PS="$(kubectl get consensuscapsule node0 -n {{.NS}} -o jsonpath="{.status.platformStatus}" 2>/dev/null || true)"
            [ -n "$UID_NOW" ] && [ "$UID_NOW" != "$OLD_UID" ] && [ "$PS" = "ACTIVE" ] && break
            sleep 1
          done
          [ "$PS" = "ACTIVE" ] && [ "$UID_NOW" != "$OLD_UID" ] || { echo "!! node0-0 did not report ACTIVE on a new pod within {{.ACTIVE_TIMEOUT_SECS}}s (platformStatus=${PS:-unset})" >&2; exit 1; }
        fi

        echo
        echo "── beacon: freeze upgrade tx ──"
        cat /tmp/consensus-mock-freeze-window-beacon.log 2>/dev/null || echo "(no beacon capture found)"

        echo
        echo "── consensus-node: freeze_scheduled.mf / now_frozen.mf ──"
        grep -E "freeze_scheduled|now_frozen|freeze:" /tmp/consensus-mock-freeze-window-consensus-node.log 2>/dev/null || echo "(no consensus-node capture found)"

        echo
        echo "── consensus-node: old pod stop (ns precision, from the process itself) ──"
        grep "consensus-mock: stopped at" /tmp/consensus-mock-freeze-window-consensus-node.log 2>/dev/null || echo "(old pod stop not captured)"

        echo
        echo "── containerd: new pod sandbox / container timing (ns precision, from the runtime itself) ──"
        NODE={{.CLUSTER}}-control-plane
        for i in $(seq 1 60); do
          UC_CID=$(kubectl get pod node0-0 -n {{.NS}} -o jsonpath="{.status.containerStatuses[?(@.name==\"uc\")].containerID}" 2>/dev/null || true)
          [ -n "$UC_CID" ] && break
          sleep 0.5
        done
        SANDBOX_PRINTED=0
        for cname in genesis-init consensus-node uc; do
          CID=$(kubectl get pod node0-0 -n {{.NS}} -o jsonpath="{.status.initContainerStatuses[?(@.name==\"$cname\")].containerID}{.status.containerStatuses[?(@.name==\"$cname\")].containerID}" 2>/dev/null | sed "s#containerd://##" || true)
          [ -n "$CID" ] || continue
          INSPECT=$(docker exec "$NODE" crictl inspect "$CID" 2>/dev/null || true)
          if [ "$SANDBOX_PRINTED" = 0 ]; then
            SANDBOX=$(echo "$INSPECT" | grep -o "\"sandboxID\": *\"[^\"]*\"" | head -1 | sed "s/.*\"\(.*\)\"/\1/" || true)
            [ -n "$SANDBOX" ] && docker exec "$NODE" crictl inspectp "$SANDBOX" 2>/dev/null | grep "\"createdAt\"" | sed "s/^/  sandbox created: /" || true
            SANDBOX_PRINTED=1
          fi
          echo "  $cname:"
          echo "$INSPECT" | grep -E "\"createdAt\"|\"startedAt\"|\"finishedAt\"" | sed "s/^/    /" || true
        done

        echo
        echo "── uc: MarkerDetected / CRDelivered ──"
        grep -E "MarkerDetected|CRDelivered" /tmp/consensus-mock-freeze-window-uc.log 2>/dev/null || echo "(no uc capture found)"

        echo
        echo "── operator: ReconcileStart / PhaseTransition / ReconcileFinish (ms precision) ──"
        grep -E "ReconcileStart|PhaseTransition|ReconcileFinish" /tmp/consensus-mock-freeze-window-operator.log 2>/dev/null | grep "name=$NAME" || echo "(no operator capture found)"

        echo
        echo "── NetworkUpgradeExecute CR timing ──"
        kubectl get networkupgradeexecutes/"$NAME" -n {{.NS}} -o jsonpath="created={.metadata.creationTimestamp}{\"\n\"}"
        kubectl get networkupgradeexecutes/"$NAME" -n {{.NS}} -o jsonpath="{range .status.conditions[*]}{.type}={.status} {.reason} {.lastTransitionTime}{\"\n\"}{end}"

        echo
        echo "── StatefulSet / pod restart events (most recent) ──"
        kubectl get events -n {{.NS}} --sort-by=.lastTimestamp -o custom-columns=TIME:.lastTimestamp,OBJ:.involvedObject.name,REASON:.reason | tail -15
        '

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf bin manifests
