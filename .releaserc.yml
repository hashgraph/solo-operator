---
plugins:
  - '@semantic-release/commit-analyzer'
  - - '@semantic-release/release-notes-generator'
    - preset: conventionalcommits
verifyConditions:
  - - '@semantic-release/exec'
    - cmd: go build -v ./...
prepare:
  - - '@semantic-release/exec'
    - cmd: |
        set -e
        # Update version in Chart.yaml
        sed -i "s/^version:.*/version: ${nextRelease.version}/" charts/solo-operator/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${nextRelease.version}\"/" charts/solo-operator/Chart.yaml
        # Package Helm chart
        helm package charts/solo-operator
  - - '@semantic-release/git'
    - assets:
        - charts/solo-operator/Chart.yaml
publish:
  - - '@semantic-release/exec'
    - cmd: |
        set -e
        # Build and push Docker image to GitHub
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag "${GH_OCI_REGISTRY}/${GH_OCI_GROUP}:${nextRelease.version}" \
          --tag "${GH_OCI_REGISTRY}/${GH_OCI_GROUP}:latest" \
          --push \
          .
        # Push Helm chart to GitHub
        helm push solo-operator-${nextRelease.version}.tgz "oci://${GH_OCI_REGISTRY}/${GH_HELM_GROUP}"
        # Build and push Docker image to JFrog
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag "${JF_OCI_REGISTRY}/${JF_OCI_GROUP}/solo-operator:${nextRelease.version}" \
          --tag "${JF_OCI_REGISTRY}/${JF_OCI_GROUP}/solo-operator:latest" \
          --push \
          .
        # Push Helm chart to JFrog
        helm push solo-operator-${nextRelease.version}.tgz "oci://${JF_OCI_REGISTRY}/${JF_HELM_GROUP}"
  - - '@semantic-release/github'
    - assets:
        - config/crd/bases/*
        - solo-operator-*.tgz
branches:
  - name: main
  - name: release/([0-9]+).([0-9]+)
    channel: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
    range: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
  - name: alpha/*
    prerelease: alpha
    channel: alpha
  - name: ci/*
    prerelease: alpha
    channel: alpha
  - name: beta/*
    prerelease: beta
    channel: beta
  - name: rc/*
    prerelease: rc
    channel: rc
