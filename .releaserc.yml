---
plugins:
  - '@semantic-release/release-notes-generator'
  - '@semantic-release/git'
  - - '@semantic-release/commit-analyzer'
    - preset: conventionalcommits
  - - '@semantic-release/github'
    - assets:
        - build/kubernetes/*
        - solo-operator-chart-*.tgz
  - - '@semantic-release/exec'
    - generateNotesCmd: echo ${nextRelease.version} > nextRelease.version
      verifyReleaseCmd: echo verify
      prepareCmd: |
        set -x
        ./gradlew versionAsSpecified -PnewVersion=${nextRelease.version}
        ./gradlew githubVersionSummary
        ./gradlew clean assemble --no-build-cache -Dquarkus.container-image.build=true
        sed -i \
          -e "s,^name: .*,name: \"solo-operator-chart\"," \
          build/helm/Chart.yaml
        helm package build/helm
        cat build/helm/Chart.yaml
        ls -ltr
#          -e "s,^version: ,name: \"${nextRelease.version}\"," \
      publishCmd: |
        set -x
        ./gradlew build -Dquarkus.container-image.push=true -x componentTest -x test --console plain
        helm push solo-operator-chart-${nextRelease.version}.tgz oci://ghcr.io/hashgraph/solo-operator
branches:
  - name: main
  - name: release/([0-9]+).([0-9]+)
    channel: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
    range: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
  - name: alpha/*
    prerelease: alpha
    channel: alpha
  - name: ci/*
    prerelease: alpha
    channel: alpha
  - name: beta/*
    prerelease: beta
    channel: beta
  - name: rc/*
    prerelease: rc
    channel: rc
