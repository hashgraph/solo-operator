---
plugins:
  - '@semantic-release/commit-analyzer'
  - - '@semantic-release/release-notes-generator'
    - preset: conventionalcommits
verifyConditions:
  - - '@semantic-release/exec'
    - cmd: ./gradlew clean build --no-build-cache -x componentTest -x test
prepare:
  - - '@semantic-release/exec'
    - cmd: |
        set -e
        ./gradlew versionAsSpecified -PnewVersion=${nextRelease.version}
        ./gradlew githubVersionSummary
        ./gradlew clean assemble --no-build-cache
        sed -i "s,^name: .*,name: \"solo-operator-chart\"," build/helm/Chart.yaml
        helm package build/helm
  - - '@semantic-release/git'
    - assets:
        - gradle.properties
publish:
  - - '@semantic-release/exec'
    - cmd: |
        set -e
        ./gradlew clean assemble --no-build-cache -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -Dquarkus.container-image.registry="${process.env.GH_OCI_REGISTRY}" -Dquarkus.container-image.group="${process.env.GH_OCI_GROUP}"
        helm push solo-operator-chart-${nextRelease.version}.tgz "oci://${process.env.GH_OCI_REGISTRY}/${process.env.GH_HELM_GROUP}"
        ./gradlew clean assemble --no-build-cache -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -Dquarkus.container-image.registry="${process.env.JF_OCI_REGISTRY}" -Dquarkus.container-image.group="${process.env.JF_OCI_GROUP}"
        helm push solo-operator-chart-${nextRelease.version}.tgz "oci://${process.env.JF_OCI_REGISTRY}/${process.env.JF_HELM_GROUP}"
  - - '@semantic-release/github'
    - assets:
        - build/kubernetes/*
        - solo-operator-chart-*.tgz
branches:
  - name: main
  - name: release/([0-9]+).([0-9]+)
    channel: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
    range: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
  - name: alpha/*
    prerelease: alpha
    channel: alpha
  - name: ci/*
    prerelease: alpha
    channel: alpha
  - name: beta/*
    prerelease: beta
    channel: beta
  - name: rc/*
    prerelease: rc
    channel: rc
