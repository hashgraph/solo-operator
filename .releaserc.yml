---
plugins:
  - '@semantic-release/release-notes-generator'
  - - '@semantic-release/commit-analyzer'
    - preset: conventionalcommits
  - - '@semantic-release/github'
    - assets:
        - build/kubernetes/*
        - solo-operator-chart-*.tgz
  - - '@semantic-release/exec'
    - verifyConditionsCmd: |
        set -e
        ./gradlew clean build --no-build-cache -x componentTest -x test
      prepareCmd: |
        set -e
        ./gradlew versionAsSpecified -PnewVersion=${nextRelease.version}
        ./gradlew githubVersionSummary
        ./gradlew clean assemble --no-build-cache
        sed -i "s,^name: .*,name: \"solo-operator-chart\"," build/helm/Chart.yaml
        helm package build/helm
      publishCmd: |
        set -e
        ./gradlew clean build --no-build-cache -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -x componentTest -x test
        helm push solo-operator-chart-${nextRelease.version}.tgz ${process.env.HELM_REMOTE}
  - - '@semantic-release/git'
    - assets:
        - gradle.properties
branches:
  - name: main
  - name: release/([0-9]+).([0-9]+)
    channel: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
    range: ${name.replace(/release\//g, '').split('.')[0]}.${name.replace(/release\//g, '').split('.')[1]}.x
  - name: alpha/*
    prerelease: alpha
    channel: alpha
  - name: ci/*
    prerelease: alpha
    channel: alpha
  - name: beta/*
    prerelease: beta
    channel: beta
  - name: rc/*
    prerelease: rc
    channel: rc
