version: '3'

vars:
  BINARY_NAME: manager
  IMG: ghcr.io/hashgraph/solo-operator:latest
  UC_IMG: ghcr.io/hashgraph/solo-operator-uc:latest
  DEV_IMG: us-central1-docker.pkg.dev/hashsphere-development/solo-operator/solo-operator
  DEV_TAG: dev
  ENVTEST_K8S_VERSION: "1.32.0"
  SETUP_ENVTEST_CMD: "go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest"
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html
  # Build metadata injected into the shared github.com/automa-saga/version
  # package via -ldflags -X. Both binaries (manager, uc) stamp the same vars at
  # their own build step.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -w -s
    -X github.com/automa-saga/version.Version={{.VERSION}}
    -X github.com/automa-saga/version.Commit={{.COMMIT}}
    -X github.com/automa-saga/version.Date={{.BUILD_DATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  mod:download:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  build:
    desc: Build all packages
    cmds:
      - go build -v ./...

  build:binary:
    desc: Build the operator binary for the current platform
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o bin/{{.BINARY_NAME}} cmd/main.go

  build:binary:all:
    desc: Cross-compile operator binary for all supported platforms (linux/amd64, linux/arm64)
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/manager-linux-amd64 cmd/main.go
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/manager-linux-arm64 cmd/main.go
      - chmod +x bin/manager-linux-amd64 bin/manager-linux-arm64

  build:uc:
    desc: Build the UC sidecar binary for the current platform
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o bin/uc cmd/uc/main.go

  build:uc:all:
    desc: Cross-compile the UC sidecar binary for all supported platforms (linux/amd64, linux/arm64)
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/uc-linux-amd64 cmd/uc/main.go
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/uc-linux-arm64 cmd/uc/main.go
      - chmod +x bin/uc-linux-amd64 bin/uc-linux-arm64

  hash:
    desc: Generate SHA256 checksums for all platform binaries
    deps: [ build:binary:all ]
    cmds:
      - cd bin && sha256sum manager-linux-amd64 > manager-linux-amd64.sha256
      - cd bin && sha256sum manager-linux-arm64 > manager-linux-arm64.sha256

  hash:uc:
    desc: Generate SHA256 checksums for all UC platform binaries
    deps: [ build:uc:all ]
    cmds:
      - cd bin && sha256sum uc-linux-amd64 > uc-linux-amd64.sha256
      - cd bin && sha256sum uc-linux-arm64 > uc-linux-arm64.sha256

  run:
    desc: Run the operator locally
    cmds:
      - go run cmd/main.go --zap-log-level=debug

  test:setup:
    desc: Setup envtest binaries for integration tests
    internal: true
    cmds:
      - '{{.SETUP_ENVTEST_CMD}} use {{.ENVTEST_K8S_VERSION}} --bin-dir $(pwd)/bin -p path'
    status:
      - test -d bin/k8s

  test:
    desc: Run all tests
    deps: [test:setup]
    env:
      KUBEBUILDER_ASSETS:
        sh: '{{.SETUP_ENVTEST_CMD}} use {{.ENVTEST_K8S_VERSION}} --bin-dir $(pwd)/bin -p path'
    cmds:
      - go test ./... -coverprofile {{.COVERAGE_FILE}}

  test:unit:
    desc: Run unit tests with race detection and coverage (CI)
    cmds:
      - go test -v -race -coverprofile={{.COVERAGE_FILE}} -covermode=atomic ./internal/... ./api/...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}

  test:integration:
    desc: Run integration tests with envtest
    deps: [test:setup]
    env:
      KUBEBUILDER_ASSETS:
        sh: '{{.SETUP_ENVTEST_CMD}} use {{.ENVTEST_K8S_VERSION}} --bin-dir $(pwd)/bin -p path'
    cmds:
      - go test ./test/integration/... -v

  test:e2e:
    desc: Run E2E tests against kind cluster
    cmds:
      - go test ./test/e2e/... -v

  test:coverage:
    desc: Run tests with coverage report
    deps: [test:setup]
    env:
      KUBEBUILDER_ASSETS:
        sh: '{{.SETUP_ENVTEST_CMD}} use {{.ENVTEST_K8S_VERSION}} --bin-dir $(pwd)/bin -p path'
    cmds:
      - go test ./... -coverprofile {{.COVERAGE_FILE}}
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run --timeout=5m

  lint:fix:
    desc: Run linters and fix issues
    cmds:
      - golangci-lint run --fix --timeout=5m

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  generate:
    desc: Run all code generators
    cmds:
      - task: generate:all

  generate:all:
    desc: Run all code generators
    cmds:
      - task: generate:deepcopy
      - task: generate:manifests
      - task: generate:rbac
      - task: helm:sync-rbac

  generate:manifests:
    desc: Generate CRD manifests
    cmds:
      - controller-gen crd paths="./..." output:crd:artifacts:config=config/crd/bases

  generate:deepcopy:
    desc: Generate DeepCopy methods
    cmds:
      - controller-gen object:headerFile=".github/boilerplate.go.txt" paths="./..."

  generate:rbac:
    desc: Generate RBAC manifests
    cmds:
      - controller-gen rbac:roleName=manager-role paths="./..." output:rbac:artifacts:config=config/rbac

  docker:build:
    desc: Build Docker image for the current platform (pre-compiles binaries first)
    deps: [ hash ]
    cmds:
      - docker build -t {{.IMG}} .

  docker:push:
    desc: Push Docker image
    cmds:
      - docker push {{.IMG}}

  docker:dev:
    desc: Build, tag, and push to dev GKE registry (override DEV_IMG/DEV_TAG as needed)
    cmds:
      - task: docker:build
      - docker tag {{.IMG}} {{.DEV_IMG}}:{{.DEV_TAG}}
      - docker push {{.DEV_IMG}}:{{.DEV_TAG}}

  docker:build:uc:
    desc: Build the UC sidecar Docker image for the current platform (pre-compiles binaries first)
    deps: [ hash:uc ]
    cmds:
      - docker build -t {{.UC_IMG}} -f Dockerfile.uc .

  docker:push:uc:
    desc: Push the UC sidecar Docker image
    cmds:
      - docker push {{.UC_IMG}}

  install:
    desc: Install CRDs into cluster
    cmds:
      - kubectl apply --server-side -f config/crd/bases

  uninstall:
    desc: Uninstall CRDs from cluster
    cmds:
      - kubectl delete -f config/crd/bases

  deploy:
    desc: Deploy controller to cluster
    cmds:
      - kubectl apply --server-side -k config/default

  undeploy:
    desc: Undeploy controller from cluster
    cmds:
      - kubectl delete -k config/default

  kind:create:
    desc: Create a kind cluster for testing
    cmds:
      - kind create cluster --name solo-operator || true

  kind:delete:
    desc: Delete the kind cluster
    cmds:
      - kind delete cluster --name solo-operator

  kind:load:
    desc: Load Docker image into kind cluster
    cmds:
      - kind load docker-image {{.IMG}} --name solo-operator

  kind:load:uc:
    desc: Load UC sidecar Docker image into kind cluster
    cmds:
      - kind load docker-image {{.UC_IMG}} --name solo-operator

  kind:metallb:
    desc: Install MetalLB operator via Helm and configure an IP pool so LoadBalancer services get IPs on kind
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb
      - helm repo update
      - helm upgrade --install --namespace metallb-system --create-namespace metallb metallb/metallb --wait --timeout 90s
      - |
        # Use .200-.250 of the kind Docker subnet for LoadBalancer IPs
        SUBNET=$(docker network inspect kind | grep '"Subnet"' | awk -F'"' '{print $4}' | grep -v ':' | head -1)
        PREFIX=$(echo "$SUBNET" | cut -d'/' -f1 | cut -d'.' -f1-3)
        kubectl apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: kind-pool
          namespace: metallb-system
        spec:
          addresses:
          - ${PREFIX}.200-${PREFIX}.250
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: kind-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - kind-pool
        EOF

  dev:
    desc: Reset kind cluster, install CRDs, and run operator locally
    cmds:
      - task: kind:reset
      - task: run

  dev:local:setup:
    desc: Build operator + UC images, spin up kind cluster, and deploy the operator via Helm
    vars:
      LOCAL_CLUSTER: solo-operator
    cmds:
      - kind delete cluster --name {{.LOCAL_CLUSTER}} || true
      - kind create cluster --name {{.LOCAL_CLUSTER}}
      - task: kind:metallb
      - task: generate:rbac
      - task: helm:sync-rbac
      - task: docker:build
      - task: docker:build:uc
      - docker tag {{.UC_IMG}} ghcr.io/hashgraph/solo-operator-uc:{{.VERSION}}
      - kind load docker-image {{.IMG}} --name {{.LOCAL_CLUSTER}}
      - kind load docker-image {{.UC_IMG}} --name {{.LOCAL_CLUSTER}}
      - kind load docker-image ghcr.io/hashgraph/solo-operator-uc:{{.VERSION}} --name {{.LOCAL_CLUSTER}}
      - helm upgrade --install solo-operator charts/solo-operator --namespace solo-operator --create-namespace --wait --timeout 120s --set image.tag=latest --set image.pullPolicy=Never
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=solo-operator -n solo-operator --timeout=120s
      - echo ">> Operator ready"

  dev:local:deploy:
    desc: Deploy 4-node cluster using docs/example manifests (orbit + nodes + genesis)
    cmds:
      - task -d docs/example deploy

  dev:local:teardown:
    desc: Tear down the 4-node cluster (CRs + namespace)
    cmds:
      - task -d docs/example destroy

  dev:local:status:
    desc: Show status of all CRs in the local dev cluster
    cmds:
      - task -d docs/example status

  dev:local:upgrade:
    desc: Run the full upgrade flow against the local dev cluster (prepare → freeze → execute)
    cmds:
      - task -d docs/example upgrade

  dev:local:upgrade:status:
    desc: Show status of all upgrade CRs in the local dev cluster
    cmds:
      - task -d docs/example upgrade:status

  dev:local:upgrade:destroy:
    desc: Delete all upgrade CRs from the local dev cluster
    cmds:
      - task -d docs/example upgrade:destroy

  kind:reset:
    desc: Reset kind cluster with fresh CRDs (delete+generate run in parallel)
    deps:
      - kind:delete
      - generate:all
    cmds:
      - task: kind:create
      - task: install

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f {{.COVERAGE_FILE}} {{.COVERAGE_HTML}}
      - rm -f manager-*.sha256

  helm:build:
    desc: Sync CRD templates, sync RBAC, sync admission policy, and package the Helm chart
    cmds:
      - task: helm:sync-crds
      - task: helm:sync-rbac
      - task: helm:sync-admission
      - helm package charts/solo-operator

  helm:sync-crds:
    desc: Sync CRD manifests from config/crd/bases into the crds Helm subchart templates
    cmds:
      - |
        set -eu
        HEADER="charts/solo-operator/charts/crds/crd-header.tpl"
        mkdir -p "charts/solo-operator/charts/crds/templates"
        found_crds=false
        for src in config/crd/bases/*.yaml; do
          [ -e "${src}" ] || continue
          found_crds=true
          dest="charts/solo-operator/charts/crds/templates/$(basename "${src}")"
          crd_name="$(yq '.metadata.name' "${src}")"
          spec_line="$(grep -n "^spec:" "${src}" | head -1 | cut -d: -f1)"
          [ -n "${crd_name}" ] || { echo "failed to determine CRD name from ${src}" >&2; exit 1; }
          [ -n "${spec_line}" ] || { echo "failed to determine spec line from ${src}" >&2; exit 1; }
          { cat "${HEADER}"; echo "  name: ${crd_name}"; tail -n +"${spec_line}" "${src}"; echo "{{`{{- end }}`}}"; } > "${dest}"
          echo "  synced: $(basename "${src}")"
        done
        [ "${found_crds}" = true ] || { echo "no CRD manifests found in config/crd/bases" >&2; exit 1; }

  helm:sync-rbac:
    desc: Sync RBAC rules from config/rbac/role.yaml into charts/solo-operator/templates/rbac.yaml
    cmds:
      - |
        set -eu
        SRC="config/rbac/role.yaml"
        DEST="charts/solo-operator/templates/rbac.yaml"
        [ -f "${SRC}" ] || { echo "missing ${SRC} — run 'task generate:rbac' first" >&2; exit 1; }

        # Preserve everything up to and including "rules:" (Helm boilerplate header)
        rules_line="$(grep -n "^rules:" "${DEST}" | head -1 | cut -d: -f1)"
        [ -n "${rules_line}" ] || { echo "'rules:' marker not found in ${DEST}" >&2; exit 1; }

        # Preserve everything from the first "---" separator after rules: (ClusterRoleBinding + leader election)
        sep_line="$(awk "NR>${rules_line} && /^---/ {print NR; exit}" "${DEST}")"
        [ -n "${sep_line}" ] || { echo "'---' separator not found after rules in ${DEST}" >&2; exit 1; }

        # Splice: header + generated rules + tail
        head -n "${rules_line}" "${DEST}" > /tmp/rbac_header.txt
        tail -n +"${sep_line}" "${DEST}" > /tmp/rbac_tail.txt
        {
          cat /tmp/rbac_header.txt
          yq '.rules[] | "- apiGroups: [\"" + (.apiGroups | join("\", \"")) + "\"]\n  resources: [\"" + (.resources | join("\", \"")) + "\"]\n  verbs: [\"" + (.verbs | join("\", \"")) + "\"]"' "${SRC}"
          cat /tmp/rbac_tail.txt
        } > "${DEST}"
        echo "  synced RBAC rules from ${SRC} → ${DEST}"

  helm:sync-admission:
    desc: Sync the ValidatingAdmissionPolicy spec + binding from config/admission into charts/solo-operator/templates/admissionpolicy.yaml
    cmds:
      - |
        set -eu
        SRC="config/admission/policy.yaml"
        BSRC="config/admission/binding.yaml"
        DEST="charts/solo-operator/templates/admissionpolicy.yaml"
        for f in "${SRC}" "${BSRC}" "${DEST}"; do
          [ -f "${f}" ] || { echo "missing ${f}" >&2; exit 1; }
        done

        # config/admission is the source of truth. The chart template owns only the
        # Helm boilerplate — enable gate, templated name/labels/policyName, templated
        # failurePolicy — so we sync the drift-prone content: the policy spec body
        # (matchConstraints..validations) and the binding's validationActions.
        # Mirrors helm:sync-rbac.

        # 1) Policy spec body: chart header (up to matchConstraints) + SRC body +
        #    chart tail (the "---" binding footer, which stays Helm-templated).
        src_body="$(grep -n '^  matchConstraints:' "${SRC}" | head -1 | cut -d: -f1)"
        [ -n "${src_body}" ] || { echo "'matchConstraints:' not found in ${SRC}" >&2; exit 1; }
        dest_head="$(grep -n '^  matchConstraints:' "${DEST}" | head -1 | cut -d: -f1)"
        [ -n "${dest_head}" ] || { echo "'matchConstraints:' marker not found in ${DEST}" >&2; exit 1; }
        dest_tail="$(grep -n '^---' "${DEST}" | head -1 | cut -d: -f1)"
        [ -n "${dest_tail}" ] || { echo "binding '---' separator not found in ${DEST}" >&2; exit 1; }
        tmp="$(mktemp)"
        {
          head -n "$((dest_head - 1))" "${DEST}"
          tail -n +"${src_body}" "${SRC}"
          tail -n +"${dest_tail}" "${DEST}"
        } > "${tmp}"
        mv "${tmp}" "${DEST}"

        # 2) Binding: sync validationActions (its only non-templated field; the
        #    name/policyName must stay Helm-templated so cannot be copied verbatim).
        va_line="$(grep '^  validationActions:' "${BSRC}" | head -1)"
        [ -n "${va_line}" ] || { echo "'validationActions:' not found in ${BSRC}" >&2; exit 1; }
        grep -q '^  validationActions:' "${DEST}" || { echo "'validationActions:' marker not found in ${DEST}" >&2; exit 1; }
        tmp2="$(mktemp)"
        awk -v repl="${va_line}" '/^  validationActions:/ {print repl; next} {print}' "${DEST}" > "${tmp2}"
        mv "${tmp2}" "${DEST}"

        echo "  synced admission policy spec + binding validationActions from config/admission → ${DEST}"

  test:nightly:
    desc: Run the nightly E2E test on a local kind cluster
    vars:
      NIGHTLY_CLUSTER: solo-operator-nightly
    cmds:
      - kind delete cluster --name {{.NIGHTLY_CLUSTER}} || true
      - kind create cluster --name {{.NIGHTLY_CLUSTER}}
      - task: kind:metallb
      - task: docker:build
      - kind load docker-image {{.IMG}} --name {{.NIGHTLY_CLUSTER}}
      - helm upgrade --install solo-operator charts/solo-operator --namespace solo-operator --create-namespace --wait --timeout 120s --set image.tag=latest --set image.pullPolicy=Never
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=solo-operator -n solo-operator --timeout=120s
      - task -d test/nightly deploy
      - echo "Nightly test passed"

  tools:
    desc: Install required tools
    cmds:
      - go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
      - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      - go install github.com/mikefarah/yq/v4@latest
