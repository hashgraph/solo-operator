---
apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "examples.stable.example.com"
spec:
  group: "stable.example.com"
  names:
    kind: "Example"
    plural: "examples"
    singular: "example"
  scope: "Namespaced"
  versions:
  - name: "v1"
    schema:
      openAPIV3Schema:
        properties:
          spec:
            default:
              field1: "default-value"
              field2: 0
              field3: false
            oneOf:
            - properties:
                field1:
                  format: "date-time"
            - properties:
                field1:
                  pattern: "^[a-zA-Z0-9-]+$"
            properties:
              field1:
                type: "string"
              field2:
                type: "integer"
              field3:
                type: "boolean"
            type: "object"
        required:
        - "spec"
        type: "object"
    served: true
    storage: true
