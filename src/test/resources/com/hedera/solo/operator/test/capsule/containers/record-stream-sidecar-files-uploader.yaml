---
enabled: true
name: "record-stream-sidecar-files-uploader"
softwareVersion:
  repository: "gcr.io/hedera-registry"
  imageName: "uploader-mirror"
  imageTag: "1.3.0"
config:
  debug: true
  enableCompression: true
  enableSidecarFiles: true
  reaper:
    enabled: true
    minKeep: 1
    interval: 1
    defaultBackoff: 1
  signature: # need to be false for sidecar files uploader
    require: false
    prioritize: false
  bucketName: "solo-streams"
  s3:
    enabled: true
    accessKey: solo-operator
    url: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
  gcs:
    enabled: false
  envFromSecret: "uploader-secrets"
