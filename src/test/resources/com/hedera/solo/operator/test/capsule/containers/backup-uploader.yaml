---
enabled: true
name: "backup-uploader"
softwareVersion:
  repository: "gcr.io/hedera-registry"
  name: "hedera-backups"
  tag: "0.6.0"
config:
  bucketName: "solo-backups"
  s3:
    enabled: true
    accessKey: solo-operator
    url: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
  gcs:
    enabled: false
  envFromSecret: "uploader-secrets"
