---
kind: ConfigMap
apiVersion: v1
metadata:
  name: backup-uploader-config
  namespace: solo-orbit
data:
  # https://rclone.org/s3/#minio
  # need to set the following env variables
  # RCLONE_S3_ACCESS_KEY_ID
  # RCLONE_S3_ENDPOINT
  # RCLONE_S3_SECRET_ACCESS_KEY
  rclone.conf: |-
    [backups]
    type = s3
    provider = Minio
    env_auth = true
