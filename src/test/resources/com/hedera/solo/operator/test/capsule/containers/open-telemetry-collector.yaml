---
enabled: true
name: "open-telemetry-collector"
softwareVersion:
  repository: "docker.io/otel"
  imageName: "opentelemetry-collector-contrib"
  imageTag: "0.72.0"
config:
  exporters:
    loki:
      enabled: true
      auth:
        enabled: false
      endpoint: "http://loki.telemetry.svc.cluster.local:3100/loki/api/v1/push"
