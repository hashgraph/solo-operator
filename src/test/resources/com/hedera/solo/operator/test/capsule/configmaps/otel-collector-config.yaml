---

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    exporters:
      loki:
        endpoint: "${env:OTEL_EXPORTER_LOKI_ENDPOINT}"
      logging:
        loglevel: "${env:OTEL_EXPORTER_LOGGING_LOGLEVEL}"

    extensions:
      file_storage:
      health_check:
      memory_ballast:
        size_in_percentage: 20


    processors:
      batch:
      # Add standard label sets to both logs and metrics.
      attributes/addLabels:
        actions:
          - key: environment
            action: insert
            value: "{env:OTEL_ENVIRONMENT}"
          - key: orbit_name
            action: insert
            value: "${env:OTEL_ORBIT_NAME}"
          - key: node_id
            action: insert
            value: "${env:OTEL_NODE_ID}"
          - key: account_num
            action: insert
            value: "${env:OTEL_ACCOUNT_NUM}"
          - key: inventory_name
            action: insert
            value: "${env:OTEL_HOST_NAME} - ${env:OTEL_HOST_IP}"
          - key: instance_type
            action: insert
            value: "${env:OTEL_INSTANCE_TYPE}" # e.g. hedera-node
          - key: appname
            action: insert
            value: "${env:OTEL_APP_NAME}"
          - key: metrics_node_id
            action: insert
            value: "${env:OTEL_METRICS_NODE_ID}"
      attributes/lokilabels:
        actions:
          # Map the log.file.name attribute to log_name. This is
          # necessary, as Loki does not support labels with dots.
          - key: log_name
            action: insert
            from_attribute: gcp.log_name # added by the filelog receivers
          # The loki exporter does not automatically make attributes labels,
          # so we must map labels here.
          - key: loki.attribute.labels
            action: insert
            value: log_name, environment, orbit_name, node_id, account_num, inventory_name, instance_type, appname
        # Note that this configuration includes the recommended memory_limiter and batch plugins, which avoid high latency for reporting telemetry, and ensure that the collector itself will stay stable (not run out of memory) by dropping telemetry if needed.
      memory_limiter:
        check_interval: 1s
        limit_mib: "${env.OTEL_PROCESSOR_MEMORY_LIMIT_MB}"
        # spike_limit_mib is recommended to be 20% of overall memory limit, as per https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
        spike_limit_mib: "${env.OTEL_PROCESSOR_MEMORY_SPIKE_LIMIT_MB}"

    receivers:
      filelog/hgcaa:
        storage: file_storage
        include:
          - /opt/hgcapp/services-hedera/HapiApp2.0/output/hgcaa.log
        multiline:
          line_start_pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}'
        operators:
          - type: add
            field: attributes["gcp.log_name"]
            value: "hgcaa"
      filelog/swirlds:
        storage: file_storage
        include:
          - /opt/hgcapp/services-hedera/HapiApp2.0/output/swirlds.log
        multiline:
          line_start_pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}'
        operators:
          - type: add
            field: attributes["gcp.log_name"]
            value: "swirlds"

    service:
      extensions:
        - health_check
        - file_storage
      pipelines:
        logs/loki:
          receivers:
            - filelog/hgcaa
            - filelog/swirlds
            - filelog/swirlds-vmap
          processors:
            - memory_limiter
            - attributes/addlabels
            - attributes/lokilabels
            - batch
          exporters:
            - loki
