# SPDX-License-Identifier: Apache-2.0

---
kind: Service
apiVersion: v1
metadata:
  name: consensus
  namespace: solo-orbit
spec:
  clusterIP: None
  clusterIPs:
    - None
  selector:
    app: consensus-node
  publishNotReadyAddresses: true
  ports:
   - name: gossip
     port: 50111
     protocol: TCP
     targetPort: 50111
   - name: grpc
     port: 50211
     protocol: TCP
     targetPort: 50211
   - name: grpc-tls
     port: 50212
     protocol: TCP
     targetPort: 50212
   - name: prometheus
     port: 9090
     protocol: TCP
     targetPort: 9090
