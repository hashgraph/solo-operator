kind: Service
apiVersion: v1
metadata:
  name: consensus-service
  labels:
    app: consensus-node
spec:
  publishNotReadyAddresses: true
  type: LoadBalancer
  selector:
    app: consensus-node
  ports:
    - name: sync
      port: 31337
    - name: gossip
      port: 50111
    - name: grpc
      port: 50211
    - name: grpc-tls
      port: 50212
