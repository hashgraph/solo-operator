---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consensus-config
  namespace: bogus-namespace
data:
  empty: ""
  s6-start-consensus-finish: |
    #! /command/with-contenv bash

    if [ "${1}" == 256 ]; then
      echo "Consensus startup service killed by uncaught signal: $(kill -l ${2})(${2})"
    fi
  s6-start-consensus-run: |
    #! /command/with-contenv bash

    # Do not restart
    s6-svc -O .

    # Kill children on exit
    trap "kill 0" EXIT

    # Create symlinks
    APP_DIR=/opt/hgcapp/services-hedera/HapiApp2.0
    CONSENSUS_CFG=/mnt/cm/consensus-config
    ln -s ${CONSENSUS_CFG}/settings.txt ${APP_DIR}
    ln -s ${CONSENSUS_CFG}/api-permission.properties ${APP_DIR}/data/config
    ln -s ${CONSENSUS_CFG}/application.properties ${APP_DIR}/data/config
    ln -s ${CONSENSUS_CFG}/genesis.properties ${APP_DIR}/data/config
    CLUSTER_CFG=/tmp/volumes/cluster-config
    HOSTPATH_CFG=/mnt/config
    ln -s ${APP_DIR}/data/keys/hedera.{crt,key} ${APP_DIR}
    if [ -f ${HOSTPATH_CFG}/config.txt ]; then
      ln -s ${HOSTPATH_CFG}/config.txt ${APP_DIR}
    else
      ln -s ${CLUSTER_CFG}/config.txt ${APP_DIR}
    fi

    # Wait until consensus service has been initialized, config.txt file is available and podIP is eligible
    SVC_DIR=/run/service/consensus
    while true; do
      if [ "$(s6-svstat -o up,wantedup ${SVC_DIR})" = "false false" \
           -a -s ${APP_DIR}/config.txt \
           -a -s ${CLUSTER_CFG}/podIps ] \
           && grep -qFx $(hostname -i) ${CLUSTER_CFG}/podIps; then
        # If using secret resources, additionally require all expected public keys are available
        if [ -d /mnt/keys/public-keys ]; then
          if [ $(grep ^address ${APP_DIR}/config.txt | wc -l) -eq $(ls /mnt/keys/public-keys/s-public-*.pem | wc -l) ]; then
            ln -s $(find -L /mnt/keys -mindepth 2 -maxdepth 2 -type f) ${APP_DIR}/data/keys
            break
          fi
        else
          break
        fi
      fi
      sleep 1
    done

    # Start consensus service
    s6-svc -o ${SVC_DIR}
  s6-type-longrun: |
    longrun
  is-consensus-ready: |-
    #! /usr/bin/env sh

    set -eu

    host=127.0.0.1
    port=9999
    required_ports="9999 50111 50211 50212"

    # Check listening ports
    awk -v ports="${required_ports}" '
      BEGIN {
        split(ports, arr)
        for (i in arr) required[arr[i]] = 1
      }
      FNR != 1 {
        split($2, arr, ":")
        listening[sprintf("%d", "0x" arr[2])] = 1
      }
      END {
        for (p in listening) { delete required[p] }
        if (length(required)) {
          print "service not ready"
          exit 1
        }
      }
    ' /proc/net/tcp /proc/net/tcp6

    # Make HTTP request and parse response
    printf "GET / HTTP/1.1\r\nConnection: close\r\n\r\n" |
      timeout 2 nc "${host}" "${port}" |
      awk '
        BEGIN { in_header = 1 }
        NR == 1 && $2 != 200 { print "HTTP status "$2" unexpected"; exit 1 }
        /^\r$/ { in_header=0; next }
        in_header { next }

        # # HELP platform_PlatformStatus 0=NO_VALUE 1=STARTING_UP 2=ACTIVE ...
        /^# HELP platform_PlatformStatus / { help = $0 }

        # platform_PlatformStatus{node="0",} 2.0
        /^platform_PlatformStatus{/ { code = int($NF) }

        END {
          status = "UNKNOWN"
          pattern = "[[:space:]]" code "=([^[:space:]]+)"
          if (match(help, pattern)) {
            str = substr(help, RSTART, RLENGTH)
            status = substr(str, index(str, "=") + 1)
          }
          if (status != "ACTIVE") {
            printf("status is %s (%s)\n", code, status)
            exit 1
          }
        }
      '
