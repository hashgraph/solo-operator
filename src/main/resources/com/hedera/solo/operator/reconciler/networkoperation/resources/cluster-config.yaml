---
kind: ConfigMap
apiVersion: v1
metadata:
  name: cluster-config
  namespace: solo-orbit
  labels:
    app: consensus
    type: config
data:
# address, nodeId, nickname, selfname, weight, internalHostname, internalPort, externalHostname, externalPort, memoToUse

# should be overridden from orbit (require, not from application.properties):
# swirld (application.properties#contracts.chainId)

# provided:
# memoToUse

# generated from external address book and number of consensus nodes (maybe going away soon anyway):
# nextNodeId

# ???
# 2, node2, node2, 1
# nodeId, nickname, selfname, weight
# nodeId - provided or generated (start at nextNodeId)
# nickname - provided (this or selfname in key)
# selfname - provided (this or nickname in key)
# weight - provided



#  swirld, 298
#  app, HederaNode.jar
#  address, 0, node0, node0, 1, network-node0-0.network-node0.solo-e2e.svc.cluster.local, 50111, network-node0.solo-e2e.svc.cluster.local, 50111, 0.0.3
#  address, 1, node1, node1, 1, network-node1-0.network-node1.solo-e2e.svc.cluster.local, 50111, network-node1.solo-e2e.svc.cluster.local, 50111, 0.0.4
#  address, 2, node2, node2, 1, network-node2-0.network-node2.solo-e2e.svc.cluster.local, 50111, network-node2.solo-e2e.svc.cluster.local, 50111, 0.0.5
#  nextNodeId, 3
  config.txt: |-
    swirld, 298
    app, HederaNode.jar
    address, 0, node0, node0, 1, node0.consensus.solo-network.svc.cluster.local, 50111, node0-svc.solo-network.svc.cluster.local, 50111, 0.0.3
    address, 1, node1, node1, 1, node1.consensus.solo-network.svc.cluster.local, 50111, node1-svc.solo-network.svc.cluster.local, 50111, 0.0.4
    address, 2, node2, node2, 1, node2.consensus.solo-network.svc.cluster.local, 50111, node2-svc.solo-network.svc.cluster.local, 50111, 0.0.5
    nextNodeId, 3
  startup-probe: |
    import java.net.http.*;
    int rc = 1;
    URI uri = URI.create("http://localhost:9999");
    HttpRequest request = HttpRequest.newBuilder().uri(uri).GET().build();
    HttpClient client = HttpClient.newHttpClient();
    HttpResponse response = client.send(request, HttpResponse.BodyHandlers.ofString());
    if (200 == response.statusCode()) {
      String body = response.body().toString();
      String help = "";
      int status = -1;
      for (String line : body.lines().toList()) {
        // # HELP platform_PlatformStatus 0=NO_VALUE 1=STARTING_UP 2=ACTIVE ...
        if (line.startsWith("# HELP platform_PlatformStatus ")) {
          help = line;
        }
        // platform_PlatformStatus{node="0",} 2.0
        if (line.startsWith("platform_PlatformStatus{")) {
          String[] fields = line.split("\\s+");
          status = Double.valueOf(fields[fields.length - 1]).intValue();
        }
      }
      if ("ACTIVE".equals(help.replaceFirst(".*\\s+" + status + "=(\\S+)\\s+.*", "$1"))) {
        rc = 0;
      }
    }
    /exit rc
