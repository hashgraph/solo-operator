    app, HederaNode.jar
    address, 0, node0, node0, 1, node0.consensus.solo-network.svc.cluster.local, 50111, node0-svc.solo-network.svc.cluster.local, 50111, 0.0.3
    address, 1, node1, node1, 1, node1.consensus.solo-network.svc.cluster.local, 50111, node1-svc.solo-network.svc.cluster.local, 50111, 0.0.4
    address, 2, node2, node2, 1, node2.consensus.solo-network.svc.cluster.local, 50111, node2-svc.solo-network.svc.cluster.local, 50111, 0.0.5
