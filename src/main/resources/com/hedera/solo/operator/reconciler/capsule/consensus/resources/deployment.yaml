kind: Deployment
apiVersion: apps/v1
metadata:
  name: consensus-node
  creationTimestamp: null
  labels:
    app: consensus-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consensus-node
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: consensus-node
    spec:
      containers:
        - name: consensus-node
          image: gcr.io/hedera-registry/consensus-node:0.50.0-alpha.0
          resources: {}
          env:
            - name: JAVA_OPTS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
          command: ["/init"]
          args: ["sh", "-c", "cd /opt/hgcapp/services-hedera/HapiApp2.0; cp entrypoint2.sh entrypoint2_.sh; chmod +x entrypoint2_.sh; ./entrypoint2_.sh"]
          volumeMounts:
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/config.txt
              subPath: config.txt
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/settings.txt
              subPath: settings.txt
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/log4j2.xml
              subPath: log4j2.xml
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/entrypoint2.sh
              subPath: entrypoint2.sh
            - name: secret-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
            - name: secret-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.crt
              subPath: hedera.crt
            - name: secret-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.key
              subPath: hedera.key
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/api-permission.properties
              subPath: api-permission.properties
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/application.properties
              subPath: application.properties
            - name: config-volume
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/bootstrap.properties
              subPath: bootstrap.properties
      volumes:
        - name: config-volume
          configMap:
            name: config
        - name: secret-volume
          secret:
            secretName: keys
  strategy: {}
status: {}
