kind: Deployment
apiVersion: apps/v1
metadata:
  name: consensus-node
  labels:
    app: consensus-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consensus-node
  template:
    metadata:
      labels:
        app: consensus-node
    spec:
      subdomain: consensus
      containers:
        - name: consensus-node
          image: gcr.io/hedera-registry/consensus-node:0.52.0-alpha.6
          resources: {}
          env:
            - name: JAVA_OPTS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/config.txt
              subPath: config.txt
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/settings.txt
              subPath: settings.txt
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/log4j2.xml
              subPath: log4j2.xml
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/api-permission.properties
              subPath: api-permission.properties
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/application.properties
              subPath: application.properties
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/bootstrap.properties
              subPath: bootstrap.properties
            - name: private-keys
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.crt
              subPath: hedera.crt
            - name: private-keys
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.key
              subPath: hedera.key
            - name: hgcapp-record-streams
              mountPath: /opt/hgcapp/recordStreams
            - name: hgcapp-output
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/output
# the following needs to be added dynamically
#            - name: private-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: a-private-node0.pem
#            - name: private-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: s-private-node0.pem

# for each file in the public-keys configmap:
#            - name: public-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: ${file}
        # Sidecar: <nodeId>-record-stream-uploader
        - name: record-stream-uploader
          image: gcr.io/hedera-registry/uploader-mirror:1.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          command:
            - /usr/bin/env
            - python3.7
            - /usr/local/bin/mirror.py
            - --linux
            - --watch-directory
            - /opt/hgcapp/recordStreams
            - --csv-stats-directory
            - /opt/hgcapp/recordStreams/uploader-stats
            - --s3-endpoint
            - http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000 # overwrite from orbit's config ?
          volumeMounts:
            - name: hgcapp-record-streams
              mountPath: /opt/hgcapp/recordStreams
            - name: hgcapp-output
              mountPath: /opt/hgcapp/output
          env: # overwrite from config
            - name: DEBUG
              value: "true"
            - name: REAPER_ENABLE
              value: "true"
            - name: REAPER_MIN_KEEP
              value: "1"
            - name: REAPER_INTERVAL
              value: "1"
            - name: REAPER_DEFAULT_BACKOFF
              value: "1"
            - name: STREAM_FILE_EXTENSION
              value: "rcd"
            - name: STREAM_SIG_EXTENSION
              value: "rcd_sig"
            - name: STREAM_EXTENSION
              value: "rcd.gz"
            - name: SIG_EXTENSION
              value: "rcd_sig"
            - name: RECORD_STREAM_COMPRESSION
              value: "true"
            - name: RECORD_STREAM_SIDECAR
              value: "true"
            - name: SIG_REQUIRE
              value: "true"
            - name: SIG_PRIORITIZE
              value: "true"
            - name: BUCKET_PATH
              value: "recordstreams/record0.0.3"
            - name: BUCKET_NAME
              value: "fst-streams"
            - name: S3_ENABLE
              value: "true"
            - name: GCS_ENABLE
              value: "false"
          envFrom:
            - secretRef:
                name: solo-minio-secrets
      volumes:
        - name: cluster-config
          configMap:
            name: cluster-config
        - name: public-keys
          configMap:
            name: public-keys
        - name: private-keys
          secret:
            secretName: private-keys
        - name: hgcapp-record-streams
          emptyDir: {}
        - name: hgcapp-output
          emptyDir: {}
  strategy: {}
status: {}
