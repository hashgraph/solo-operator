kind: Deployment
apiVersion: apps/v1
metadata:
  name: consensus-node
  labels:
    app: consensus-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consensus-node
  template:
    metadata:
      labels:
        app: consensus-node
    spec:
      subdomain: consensus
      initContainers:
        # wait for all pods to come up before attempting to start consensus service
        # maybe we do need name resolution working, still seeing failure even after waiting for internal address ping
        - name: sync
          image: alpine:3.20.2
          command:
            - sh
            - -c
            - |
              addresses_ready() {
                awk -F, '/^address/ {
                  printf("getent ahosts %s && getent ahosts %s || exit 1\n", $6, $8);
                }' /opt/hgcapp/services-hedera/HapiApp2.0/config.txt | sh -x # &> /dev/null
              }
              until addresses_ready; do
                sleep 1
              done
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/config.txt
              subPath: config.txt
      containers:
        - name: consensus-node
#          image: gcr.io/hedera-registry/consensus-node:0.53.5
          image: gcr.io/hedera-registry/consensus-node:0.52.0-alpha.6
          resources: {}
          env:
            - name: JAVA_OPTS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
          command:
            - /init
          args:
            - sh
            - -c
            - |
              set -x
              find . -type f -ls
              /opt/hgcapp/services-hedera/HapiApp2.0/entrypoint.sh
              find . -type f -ls
              cat output/swirlds.log
              tail -f /dev/null
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/config.txt
              subPath: config.txt
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/settings.txt
              subPath: settings.txt
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/log4j2.xml
              subPath: log4j2.xml
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/api-permission.properties
              subPath: api-permission.properties
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/application.properties
              subPath: application.properties
            - name: cluster-config
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/bootstrap.properties
              subPath: bootstrap.properties
            - name: private-keys
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.crt
              subPath: hedera.crt
            - name: private-keys
              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.key
              subPath: hedera.key
# the following needs to be added dynamically
#            - name: private-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: a-private-node0.pem
#            - name: private-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: s-private-node0.pem

# for each file in the public-keys configmap:
#            - name: public-keys
#              mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
#              subPath: ${file}
      volumes:
        - name: cluster-config
          configMap:
            name: cluster-config
        - name: public-keys
          configMap:
            name: public-keys
        - name: private-keys
          secret:
            secretName: private-keys
  strategy: {}
status: {}
