# SPDX-License-Identifier: Apache-2.0

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: haproxy
  labels:
    app: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.8.10-alpine3.20
          resources: {}
          env:
          - name: HAPROXY_TARGET_IP
            value: node0-svc.consensuscapsuletest
          - name: HAPROXY_USER
            value: user
          - name: HAPROXY_AUTH
            value: auth
          volumeMounts:
          - name: haproxy-cm
            mountPath: /usr/local/etc/haproxy/haproxy.cfg
            subPath: haproxy.cfg
          - name: haproxy-secret
            mountPath: /usr/local/etc/haproxy/hedera.pem
            subPath: hedera.pem
          - name: haproxy-cm
            mountPath: /var/opt/ofac-blocklist.acl
            subPath: ofac-blocklist.acl
      volumes:
      - name: haproxy-cm
        configMap:
          name: haproxy-cm
      - name: haproxy-secret
        secret:
          secretName: haproxy-secret
  strategy: {}
