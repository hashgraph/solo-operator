kind: Deployment
apiVersion: apps/v1
metadata:
  name: haproxy
  labels:
    app: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
      consensus-capsule: bogus # dynamically updated
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.8.10-alpine3.20
          resources: {}
          volumeMounts:
          - name: haproxy-cm
            mountPath: /usr/local/etc/haproxy/haproxy.cfg
            subPath: haproxy.cfg
          - name: haproxy-cm
            mountPath: /var/opt/ofac-blocklist.acl
            subPath: ofac-blocklist.acl
          - name: haproxy-secrets
            mountPath: /usr/local/etc/haproxy/hedera.pem
            subPath: hedera.pem
      volumes:
      - name: haproxy-cm
        configMap:
          name: bogus # dynamically added
      - name: haproxy-secrets
        secret:
          secretName: bogus # dynamically added
  strategy: {}
