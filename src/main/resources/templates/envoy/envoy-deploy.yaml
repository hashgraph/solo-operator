---
# {@com.hedera.solo.operator.model.v1alpha1.EnvoyProxy primary}
# {@java.util.Set<String> env}

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {primary.getMetadata().getNamespace()}
spec:
  replicas: {primary.getSpec().getReplicas()}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: {primary.getSpec().getReplicas() - 1}
  template:
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: envoy
          image: {primary.getSpec().getImage()}
          args:
            - envoy
            - -c
            - /etc/envoy/envoy.yaml
            # {#if env.contains("SERVICE_CLUSTER")}
            - --service-cluster
            - "$(SERVICE_CLUSTER)"
            # {/if}
            # {#if env.contains("SERVICE_NODE")}
            - --service-node
            - "$(SERVICE_NODE)"
            # {/if}
          livenessProbe:
            exec:
              command:
                - /usr/local/solo/bin/probe.pl
                - /server_info
            initialDelaySeconds: 1
            periodSeconds: 4
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - /usr/local/solo/bin/probe.pl
                - /ready
            initialDelaySeconds: 1
            periodSeconds: 4
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    until [ -e /admin/ok ]; do
                      sleep 1
                    done
          volumeMounts:
            - name: admin
              mountPath: /admin
            - mountPath: /usr/local/solo/bin
              name: solo-bin
        - name: shutdown-manager
          image: ghcr.io/projectcontour/contour:v1.32.0
          command:
            - /bin/contour
          args:
            - envoy
            - shutdown-manager
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/contour
                  - envoy
                  - shutdown
          volumeMounts:
            - name: admin
              mountPath: /admin
      volumes:
        - name: admin
          emptyDir: { }
        - name: solo-bin
          configMap:
            defaultMode: 0555
            items:
              - key: probe.pl
                path: probe.pl
