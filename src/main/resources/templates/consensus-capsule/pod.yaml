# {@String namespace}
# {@String nodeId}
# {@String accountId}
# {@java.util.List nodeIds}
# {@int defaultMode}
# {@java.util.Set publicKeyFiles}
# {@com.hedera.solo.operator.model.v1alpha1.consensuscapsulespec.pod.containers.ConsensusNode cn}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader rsu}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader rsu}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader rssu}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader esu}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader bu}
kind: Pod
apiVersion: v1
metadata:
  name: consensus-node
  labels:
    app: consensus-node
spec:
  restartPolicy: Never
  hostname: "{nodeId}"
  subdomain: consensus
  serviceAccountName: "{nodeId}-sa"
  initContainers:
    - name: "init-consensus-node"
      image: "{cn.softwareVersion.repository}/{cn.softwareVersion.name}:{cn.softwareVersion.tag}"
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
        - name: hgcapp-data-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
        - name: gossip-keys
          mountPath: /tmp/volumes/gossip-keys
        - name: public-keys
          mountPath: /tmp/volumes/public-keys
        - name: cluster-config
          mountPath: /tmp/volumes/cluster-config
        - name: hgcapp-init
          mountPath: /tmp/volumes/init
      command:
        - "/bin/bash"
        - "-c"
        - |
          setupDirs() \{
            # setup directories mounted into different containers
            mkdir -p /opt/hgcapp/recordStreams/record{accountId}/sidecar
            sudo chown -R hedera:hedera /opt/hgcapp/recordStreams
            mkdir -p /opt/hgcapp/eventsStreams/events_{accountId}
            sudo chown -R hedera:hedera /opt/hgcapp/eventsStreams

            # create empty VERSION file for backup-uploader
            touch /tmp/volumes/init/VERSION # FIXME change to copy when VERSION file is baked in the image

            return 0
          \}

          # lookup services
          lookupSvc() \{
            local svc="$1"
            local attempt=1
            local delay=5
            local maxAttempt=100
            local rc=0
            # Check for services with a timeout
            until [ $attempt -gt $maxAttempt ]; do
              echo "-------------------------------------------------------------------"
              result=$(getent hosts "$svc")
              rc=$?
              echo "$result"
              if [ "$rc" -eq 0 ]; then
                echo "OK: $svc"
                echo "-------------------------------------------------------------------"
                echo "$result" >> /tmp/volumes/init/hosts
                return $rc
              fi
              echo "Attempt $attempt failed. Retrying in $delay seconds..."
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done
            echo "ERROR: Timeout occurred; lookup failed for services: $svc."
            return 1
          \}

          checkConsensusNodeSvc() \{
            parsed_internal_svcs=$(cat /tmp/volumes/cluster-config/config.txt | awk '\{print $6\}' | xargs);
            parsed_external_svcs=$(cat /tmp/volumes/cluster-config/config.txt | awk '\{print $8\}' | xargs);
            echo "Parsed Internal: $\{parsed_internal_svcs\}"
            echo "Parsed External: $\{parsed_external_svcs\}"
            IFS=', ' read -r -a internal_svcs <<< "$parsed_internal_svcs";
            IFS=', ' read -r -a external_svcs <<< "$parsed_external_svcs";
            echo "Internal Services: $\{internal_svcs[@]\}"
            echo "External Services: $\{external_svcs[@]\}"

            # prepare hosts file with service IPs
            touch /tmp/volumes/init/hosts
            for s in "$\{internal_svcs[@]\}";do
              lookupSvc "$s" || return $?
            done;

            for s in "$\{external_svcs[@]\}";do
              lookupSvc "$s" || return $?
            done;

            echo ""
            echo "hosts"
            echo "--------------------------------------------------------------------------"
            cat /tmp/volumes/init/hosts

            echo ""
            echo "*** Lookup succeeded for all services ***"

            return 0
          \}


          runInit() \{
            echo "Copying keys into /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/"
            echo "--------------------------------------------------------------------------"
            cp -rLfv /tmp/volumes/gossip-keys/* /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/
            cp -rLfv /tmp/volumes/public-keys/* /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/
            sudo chown -R hedera:hedera /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/

            echo ""
            echo "cluster-config directory"
            echo "--------------------------------------------------------------------------"
            ls -la /tmp/volumes/cluster-config

            echo ""
            echo "config.txt"
            echo "--------------------------------------------------------------------------"
            cat /tmp/volumes/cluster-config/config.txt

            # setup directories before consensus-node starts
            setupDirs || return 1

            # lookup services
            checkConsensusNodeSvc || return 1

            return 0
          \}

          runInit
  containers:
    - name: "{cn.name}"
      image: "{cn.softwareVersion.repository}/{cn.softwareVersion.name}:{cn.softwareVersion.tag}"
      env:
        - name: JAVA_OPTS # https://stackoverflow.com/questions/1256556/how-to-make-java-honor-the-dns-caching-timeout
          value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005 -Dsun.net.inetaddr.ttl=0"
      command:
        - "/bin/bash"
        - "-c"
        - |
          # copy file with appropriate ownership
          function copyFile() \{
            local src="$1"
            local dst="$2"
            cp -rLfv "$src" "$dst"
            sudo chown hedera:hedera "$dst"
          \}

          function copyFiles() \{
            # copy config files from cluster-config with appropriate file ownership
            CLUSTER_CONFIG_VOL="/tmp/volumes/cluster-config"
            HAPI_APP="/opt/hgcapp/services-hedera/HapiApp2.0"
            copyFile "$CLUSTER_CONFIG_VOL/config.txt" "$HAPI_APP/config.txt"
            copyFile "$CLUSTER_CONFIG_VOL/settings.txt" "$HAPI_APP/settings.txt"
            copyFile "$CLUSTER_CONFIG_VOL/log4j2.xml" "$HAPI_APP/log4j2.xml"
            copyFile "$CLUSTER_CONFIG_VOL/api-permission.properties" "$HAPI_APP/data/config/api-permission.properties"
            copyFile "$CLUSTER_CONFIG_VOL/application.properties" "$HAPI_APP/data/config/application.properties"

            GRPC_TLS_VOL="/tmp/volumes/grpc-tls-keys"
            copyFile "$GRPC_TLS_VOL/hedera-{nodeId}.key" "$HAPI_APP/hedera.key"
            copyFile "$GRPC_TLS_VOL/hedera-{nodeId}.crt" "$HAPI_APP/hedera.crt"

            # copy entrypoint.sh if it exists in cluster-config (this helps with debugging if needed)
            if [[ -f "$CLUSTER_CONFIG_VOL/entrypoint.sh" ]]; then
              copyFile "$CLUSTER_CONFIG_VOL/entrypoint.sh" "$HAPI_APP/entrypoint.sh"
            fi

            # copy other prepared files
            PREP_DIR="/tmp/volumes/init"
            if [[ -f "$PREP_DIR/hosts" ]]; then
              if [[ ! -f "$PREP_DIR/hosts.original" ]]; then
                copyFile /etc/hosts "$PREP_DIR/hosts.original"
              fi
              sudo cat "$PREP_DIR/hosts.original" > "$PREP_DIR/hosts_combined"
              sudo cat "$PREP_DIR/hosts" >> "$PREP_DIR/hosts_combined"
              sudo cp "$PREP_DIR/hosts_combined" /etc/hosts
              cat /etc/hosts
            fi

            return 0
          \}

          function setup() \{
            copyFiles || return $?
            return 0
          \}

          # setup
          setup || exit $?

          # start platform software
          exec /init /opt/hgcapp/services-hedera/HapiApp2.0/entrypoint.sh
      startupProbe:
        failureThreshold: 10
        periodSeconds: 15
        timeoutSeconds: 60
        exec:
          command:
            - sh
            - -c
            - |
              if ! type curl gawk > /dev/null 2>&1; then
                sudo mkdir -p /var/cache/apt/archives/partial /var/log/apt
                sudo apt install -y curl gawk > /dev/null 2>&1
              fi

              platform_status() \{
                curl -s http://localhost:9999 | \
                  awk '
                    # HELP platform_PlatformStatus 0=NO_VALUE 1=STARTING_UP 2=ACTIVE ...
                    /^# HELP platform_PlatformStatus / \{
                      help=$0
                    \}

                    # platform_PlatformStatus\{node="1",\} 2.0
                    /^platform_PlatformStatus\{.*\} [0-9]+/ \{
                      status=int($NF)
                    \}

                    END \{
                      print gensub(".*\\s" status "=(\\S*)\\s.*", "\\1", 1, help)
                    \}'
              \}

              PLATFORM_STATUS=$(platform_status)
              echo PlatformStatus=$PLATFORM_STATUS
              test "$PLATFORM_STATUS" = "ACTIVE"
      volumeMounts:
        - name: cluster-config
          mountPath: /tmp/volumes/cluster-config # mount to a temp directory to copy files with appropriate ownership
        - name: grpc-tls-keys
          mountPath: /tmp/volumes/grpc-tls-keys # mount to a temp directory to copy files with appropriate ownership
        - name: hgcapp-init # mount the prepare files to copy to appropriate location
          mountPath: /tmp/volumes/init
        - name: hgcapp-data-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
        - name: hgcapp-output
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/output
        - name: hgcapp-data-saved
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/saved
        - name: hgcapp-data-stats
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/stats
        - name: hgcapp-data-upgrade
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/upgrade
    # {#if rsu && rsu.enabled}
    # Sidecar: record-stream-uploader
    - name: "{rsu.name}"
      image: "{rsu.softwareVersion.repository}/{rsu.softwareVersion.name}:{rsu.softwareVersion.tag}"
      imagePullPolicy: "{rsu.softwareVersion.imagePullPolicy}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/recordStreams
        - --csv-stats-directory
        - /opt/hgcapp/recordStreams/uploader-stats
        # {#if rsu.config.s3.enabled}
        - --s3-endpoint
        - "{rsu.config.s3.url}"
        # {/if}
        # {#if rsu.config.gcs.enabled}
        - --gcs-endpoint
        - "{rsu.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
          subPath: "record{accountId}"
      env:
        - name: DEBUG
          value: "{rsu.config.debug}"
        - name: REAPER_ENABLE
          value: "{rsu.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{rsu.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{rsu.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{rsu.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{rsu.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{rsu.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{rsu.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{rsu.config.sigExtension}"
        - name: RECORD_STREAM_COMPRESSION
          value: "{rsu.config.enableCompression}"
        - name: RECORD_STREAM_SIDECAR
          value: "{rsu.config.enableSidecarFiles}"
        - name: SIG_REQUIRE
          value: "{rsu.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{rsu.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{rsu.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{rsu.config.bucketName}"
        - name: S3_ENABLE
          value: "{rsu.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{rsu.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{rsu.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{rsu.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{rsu.config.envFromSecret}"
    # {/if}
    # {#if rssu && rssu.enabled}
    # Sidecar: record-stream-sidecar-files-uploader
    - name: "{rssu.name}"
      image: "{rssu.softwareVersion.repository}/{rssu.softwareVersion.name}:{rssu.softwareVersion.tag}"
      imagePullPolicy: "{rssu.softwareVersion.imagePullPolicy}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/recordStreams/sidecar
        # {#if rssu.config.s3.enabled}
        - --s3-endpoint
        - "{rssu.config.s3.url}"
        # {/if}
        # {#if rssu.config.gcs.enabled}
        - --gcs-endpoint
        - "{rssu.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
          subPath: "record{accountId}"
      env:
        - name: DEBUG
          value: "{rssu.config.debug}"
        - name: REAPER_ENABLE
          value: "{rssu.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{rssu.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{rssu.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{rssu.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{rssu.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{rssu.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{rssu.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{rssu.config.sigExtension}"
        - name: RECORD_STREAM_COMPRESSION
          value: "{rssu.config.enableCompression}"
        - name: RECORD_STREAM_SIDECAR
          value: "{rssu.config.enableSidecarFiles}"
        - name: SIG_REQUIRE
          value: "{rssu.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{rssu.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{rssu.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{rssu.config.bucketName}"
        - name: S3_ENABLE
          value: "{rssu.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{rssu.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{rssu.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{rssu.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{rssu.config.envFromSecret}"
    # {/if}
    # {#if esu && esu.enabled}
    # Sidecar: event-stream-uploader
    - name: "{esu.name}"
      image: "{esu.softwareVersion.repository}/{esu.softwareVersion.name}:{esu.softwareVersion.tag}"
      imagePullPolicy: "{esu.softwareVersion.imagePullPolicy}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/eventsStreams
        - --debug
        # {#if esu.config.s3.enabled}
        - --s3-endpoint
        - "{esu.config.s3.url}"
        # {/if}
        # {#if esu.config.gcs.enabled}
        - --gcs-endpoint
        - "{esu.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
          subPath: "events_{accountId}"
      env:
        - name: DEBUG
          value: "{esu.config.debug}"
        - name: REAPER_ENABLE
          value: "{esu.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{esu.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{esu.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{esu.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{esu.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{esu.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{esu.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{esu.config.sigExtension}"
        - name: SIG_REQUIRE
          value: "{esu.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{esu.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{esu.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{esu.config.bucketName}"
        - name: S3_ENABLE
          value: "{esu.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{esu.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{esu.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{esu.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{esu.config.envFromSecret}"
    # {/if}
    # {#if bu && bu.enabled}
    # Sidecar: backup-uploader
    - name: "{bu.name}"
      image: "{bu.softwareVersion.repository}/{bu.softwareVersion.name}:{bu.softwareVersion.tag}"
      imagePullPolicy: "{bu.softwareVersion.imagePullPolicy}"
      volumeMounts:
        - name: hgcapp-data-saved
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/saved
        - name: backup-uploader-config
          mountPath: /home/hedera/.config/rclone/rclone.conf
          subPath: rclone.conf
        - name: hgcapp-init
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/VERSION
          subPath: VERSION
      env:
        - name: BACKUP_UPLOADER_BUCKET_1
          value: "{bu.config.bucketName}"
        - name: RCLONE_S3_ENDPOINT
          value: "{#if bu.config.gcs.enabled}{bu.config.gcs.url}{#else}{bu.config.s3.url}{/if}"
        - name: RCLONE_S3_ACCESS_KEY_ID
          value: "{#if bu.config.gcs.enabled}{bu.config.gcs.accessKey}{#else}{bu.config.s3.accessKey}{/if}"
      envFrom:
        - secretRef:
            name: "{bu.config.envFromSecret}"
    # {/if}
  volumes:
    - name: cluster-config
      configMap:
        name: cluster-config
        defaultMode: "{defaultMode}"
    - name: backup-uploader-config
      configMap:
        name: backup-uploader-config
        defaultMode: "{defaultMode}"
    - name: public-keys
      configMap:
        name: public-keys
        defaultMode: "{defaultMode}"
    - name: gossip-keys
      secret:
        secretName: "{nodeId}-gossip-keys"
        defaultMode: "{defaultMode}"
    - name: grpc-tls-keys
      secret:
        secretName: "{nodeId}-grpc-tls-keys"
        defaultMode: "{defaultMode}"
    - name: hgcapp-record-streams
      persistentVolumeClaim:
        claimName: "{nodeId}-record-streams"
    - name: hgcapp-events-streams
      persistentVolumeClaim:
        claimName: "{nodeId}-events-streams"
    - name: hgcapp-output
      persistentVolumeClaim:
        claimName: "{nodeId}-output"
    - name: hgcapp-data-keys
      persistentVolumeClaim:
        claimName: "{nodeId}-data-keys"
    - name: hgcapp-data-saved
      persistentVolumeClaim:
        claimName: "{nodeId}-data-saved"
    - name: hgcapp-data-stats
      persistentVolumeClaim:
        claimName: "{nodeId}-data-stats"
    - name: hgcapp-data-upgrade
      persistentVolumeClaim:
        claimName: "{nodeId}-data-upgrade"
    - name: hgcapp-init
      emptyDir: {}
