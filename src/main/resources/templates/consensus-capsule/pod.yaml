# {@String namespace}
# {@String nodeId}
# {@String accountId}
# {@java.util.List nodeIds}
# {@java.util.Set publicKeyFiles}
# {@io.fabric8.kubernetes.api.model.PodSecurityContext securityContext}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader recordStreamUploader}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader recordStreamSidecarFilesUploader}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader eventStreamUploader}
# {@com.hedera.solo.operator.model.commonspec.StreamUploader backupUploader}
kind: Pod
apiVersion: v1
metadata:
  name: consensus-node
  labels:
    app: consensus-node
spec:
  restartPolicy: Never
  hostname: "{nodeId}"
  subdomain: consensus
  serviceAccountName: "{nodeId}-sa"
  initContainers:
    - name: init-lookup-services
      image: curlimages/curl:8.9.1
      command:
        - "/bin/sh"
        - "-c"
        - |
          lookupSvc() \{
            local svc="$1"
            local attempt=1
            local delay=5
            local maxAttempt=100
            local rc=0
            # Check for services with a timeout
            until [ $attempt -gt $maxAttempt ]; do
              echo "-------------------------------------------------------------------"
              #nslookup "$svc" > /dev/null 2>&1
              nslookup "$svc"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "OK: $svc"
                echo "-------------------------------------------------------------------"
                return $rc
              fi
              echo "Attempt $attempt failed. Retrying in $delay seconds..."
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done
            echo "ERROR: Timeout occurred; lookup failed for services: $svc."
            return 1
          \}

          checkConsensusNodeSvc() \{
            # {#for n in nodeIds }
            lookupSvc "{n}.consensus.{namespace}.svc.cluster.local" || return $?
            lookupSvc "{n}-svc.{namespace}.svc.cluster.local" || return $?
            # {/for}
            echo "Lookup succeeded for all services."
            return 0
          \}

          runCheck() \{
            checkConsensusNodeSvc || return 1
            return 0
          \}

          runCheck
    - name: "init-consensus-node"
      image: busybox:1.36.1
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
        - name: hgcapp-version
          mountPath: /tmp/versionInfo
        - name: hgcapp-data-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
        - name: grpc-tls-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.crt
          subPath: hedera-{nodeId}.crt
        - name: gossip-keys
          mountPath: /tmp/gossip-keys
        - name: public-keys
          mountPath: /tmp/public-keys
      command:
        - "/bin/sh"
        - "-c"
        - |
          setupDirs() \{
            mkdir -p /opt/hgcapp/recordStreams/record{accountId}/sidecar
            chown -R hedera:hedera /opt/hgcapp/recordStreams
            mkdir -p /opt/hgcapp/eventsStreams/events_{accountId}
            chown -R hedera:hedera /opt/hgcapp/eventsStreams
            touch /tmp/versionInfo/VERSION # FIXME change to copy when VERSION file is baked in the image
            return 0
          \}

          runInit() \{
            echo "Copying keys into /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/"
            cp -rLfv /tmp/gossip-keys/* /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/
            cp -rLfv /tmp/public-keys/* /opt/hgcapp/services-hedera/HapiApp2.0/data/keys/

            # setup directories before consensus-node starts
            setupDirs || return 1
            return 0
          \}

          runInit
  containers:
    - name: consensus-node
      image: gcr.io/hedera-registry/consensus-node:0.52.0-alpha.6
      env:
        - name: JAVA_OPTS
          value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
      startupProbe:
        failureThreshold: 10
        periodSeconds: 15
        timeoutSeconds: 60
        exec:
          command:
            - sh
            - -c
            - |
              if ! type curl gawk > /dev/null 2>&1; then
                sudo mkdir -p /var/cache/apt/archives/partial /var/log/apt
                sudo apt install -y curl gawk > /dev/null 2>&1
              fi

              platform_status() \{
                curl -s http://localhost:9999 | \
                  awk '
                    # HELP platform_PlatformStatus 0=NO_VALUE 1=STARTING_UP 2=ACTIVE ...
                    /^# HELP platform_PlatformStatus / \{
                      help=$0
                    \}

                    # platform_PlatformStatus\{node="1",\} 2.0
                    /^platform_PlatformStatus\{.*\} [0-9]+/ \{
                      status=int($NF)
                    \}

                    END \{
                      print gensub(".*\\s" status "=(\\S*)\\s.*", "\\1", 1, help)
                    \}'
              \}

              PLATFORM_STATUS=$(platform_status)
              echo PlatformStatus=$PLATFORM_STATUS
              test "$PLATFORM_STATUS" = "ACTIVE"
      volumeMounts:
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/config.txt
          subPath: config.txt
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/settings.txt
          subPath: settings.txt
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/log4j2.xml
          subPath: log4j2.xml
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/api-permission.properties
          subPath: api-permission.properties
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/application.properties
          subPath: application.properties
        - name: cluster-config
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/config/bootstrap.properties
          subPath: bootstrap.properties
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
        - name: hgcapp-output
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/output
        - name: hgcapp-data-saved
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/saved
        - name: hgcapp-data-stats
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/stats
        - name: hgcapp-data-upgrade
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/upgrade
        - name: hgcapp-data-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/keys
        - name: grpc-tls-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.crt
          subPath: "hedera-{nodeId}.crt"
        - name: grpc-tls-keys
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/hedera.key
          subPath: "hedera-{nodeId}.key"
        - name: gossip-keys
          mountPath: "/opt/hgcapp/services-hedera/HapiApp2.0/data/keys/a-private-{nodeId}.pem"
          subPath: "a-private-{nodeId}.pem"
        - name: gossip-keys
          mountPath: "/opt/hgcapp/services-hedera/HapiApp2.0/data/keys/s-private-{nodeId}.pem"
          subPath: "s-private-{nodeId}.pem"
        # {#for publicKeyFile in publicKeyFiles}
        - name: public-keys
          mountPath: "/opt/hgcapp/services-hedera/HapiApp2.0/data/keys/{publicKeyFile}"
          subPath: "{publicKeyFile}"
        # {/for}
    # {#if recordStreamUploader && recordStreamUploader.enabled}
    # Sidecar: record-stream-uploader
    - name: "{recordStreamUploader.name}"
      image: "{recordStreamUploader.image}"
      imagePullPolicy: "{recordStreamUploader.imagePullPolicy}"
      securityContext:
        runAsUser: "{securityContext.runAsUser}"
        runAsGroup: "{securityContext.runAsGroup}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/recordStreams
        - --csv-stats-directory
        - /opt/hgcapp/recordStreams/uploader-stats
        # {#if recordStreamUploader.config.s3.enabled}
        - --s3-endpoint
        - "{recordStreamUploader.config.s3.url}"
        # {/if}
        # {#if recordStreamUploader.config.gcs.enabled}
        - --gcs-endpoint
        - "{recordStreamUploader.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
          subPath: "record{accountId}"
      env:
        - name: DEBUG
          value: "{recordStreamUploader.config.debug}"
        - name: REAPER_ENABLE
          value: "{recordStreamUploader.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{recordStreamUploader.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{recordStreamUploader.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{recordStreamUploader.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{recordStreamUploader.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{recordStreamUploader.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{recordStreamUploader.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{recordStreamUploader.config.sigExtension}"
        - name: RECORD_STREAM_COMPRESSION
          value: "{recordStreamUploader.config.enableCompression}"
        - name: RECORD_STREAM_SIDECAR
          value: "{recordStreamUploader.config.enableSidecarFiles}"
        - name: SIG_REQUIRE
          value: "{recordStreamUploader.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{recordStreamUploader.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{recordStreamUploader.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{recordStreamUploader.config.bucketName}"
        - name: S3_ENABLE
          value: "{recordStreamUploader.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{recordStreamUploader.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{recordStreamUploader.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{recordStreamUploader.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{recordStreamUploader.config.envFromSecret}"
    # {/if}
    # {#if recordStreamSidecarFilesUploader && recordStreamSidecarFilesUploader.enabled}
    # Sidecar: record-stream-sidecar-files-uploader
    - name: "{recordStreamSidecarFilesUploader.name}"
      image: "{recordStreamSidecarFilesUploader.image}"
      imagePullPolicy: "{recordStreamSidecarFilesUploader.imagePullPolicy}"
      securityContext:
        runAsUser: "{securityContext.runAsUser}"
        runAsGroup: "{securityContext.runAsGroup}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/recordStreams/sidecar
        # {#if recordStreamSidecarFilesUploader.config.s3.enabled}
        - --s3-endpoint
        - "{recordStreamSidecarFilesUploader.config.s3.url}"
        # {/if}
        # {#if recordStreamSidecarFilesUploader.config.gcs.enabled}
        - --gcs-endpoint
        - "{recordStreamSidecarFilesUploader.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-record-streams
          mountPath: /opt/hgcapp/recordStreams
          subPath: "record{accountId}"
      env:
        - name: DEBUG
          value: "{recordStreamSidecarFilesUploader.config.debug}"
        - name: REAPER_ENABLE
          value: "{recordStreamSidecarFilesUploader.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{recordStreamSidecarFilesUploader.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{recordStreamSidecarFilesUploader.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{recordStreamSidecarFilesUploader.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{recordStreamSidecarFilesUploader.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{recordStreamSidecarFilesUploader.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{recordStreamSidecarFilesUploader.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{recordStreamSidecarFilesUploader.config.sigExtension}"
        - name: RECORD_STREAM_COMPRESSION
          value: "{recordStreamSidecarFilesUploader.config.enableCompression}"
        - name: RECORD_STREAM_SIDECAR
          value: "{recordStreamSidecarFilesUploader.config.enableSidecarFiles}"
        - name: SIG_REQUIRE
          value: "{recordStreamSidecarFilesUploader.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{recordStreamSidecarFilesUploader.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{recordStreamSidecarFilesUploader.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{recordStreamSidecarFilesUploader.config.bucketName}"
        - name: S3_ENABLE
          value: "{recordStreamSidecarFilesUploader.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{recordStreamSidecarFilesUploader.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{recordStreamSidecarFilesUploader.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{recordStreamSidecarFilesUploader.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{recordStreamSidecarFilesUploader.config.envFromSecret}"
    # {/if}
    # {#if eventStreamUploader && eventStreamUploader.enabled}
    # Sidecar: event-stream-uploader
    - name: "{eventStreamUploader.name}"
      image: "{eventStreamUploader.image}"
      imagePullPolicy: "{eventStreamUploader.imagePullPolicy}"
      securityContext:
        runAsUser: "{securityContext.runAsUser}"
        runAsGroup: "{securityContext.runAsGroup}"
      command:
        - /usr/bin/env
        - python3.7
        - /usr/local/bin/mirror.py
        - --linux
        - --watch-directory
        - /opt/hgcapp/eventsStreams
        - --debug
        # {#if eventStreamUploader.config.s3.enabled}
        - --s3-endpoint
        - "{eventStreamUploader.config.s3.url}"
        # {/if}
        # {#if eventStreamUploader.config.gcs.enabled}
        - --gcs-endpoint
        - "{eventStreamUploader.config.gcs.url}"
        # {/if}
      volumeMounts:
        - name: hgcapp-events-streams
          mountPath: /opt/hgcapp/eventsStreams
          subPath: "events_{accountId}"
      env:
        - name: DEBUG
          value: "{eventStreamUploader.config.debug}"
        - name: REAPER_ENABLE
          value: "{eventStreamUploader.config.reaper.enabled}"
        - name: REAPER_MIN_KEEP
          value: "{eventStreamUploader.config.reaper.minKeep}"
        - name: REAPER_INTERVAL
          value: "{eventStreamUploader.config.reaper.interval}"
        - name: REAPER_DEFAULT_BACKOFF
          value: "{eventStreamUploader.config.reaper.defaultBackoff}"
        - name: STREAM_FILE_EXTENSION
          value: "{eventStreamUploader.config.streamFileExtension}"
        - name: STREAM_SIG_EXTENSION
          value: "{eventStreamUploader.config.streamSigExtension}"
        - name: STREAM_EXTENSION
          value: "{eventStreamUploader.config.streamExtension}"
        - name: SIG_EXTENSION
          value: "{eventStreamUploader.config.sigExtension}"
        - name: SIG_REQUIRE
          value: "{eventStreamUploader.config.signature.require}"
        - name: SIG_PRIORITIZE
          value: "{eventStreamUploader.config.signature.prioritize}"
        - name: BUCKET_PATH
          value: "{eventStreamUploader.config.bucketPath}"
        - name: BUCKET_NAME
          value: "{eventStreamUploader.config.bucketName}"
        - name: S3_ENABLE
          value: "{eventStreamUploader.config.s3.enabled}"
        - name: S3_ACCESS_KEY
          value: "{eventStreamUploader.config.s3.accessKey}"
        - name: GCS_ENABLE
          value: "{eventStreamUploader.config.gcs.enabled}"
        - name: GCS_ACCESS_KEY
          value: "{eventStreamUploader.config.gcs.accessKey}"
      envFrom:
        - secretRef:
            name: "{eventStreamUploader.config.envFromSecret}"
    # {/if}
    # {#if backupUploader && backupUploader.enabled}
    # Sidecar: backup-uploader
    - name: "{backupUploader.name}"
      image: "{backupUploader.image}"
      imagePullPolicy: "{backupUploader.imagePullPolicy}"
      securityContext:
        runAsUser: "{securityContext.runAsUser}"
        runAsGroup: "{securityContext.runAsGroup}"
      volumeMounts:
        - name: hgcapp-data-saved
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/data/saved
        - name: backup-uploader-config
          mountPath: /home/hedera/.config/rclone/rclone.conf
          subPath: rclone.conf
        - name: hgcapp-version
          mountPath: /opt/hgcapp/services-hedera/HapiApp2.0/VERSION
          subPath: VERSION
      env:
        - name: BACKUP_UPLOADER_BUCKET_1
          value: "{backupUploader.config.bucketName}"
          # {#if backupUploader.config.s3.enabled}
        - name: RCLONE_S3_ENDPOINT
          value: "{backupUploader.config.s3.url}"
        - name: RCLONE_S3_ACCESS_KEY_ID
          value: "{backupUploader.config.s3.accessKey}"
          # {#else backupUploader.config.gcs.enabled}
        - name: RCLONE_S3_ENDPOINT
          value: "{backupUploader.config.gcs.url}"
        - name: RCLONE_S3_ACCESS_KEY_ID
          value: "{backupUploader.config.gcs.accessKey}"
          # {/if}
      envFrom:
        - secretRef:
            name: "{backupUploader.config.envFromSecret}"
    # {/if}
  volumes:
    - name: cluster-config
      configMap:
        name: cluster-config
    - name: backup-uploader-config
      configMap:
        name: backup-uploader-config
    - name: public-keys
      configMap:
        name: public-keys
    - name: gossip-keys
      secret:
        secretName: "{nodeId}-gossip-keys"
    - name: grpc-tls-keys
      secret:
        secretName: "{nodeId}-grpc-tls-keys"
    - name: hgcapp-record-streams
      persistentVolumeClaim:
        claimName: "{nodeId}-record-streams"
    - name: hgcapp-events-streams
      persistentVolumeClaim:
        claimName: "{nodeId}-events-streams"
    - name: hgcapp-output
      persistentVolumeClaim:
        claimName: "{nodeId}-output"
    - name: hgcapp-data-keys
      persistentVolumeClaim:
        claimName: "{nodeId}-data-keys"
    - name: hgcapp-data-saved
      persistentVolumeClaim:
        claimName: "{nodeId}-data-saved"
    - name: hgcapp-data-stats
      persistentVolumeClaim:
        claimName: "{nodeId}-data-stats"
    - name: hgcapp-data-upgrade
      persistentVolumeClaim:
        claimName: "{nodeId}-data-upgrade"
    - name: hgcapp-version
      emptyDir: {}
