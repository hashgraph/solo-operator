### Kubernetes Configuration ###
quarkus.kubernetes.namespace=solo-operator
quarkus.kubernetes.rbac.service-accounts.solo-operator.namespace=solo-operator

### Operator SDK Configuration ###
quarkus.operator-sdk.crd.generate=false
# build/helm/crds/networkoperations.operator.solo.hedera.com-v1.yml,\
# build/helm/crds/haproxycapsules.operator.solo.hedera.com-v1.yml,\
quarkus.operator-sdk.crd.external-crd-locations=\
  build/helm/crds/consensuscapsules.operator.solo.hedera.com-v1.yml,\
  build/helm/crds/networkoperations.operator.solo.hedera.com-v1.yml,\
  build/helm/crds/haproxycapsules.operator.solo.hedera.com-v1.yml,\
  build/helm/crds/orbits.operator.solo.hedera.com-v1.yml
quarkus.operator-sdk.crd.apply=true
quarkus.operator-sdk.bundle.enabled=false
#quarkus.operator-sdk.bundle.generate=false
quarkus.operator-sdk.helm.enabled=true
quarkus.operator-sdk.activate-leader-election-for-profiles=prod

### Container Build Configuration ###
quarkus.container-image.build=false
quarkus.container-image.builder=docker
quarkus.container-image.name=solo-operator
quarkus.container-image.tag=${quarkus.application.version}

### DevServices Configuration ###
quarkus.kubernetes-client.devservices.shared=true
quarkus.kubernetes-client.devservices.service-name=solo-operator-cluster

# Prevent Qute warning unable to detect the content type for matching files
quarkus.qute.content-types."qute"=application/octet-stream
quarkus.qute.content-types."yaml"=application/yaml

# Register security providers
quarkus.security.security-providers=BC
