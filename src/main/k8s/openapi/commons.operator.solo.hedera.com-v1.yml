# SPDX-License-Identifier: Apache-2.0

---
openapi: 3.0.3
info:
  title: OpenAPI Schema
  version: 1.0.0
paths: { }
components:
  schemas:
    CommonSpec:
      description: Reusable components within generated object model
      type: object
      properties:
        softwareVersion:
          $ref: "#/components/schemas/SoftwareVersion"
        AddressBookEntry:
          $ref: "#/components/schemas/AddressBookEntry"
        streamUploader:
          $ref: "#/components/schemas/StreamUploader"
        streamUploaderChangeset:
          $ref: "#/components/schemas/StreamUploaderChangeset"
        nodeProperties:
          $ref: "#/components/schemas/NodeProperties"
        nodeLoggingConfiguration:
          $ref: "#/components/schemas/NodeLoggingConfiguration"
        softwareVersionSource:
          $ref: "#/components/schemas/SoftwareVersionSource"
        imageRepository:
          $ref: "#/components/schemas/ImageRepository"
        imageVerificationSpec:
          $ref: "#/components/schemas/ImageVerificationSpec"
        imageRepositoryStatus:
          $ref: "#/components/schemas/ImageRepositoryStatus"
        consensusNodeChangeset:
          $ref: "#/components/schemas/ConsensusNodeChangeset"
        haproxyChangeset:
          $ref: "#/components/schemas/HaproxyChangeset"
        keyReference:
          $ref: "#/components/schemas/KeyReference"

    SoftwareVersion:
      type: object
      required:
        - repository
        - imageName
        - imageTag
      properties:
        repository:
          type: string
        imageName:
          type: string
        imageTag:
          type: string
        manifestHash:
          type: string
        imageVerificationSpec:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.ImageVerificationSpec
        imagePullSecrets:
          $ref: "#/components/schemas/ImagePullSecrets"
        imagePullPolicy:
          $ref: "#/components/schemas/ImagePullPolicy"

    ImagePullSecrets:
      type: array
      default: []
      items:
        type: object
        x-java-type: io.fabric8.kubernetes.api.model.LocalObjectReference # refers to a k8s secret

    ImagePullPolicy:
      type: string
      enum:
        - Always
        - Never
        - IfNotPresent
      default: IfNotPresent

    AddressBookEntry:
      type: object
      required:
        - nodeId
        - nickName
        - selfName
        - weight
        - internalHostname
        - internalPort
        - externalHostname
        - externalPort
        - nodeAccount
      properties:
        nodeId:
          type: integer
          format: int64
        nickName:
          type: string
        selfName:
          type: string
        weight:
          type: integer
        internalHostname:
          type: string
        internalPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        externalHostname:
          type: string
        externalPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        nodeAccount:
          description: |
            In the form `0.0.x`, where `x` is the account number. The Platform SDK address book
            calls this the `memo` field.
          type: string
        publicSigningCertificate:
          description: |
            The public signing certificate for the node. This should be in PEM format.
          type: string
        publicLedgerKey:
          description: |
            The public ledger key for the node. This should be in base64 encoded binary public key.
          type: string

    StreamUploader:
      type: object
      required:
        - softwareVersion
      properties:
        name:
          type: string
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
          default: false
        config:
          type: object
          properties:
            debug:
              type: boolean
              default: true
            enableCompression:
              type: boolean
              default: false
            enableSidecarFiles:
              type: boolean
              default: false
            reaper:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                minKeep:
                  type: integer
                  default: 1
                interval:
                  type: integer
                  default: 1
                defaultBackoff:
                  type: integer
                  default: 1
            signature:
              type: object
              properties:
                require:
                  type: boolean
                  default: true
                prioritize:
                  type: boolean
                  default: true
            streamFileExtension:
              type: string
              default: ""
            streamSigExtension:
              type: string
              default: ""
            streamExtension:
              type: string
              default: ""
            sigExtension:
              type: string
              default: ""
            bucketName:
              type: string
            bucketPath:
              type: string
            s3:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
                  default: "" # http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000
            gcs:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
            envFromSecret:
              type: string
        additionalVolumeMounts:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.VolumeMount

    StreamUploaderChangeset:
      type: object
      properties:
        name:
          type: string
        softwareVersionSource:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersionSource
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
        config:
          type: object
          properties:
            debug:
              type: boolean
            enableCompression:
              type: boolean
            enableSidecarFiles:
              type: boolean
            reaper:
              type: object
              properties:
                enabled:
                  type: boolean
                minKeep:
                  type: integer
                interval:
                  type: integer
                defaultBackoff:
                  type: integer
            signature:
              type: object
              properties:
                require:
                  type: boolean
                prioritize:
                  type: boolean
            streamFileExtension:
              type: string
            streamSigExtension:
              type: string
            streamExtension:
              type: string
            sigExtension:
              type: string

    NodeProperties: # corresponds to: node.properties
      type: object
      required:
        - nodeId
        - configuration
      properties:
        nodeId:
          type: integer
          format: int64
        configuration:
          type: object
          additionalProperties:
            type: string

    NodeLoggingConfiguration:
      type: object
      required:
        - nodeId
        - configuration
      properties:
        nodeId:
          type: integer
          format: int64
        configuration: # e.g. log4j2.xml content
          type: string

    ImageRepository:
      type: object
      required:
        - imageName
        - imageTag
        - repository
      properties: # docker.io/library/ubuntu:focal
        repository: # docker.io/library
          type: string
        imageName: # ubuntu
          type: string
        imageTag: # focal
          type: string
        imagePullSecrets:
          $ref: "#/components/schemas/ImagePullSecrets"

    ImageVerificationSpec:
      type: object
      required:
        - layerHashes
      properties:
        os:
          type: string
          enum: # GOOS
            - darwin
            - linux
            - windows
        architecture: # GOARCH
          type: string
          enum:
            - "amd64"
            - "arm64"
        layerHashes: # digests
          type: array
          items:
            description: |
              Manifest layer digests are expected here, matching those reported by tools such as `skopeo inspect`.
              Due to compression, manifest layer digests will in general differ from those reported by tools such as
              `docker inspect` which report layer `DiffID`, or the digest of the uncompressed layer archive.
            type: string

    SoftwareVersionSource: # move up close to SoftwareVersion
      type: object
      required:
        - imageRepositories
        - imageVerificationSpec
      properties:
        imageRepositories: # may be more than 32 entries from all node operators
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.ImageRepository
        imageVerificationSpec:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.ImageVerificationSpec
        imagePullPolicy:
          $ref: "#/components/schemas/ImagePullPolicy"

    ImageRepositoryStatus:
      type: object
      required:
        - imageName
        - imageTag
        - repository
        - selectedForDeployment
        - validity
      properties:
        repository:
          type: string
        imageName:
          type: string
        imageTag:
          type: string
        validity:
          type: string
          enum:
            - Unknown
            - Valid
            - Invalid
            - NotFound
        selectedForDeployment: # take random from the valid list. When we check next time if this is not available, then we choose the first valid assuming user has listed in preferred order.
          type: boolean
          default: false
        manifestHash: # this is resolved for this repository in network-execute step
          type: string
        imageVerificationSpec:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.ImageVerificationSpec
        imagePullSecrets:
          $ref: "#/components/schemas/ImagePullSecrets"
        imagePullPolicy:
          $ref: "#/components/schemas/ImagePullPolicy"

    ConsensusNodeChangeset:
      type: object
      properties:
        softwareVersionSource:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersionSource
        nodeProperties:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.NodeProperties
        logging:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.NodeLoggingConfiguration

    HaproxyChangeset:
      type: object
      properties:
        haproxy:
          type: object
          default: { }
          properties:
            softwareVersionSource:
              type: object
              x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersionSource
            user:
              description: stats user
              type: string
              default: "user"
            auth:
              description: stats auth
              type: string
              default: "auth"
        serviceType:
          type: string
          default: LoadBalancer
          enum:
            - ClusterIP
            - Ingress
            - LoadBalancer
        serviceSpec:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ServiceSpec
        ingressSpec:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.networking.v1.IngressSpec

    KeyReference:
      type: object
      required:
      - secretName
      properties:
        secretName:
          type: string
        keyName:
          type: string
