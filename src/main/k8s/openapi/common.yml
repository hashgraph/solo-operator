# SPDX-License-Identifier: Apache-2.0

---
openapi: 3.0.3
info:
  title: OpenAPI Schema
  version: 1.0.0
paths: { }
components:
  schemas:
    CommonSpec:
      description: Reusable components within generated object model
      type: object
      properties:
        softwareVersion:
          $ref: "#/components/schemas/SoftwareVersion"
        AddressBookEntry:
          $ref: "#/components/schemas/AddressBookEntry"
        streamUploader:
          $ref: "#/components/schemas/StreamUploader"
        openTelemetryCollector:
          $ref: "#/components/schemas/OpenTelemetryCollector"
        streamUploaderChangeset:
          $ref: "#/components/schemas/StreamUploaderChangeset"
        nodeProperties:
          $ref: "#/components/schemas/NodeProperties"
        nodeLoggingConfiguration:
          $ref: "#/components/schemas/NodeLoggingConfiguration"
        softwareVersionSource:
          $ref: "#/components/schemas/SoftwareVersionSource"
        softwareVersionStatus:
          $ref: "#/components/schemas/SoftwareVersionStatus"
        consensusNodeChangeset:
          $ref: "#/components/schemas/ConsensusNodeChangeset"
        haproxyChangeset:
          $ref: "#/components/schemas/HaproxyChangeset"

    SoftwareVersion:
      type: object
      properties:
        repository:
          type: string
        name:
          type: string
        tag:
          type: string
        layerHashes:
          type: array
          items:
            type: string
        imagePullSecrets:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.LocalObjectReference # refers to a k8s secret
        imagePullPolicy:
          type: string
          enum:
            - Always
            - Never
            - IfNotPresent
          default: IfNotPresent

    AddressBookEntry:
      type: object
      properties:
        nodeId:
          type: integer
          format: int64
        nickName:
          type: string
        selfName:
          type: string
        weight:
          type: integer
        internalHostname:
          type: string
        internalPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        externalHostname:
          type: string
        externalPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        nodeAccount:
          description: |
            In the form `0.0.x`, where `x` is the account number. The Platform SDK address book
            calls this the `memo` field.
          type: string
        publicSigningKey:
          description: |
            The public signing key for the node. This should be in PEM format.
          type: string

    StreamUploader:
      type: object
      properties:
        name:
          type: string
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
          default: false
        config:
          type: object
          properties:
            debug:
              type: boolean
              default: true
            enableCompression:
              type: boolean
              default: false
            enableSidecarFiles:
              type: boolean
              default: false
            reaper:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                minKeep:
                  type: integer
                  default: 1
                interval:
                  type: integer
                  default: 1
                defaultBackoff:
                  type: integer
                  default: 1
            signature:
              type: object
              properties:
                require:
                  type: boolean
                  default: true
                prioritize:
                  type: boolean
                  default: true
            streamFileExtension:
              type: string
              default: ""
            streamSigExtension:
              type: string
              default: ""
            streamExtension:
              type: string
              default: ""
            sigExtension:
              type: string
              default: ""
            bucketName:
              type: string
            bucketPath:
              type: string
            s3:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
                  default: "" # http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000
            gcs:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
            envFromSecret:
              type: string
        additionalVolumeMounts:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.VolumeMount

    OpenTelemetryCollector:
      type: object
      properties:
        name:
          type: string
          default: "open-telemetry-collector"
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
          default:
            repository: "docker.io/otel"
            name: "opentelemetry-collector-contrib"
            tag: "0.72.0"
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
          default: false
        config:
          type: object
          default: { }
          properties:
            appName:
              type: string
              default: "hedera-node"
            environment:
              description: |
                The network environment for which the `Orbit` is running; e.g. mainnet, testnet, previewnet-1, integration etc.
              type: string
              default: integration
            logLevel:
              description: The log level for the logging exporter.
              type: string
              default: DEBUG
            processors:
              type: object
              default: { }
              properties:
                memoryLimiter:
                  type: object
                  default: { }
                  properties:
                    limitMib:
                      type: string
                      default: "400"
                    spikeLimitMib:
                      type: string
                      default: "80" # 20% of limit
            exporters:
              type: object
              default: { }
              properties:
                loki:
                  type: object
                  default: { }
                  properties:
                    enabled:
                      description: Whether Loki logging is enabled for the `Orbit`.
                      type: boolean
                      default: true
                    auth:
                      type: object
                      default: { }
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        secret:
                          description: |
                            The secret containing the OTEL_LOKI_USERNAME and OTEL_LOKI_PASSWORD for the Loki basic authentication.
                            This will be exported as environment variables.
                          type: object
                          x-java-type: io.fabric8.kubernetes.api.model.LocalObjectReference
                          default:
                            name: "telemetry-secrets"
                    endpoint:
                      description: The endpoint for the Loki logging exporter.
                      type: string
            receivers:
              type: object
              default: { }
              properties:
                swirldsVMap:
                  type: object
                  default: { }
                  properties:
                    enabled:
                      type: boolean
                      default: false # disable by default. the log lines are too large (>4Mb) causing Loki limits to be exceeded during local development
                hashstream:
                  type: object
                  default: { }
                  properties:
                    enabled:
                      type: boolean
                      default: false # disable by default
        additionalVolumeMounts:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.VolumeMount

    StreamUploaderChangeset:
      type: object
      properties:
        name:
          type: string
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
        config:
          type: object
          properties:
            debug:
              type: boolean
            enableCompression:
              type: boolean
            enableSidecarFiles:
              type: boolean
            reaper:
              type: object
              properties:
                enabled:
                  type: boolean
                minKeep:
                  type: integer
                interval:
                  type: integer
                defaultBackoff:
                  type: integer
            signature:
              type: object
              properties:
                require:
                  type: boolean
                prioritize:
                  type: boolean
            streamFileExtension:
              type: string
            streamSigExtension:
              type: string
            streamExtension:
              type: string
            sigExtension:
              type: string

    NodeProperties: # corresponds to: node.properties
      type: object
      properties:
        nodeId:
          type: integer
          format: int64
        configuration:
          type: object
          additionalProperties:
            type: string

    NodeLoggingConfiguration:
      type: object
      properties:
        nodeId:
          type: integer
          format: int64
        configuration: # e.g. log4j2.xml content
          type: string

    SoftwareVersionSource: # move up close to SoftwareVersion
      type: object
      properties:
        images:
          type: array
          items:
            type: object
            properties: # docker.io/library/ubuntu:focal
              repository: # docker.io/library
                type: string
              name: # ubuntu
                type: string
              tag: # focal
                type: string
              imagePullSecrets:
                type: array
                items:
                  type: object
                  x-java-type: io.fabric8.kubernetes.api.model.LocalObjectReference
        layers:
          type: array
          items:
            type: object
            properties:
              os:
                type: string
                enum: # GOOS
                  - darwin
                  - linux
                  - windows
              architecture: # GOARCH
                type: string
                enum:
                  - "amd64"
                  - "arm64"
              hashes: # digests
                type: array
                items:
                  type: string
        imagePullPolicy:
          type: string
          enum:
            - Always
            - Never
            - IfNotPresent
          default: IfNotPresent

    SoftwareVersionStatus:
      type: object
      properties:
        repository:
          type: string
        name:
          type: string
        tag:
          type: string
        valid:
          type: string
          enum:
            - UNKNOWN
            - VALID
            - INVALID
        selectedForDeployment:
          type: boolean
          default: false
        manifestHash:
          type: string

    ConsensusNodeChangeset:
      type: object
      properties:
        softwareVersionSource:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersionSource
        nodeProperties:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.NodeProperties
        logging:
          type: array
          items:
            type: object
            x-java-type: com.hedera.solo.operator.model.commonspec.NodeLoggingConfiguration

    HaproxyChangeset:
      type: object
      properties:
        haproxy:
          type: object
          default: { }
          properties:
            softwareVersion:
              type: object
              x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
            user:
              description: stats user
              type: string
              default: "user"
            auth:
              description: stats auth
              type: string
              default: "auth"
        serviceType:
          type: string
          default: LoadBalancer
          enum:
            - ClusterIP
            - Ingress
            - LoadBalancer
        serviceSpec:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ServiceSpec
        ingressSpec:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.networking.v1.IngressSpec
