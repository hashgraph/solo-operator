openapi: 3.0.3
info:
  title: OpenAPI Schema
  version: 1.0.0
paths: { }
components:
  schemas:
    CommonSpec:
      description: Reusable components within generated object model
      type: object
      properties:
        condition:
          $ref: "#/components/schemas/Condition"
        softwareVersion:
          $ref: "#/components/schemas/SoftwareVersion"
        AddressBookEntry:
          $ref: "#/components/schemas/AddressBookEntry"
        streamUploader:
          $ref: "#/components/schemas/StreamUploader"
        openTelemetryCollector:
          $ref: "#/components/schemas/OpenTelemetryCollector"

    Condition:
      type: object
      properties:
        lastTransitionTime:
          description: The time at which the condition last transitioned from one status to another.
          type: string
        #              format: date-time
        message:
          description: A human-readable message indicating details about the transition.
          type: string
        reason:
          description: The reason for the condition's last transition.
          type: string
        status:
          description: The status of the condition. Must be one of True, False, Unknown.
          type: string
          enum:
            - "True"
            - "False"
            - "Unknown"
        type:
          description: The type of the condition.
          type: string

    SoftwareVersion:
      type: object
      properties:
        repository:
          type: string
        name:
          type: string
        tag:
          type: string
        layerHashes:
          type: array
          items:
            type: string
        imagePullSecrets:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.LocalObjectReference
        imagePullPolicy:
          type: string
          enum:
            - Always
            - Never
            - IfNotPresent
          default: IfNotPresent

    AddressBookEntry:
      type: object
      properties:
        nodeId:
          type: string
        nickName:
          type: string
        selfName:
          type: string
        weight:
          type: integer
        internalHostname:
          type: string
        internalPort:
          type: integer
        externalHostname:
          type: string
        externalPort:
          type: integer
        nodeAccount:
          description: |
            In the form `0.0.x`, where `x` is the account number. The Platform SDK address book
            calls this the `memo` field.
          type: string
        publicSigningKey:
          description: |
            The public signing key for the node. This should be in PEM format.
          type: string

    StreamUploader:
      type: object
      properties:
        name:
          type: string
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        enabled:
          type: boolean
          default: false
        config:
          type: object
          properties:
            debug:
              type: boolean
              default: true
            enableCompression:
              type: boolean
              default: false
            enableSidecarFiles:
              type: boolean
              default: false
            reaper:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                minKeep:
                  type: integer
                  default: 1
                interval:
                  type: integer
                  default: 1
                defaultBackoff:
                  type: integer
                  default: 1
            signature:
              type: object
              properties:
                require:
                  type: boolean
                  default: true
                prioritize:
                  type: boolean
                  default: true
            streamFileExtension:
              type: string
              default: ""
            streamSigExtension:
              type: string
              default: ""
            streamExtension:
              type: string
              default: ""
            sigExtension:
              type: string
              default: ""
            bucketName:
              type: string
            bucketPath:
              type: string
            s3:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
                  default: "" # http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000
            gcs:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                accessKey:
                  type: string
                  default: "solo-operator"
                url:
                  type: string
            envFromSecret:
              type: string

    OpenTelemetryCollector:
      type: object
      properties:
        softwareVersion:
          type: object
          x-java-type: com.hedera.solo.operator.model.commonspec.SoftwareVersion
        resources:
          type: object
          x-java-type: io.fabric8.kubernetes.api.model.ResourceRequirements
        receivers:
          type: object
          default: { }
          properties:
            prometheus:
              type: object
              properties:
                scrapeTargets:
                  description: |
                    list of prometheus scrape targets
                    target format: <IP or FQDN>:<Port>
                    e.g. [ 0.0.0.0:9999 ]
                  type: array
                  items:
                    type: string
                scrapeInterval:
                  type: string #5s
        exporters:
          type: object
          default: { }
          properties:
            enabled:
              type: boolean
            endpoint:
              type: string
            tls:
              type: object
              properties:
                insecure:
                  type: boolean
