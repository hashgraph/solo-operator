---
openapi: 3.0.3
info:
  title: OpenAPI Schema
  version: 1.0.0
paths: {}
components:
  schemas:
    EnvoyProxySpec:
      type: object
      default: {}
      properties:
        image:
          description: The Docker image to use for the Envoy proxy.
          type: string
          default: envoyproxy/envoy:v1.21.6
        env:
          type: array
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.EnvVar
          default:
            - name: SERVICE_CLUSTER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NODE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        replicas:
          description: The number of replicas of the Envoy proxy to run.
          type: integer
          format: int32
          default: 2
        proxyPort:
          description: The port on which the Envoy proxy will listen for incoming traffic.
          type: integer
          format: int32
          default: 8081
        adminPort:
          description: The port on which the Envoy admin interface will be exposed.
          type: integer
          format: int32
          default: 9901
        files:
          description: |
            A map of file names to file contents. The files will be mounted into the Envoy container.
            The keys are the file names and the values are the file contents.
          type: object
          additionalProperties:
            type: string
          default:
            /etc/envoy/envoy.yaml: |
              admin:
                address:
                  pipe:
                    path: /admin/admin.sock
              static_resources:
                listeners:
                  - name: listener_0
                    address:
                      socket_address:
                        address: 0.0.0.0
                        port_value: 8081
                    filter_chains:
                      - filters:
                          - name: envoy.filters.network.http_connection_manager
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              codec_type: auto
                              stat_prefix: ingress_http
                              use_remote_address: true
                              skip_xff_append: false
                              route_config:
                                name: local_route
                                virtual_hosts:
                                  - name: local_service
                                    domains:
                                      - '*'
                                    routes:
                                      - match:
                                          prefix: /
                                        route:
                                          cluster: echo_service
                                          timeout: 0s
                                          max_stream_duration:
                                            grpc_timeout_header_max: 0s
                                    cors:
                                      allow_origin_string_match:
                                        - prefix: '*'
                                      allow_methods: GET, PUT, DELETE, POST, OPTIONS
                                      allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout
                                      max_age: "1728000"
                                      expose_headers: custom-header-1,grpc-status,grpc-message
                              http_filters:
                                - name: envoy.filters.http.grpc_web
                                - name: envoy.filters.http.cors
                                - name: envoy.filters.http.router
                clusters:
                  - name: echo_service
                    connect_timeout: 0.25s
                    type: logical_dns
                    http2_protocol_options: { }
                    lb_policy: round_robin
                    load_assignment:
                      cluster_name: cluster_0
                      endpoints:
                        - lb_endpoints:
                            - endpoint:
                                address:
                                  socket_address:
                                    address: hedera-proxy
                                    port_value: 50211
    EnvoyProxyStatus:
      type: object
      properties:
        observedGeneration:
          description: The generation observed by the operator.
          type: integer
        replicas:
          description: The number of replicas of the Envoy proxy.
          type: integer
          format: int32
        availableReplicas:
          description: The number of available replicas of the Envoy proxy.
          type: integer
          format: int32
        readyReplicas:
          description: The number of ready replicas of the Envoy proxy.
          type: integer
          format: int32
        terminatingReplicas:
          description: The number of terminating replicas of the Envoy proxy.
          type: integer
          format: int32
        unavailableReplicas:
          description: The number of unavailable replicas of the Envoy proxy.
          type: integer
          format: int32
        updatedReplicas:
          description: The number of updated replicas of the Envoy proxy.
          type: integer
          format: int32
        conditions:
          items:
            type: object
            x-java-type: io.fabric8.kubernetes.api.model.apps.DeploymentCondition
          type: array
