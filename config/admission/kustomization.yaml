#
# Kustomize component adding the NetworkUpgrade* label-invariant
# ValidatingAdmissionPolicy + Binding (#1133). Referenced from config/default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - policy.yaml
  - binding.yaml
# Ensure namePrefix/nameSuffix rewrite the binding's policyName reference.
configurations:
  - kustomizeconfig/namereference.yaml
