#
# Kustomize component adding the ValidatingAdmissionPolicies + Bindings.
# Referenced from config/default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - policy.yaml
  - binding.yaml
  - orbit_policy.yaml
  - orbit_binding.yaml
# Ensure namePrefix/nameSuffix rewrite the binding's policyName reference.
configurations:
  - kustomizeconfig/namereference.yaml
