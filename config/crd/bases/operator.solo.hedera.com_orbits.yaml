---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: orbits.operator.solo.hedera.com
spec:
  group: operator.solo.hedera.com
  names:
    kind: Orbit
    listKind: OrbitList
    plural: orbits
    shortNames:
    - orbit
    singular: orbit
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Orbit is the Schema for the orbits API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrbitSpec defines the desired state of an Orbit
            properties:
              consensus:
                description: Consensus contains shared configuration for all ConsensusCapsules
                properties:
                  applicationConfiguration:
                    additionalProperties:
                      type: string
                    description: ApplicationConfiguration is equivalent to application.properties
                    type: object
                  genesis:
                    description: Genesis contains genesis-specific configuration
                    properties:
                      addressBook:
                        description: AddressBook contains the address book configuration
                        properties:
                          externalAddresses:
                            description: ExternalAddresses lists external nodes not
                              managed by this operator
                            items:
                              description: AddressBookEntry represents a node in the
                                address book
                              properties:
                                externalHostname:
                                  description: ExternalHostname is the external FQDN
                                    or IP
                                  type: string
                                externalPort:
                                  description: ExternalPort is the external gossip
                                    port
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                internalHostname:
                                  description: InternalHostname is the internal FQDN
                                    or IP
                                  type: string
                                internalPort:
                                  description: InternalPort is the internal gossip
                                    port
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                nickName:
                                  description: NickName is a friendly name for the
                                    node
                                  type: string
                                nodeAccount:
                                  description: NodeAccount is the account ID in the
                                    form "0.0.x"
                                  type: string
                                nodeId:
                                  description: NodeId is the unique identifier for
                                    the node
                                  format: int64
                                  type: integer
                                publicLedgerKey:
                                  description: PublicLedgerKey is the base64-encoded
                                    public ledger key
                                  type: string
                                publicSigningCertificate:
                                  description: PublicSigningCertificate is the PEM-encoded
                                    signing certificate
                                  type: string
                                selfName:
                                  description: SelfName is the self-identifying name
                                  type: string
                                weight:
                                  description: Weight is the consensus weight
                                  type: integer
                              required:
                              - externalHostname
                              - externalPort
                              - internalHostname
                              - internalPort
                              - nickName
                              - nodeAccount
                              - nodeId
                              - selfName
                              - weight
                              type: object
                            type: array
                          ledgerId:
                            description: LedgerId is the ledger identifier (swirld
                              entry)
                            type: string
                          realmId:
                            default: 0
                            description: RealmId is the numeric realm ID
                            type: integer
                          shardId:
                            default: 0
                            description: ShardId is the numeric shard ID
                            type: integer
                        type: object
                    type: object
                  genesisProperties:
                    additionalProperties:
                      type: string
                    description: GenesisProperties is equivalent to genesis.properties
                    type: object
                  networkSettings:
                    additionalProperties:
                      type: string
                    description: NetworkSettings is equivalent to settings.txt
                    type: object
                  permissionConfiguration:
                    additionalProperties:
                      type: string
                    description: PermissionConfiguration is equivalent to api-permission.properties
                    type: object
                  provisioningModel:
                    description: ProvisioningModel specifies how consensus nodes are
                      deployed
                    enum:
                    - InitContainerDinD
                    - InitContainerJava
                    - DeterministicContainerImage
                    type: string
                required:
                - applicationConfiguration
                - networkSettings
                - permissionConfiguration
                type: object
              deploymentModel:
                description: DeploymentModel specifies whether this is a single or
                  multi-cluster deployment
                enum:
                - SingleKubernetesCluster
                - MultipleKubernetesClusters
                type: string
              finalizers:
                description: Finalizers is a list of finalizers to attach to all resources
                  in this Orbit
                items:
                  type: string
                type: array
              lifetime:
                description: Lifetime specifies the duration for this Orbit (e.g.,
                  "P2DT15H" or "2 days 15 hours")
                type: string
              telemetry:
                description: Telemetry contains telemetry configuration
                properties:
                  logging:
                    description: Logging configuration
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables logging
                        type: boolean
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels to attach to logs
                        type: object
                    type: object
                  metrics:
                    description: Metrics configuration
                    properties:
                      enabled:
                        default: false
                        description: Enabled enables metrics collection
                        type: boolean
                      interval:
                        default: 5s
                        description: Interval specifies the collection interval (e.g.,
                          "5s")
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels to attach to metrics
                        type: object
                      port:
                        default: 9998
                        description: Port on which metrics are exposed
                        type: integer
                      remoteWrite:
                        default: false
                        description: RemoteWrite enables remote write
                        type: boolean
                    type: object
                type: object
            required:
            - consensus
            type: object
          status:
            description: OrbitStatus defines the observed state of Orbit
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expirationTime:
                description: ExpirationTime is when the Orbit will expire
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  operator
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the Orbit
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Unknown
                type: string
              startTime:
                description: StartTime is when the Orbit was started
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
