---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: orbits.operator.solo.hedera.com
spec:
  group: operator.solo.hedera.com
  names:
    kind: Orbit
    listKind: OrbitList
    plural: orbits
    shortNames:
    - orbit
    singular: orbit
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Orbit is the Schema for the orbits API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrbitSpec defines the desired state of an Orbit
            properties:
              consensus:
                description: Consensus contains shared configuration for all ConsensusCapsules
                properties:
                  applicationConfiguration:
                    additionalProperties:
                      type: string
                    description: ApplicationConfiguration is equivalent to application.properties
                    type: object
                  genesis:
                    description: Genesis contains genesis-specific configuration
                    properties:
                      addressBook:
                        description: AddressBook contains the address book configuration
                        properties:
                          externalAddresses:
                            description: ExternalAddresses lists external nodes not
                              managed by this operator
                            items:
                              description: AddressBookEntry represents a node in the
                                address book
                              properties:
                                externalHostname:
                                  description: ExternalHostname is the external FQDN
                                    or IP
                                  type: string
                                externalPort:
                                  description: ExternalPort is the external gossip
                                    port
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                internalHostname:
                                  description: InternalHostname is the internal FQDN
                                    or IP
                                  type: string
                                internalPort:
                                  description: InternalPort is the internal gossip
                                    port
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                nickName:
                                  description: NickName is a friendly name for the
                                    node
                                  type: string
                                nodeAccount:
                                  description: NodeAccount is the account ID in the
                                    form "0.0.x"
                                  type: string
                                nodeId:
                                  description: NodeId is the unique identifier for
                                    the node
                                  format: int64
                                  minimum: 0
                                  type: integer
                                publicLedgerKey:
                                  description: PublicLedgerKey is the base64-encoded
                                    public ledger key
                                  type: string
                                publicSigningCertificate:
                                  description: PublicSigningCertificate is the PEM-encoded
                                    signing certificate
                                  type: string
                                selfName:
                                  description: SelfName is the self-identifying name
                                  type: string
                                weight:
                                  description: Weight is the consensus weight
                                  minimum: 0
                                  type: integer
                              required:
                              - externalHostname
                              - externalPort
                              - internalHostname
                              - internalPort
                              - nickName
                              - nodeAccount
                              - nodeId
                              - selfName
                              - weight
                              type: object
                            type: array
                          ledgerId:
                            description: LedgerId is the ledger identifier (swirld
                              entry)
                            type: string
                          realmId:
                            default: 0
                            description: RealmId is the numeric realm ID
                            minimum: 0
                            type: integer
                          shardId:
                            default: 0
                            description: ShardId is the numeric shard ID
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                  genesisProperties:
                    additionalProperties:
                      type: string
                    description: GenesisProperties is equivalent to genesis.properties
                    type: object
                  networkSettings:
                    additionalProperties:
                      type: string
                    description: NetworkSettings is equivalent to settings.txt
                    type: object
                  permissionConfiguration:
                    additionalProperties:
                      type: string
                    description: PermissionConfiguration is equivalent to api-permission.properties
                    type: object
                  provisioningModel:
                    description: ProvisioningModel specifies how consensus nodes are
                      deployed
                    enum:
                    - InitContainerDinD
                    - InitContainerJava
                    - DeterministicContainerImage
                    type: string
                required:
                - applicationConfiguration
                - networkSettings
                - permissionConfiguration
                type: object
              deploymentModel:
                description: DeploymentModel specifies whether this is a single or
                  multi-cluster deployment
                enum:
                - SingleKubernetesCluster
                - MultipleKubernetesClusters
                type: string
              finalizers:
                description: Finalizers is a list of finalizers to attach to all resources
                  in this Orbit
                items:
                  type: string
                type: array
              lifetime:
                description: Lifetime specifies the duration for this Orbit (e.g.,
                  "P2DT15H" or "2 days 15 hours")
                type: string
              telemetry:
                description: Telemetry contains telemetry configuration
                properties:
                  alloy:
                    description: |-
                      Alloy contains default Grafana Alloy telemetry sidecar configuration
                      applied to all ConsensusCapsules in this orbit. Capsule-level settings override these defaults.
                    properties:
                      config:
                        description: Config contains default Alloy collector configuration
                          (exporters, processors, etc.)
                        properties:
                          appName:
                            default: hedera-node
                            description: AppName is the application name
                            type: string
                          environment:
                            default: integration
                            description: Environment is the network environment
                            type: string
                          exporters:
                            description: Exporters contains exporter configuration
                            properties:
                              loki:
                                description: Loki exporter configuration
                                properties:
                                  auth:
                                    description: Auth contains authentication configuration
                                    properties:
                                      enabled:
                                        default: false
                                        description: Enabled enables authentication
                                        type: boolean
                                      secret:
                                        description: Secret references the secret
                                          containing credentials
                                        properties:
                                          name:
                                            default: ""
                                            description: |-
                                              Name of the referent.
                                              This field is effectively required, but due to backwards compatibility is
                                              allowed to be empty. Instances of this type with an empty value here are
                                              almost certainly wrong.
                                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                            type: string
                                        type: object
                                        x-kubernetes-map-type: atomic
                                    type: object
                                  enabled:
                                    default: true
                                    description: Enabled enables Loki logging
                                    type: boolean
                                  endpoint:
                                    description: Endpoint is the Loki endpoint URL
                                    type: string
                                type: object
                              prometheusRemote:
                                description: |-
                                  PrometheusRemote configures Prometheus remote-write via Alloy.
                                  The consensus node always exposes metrics at :9999 for direct scraping —
                                  this controls whether Alloy also scrapes those metrics and pushes them
                                  to a remote Prometheus-compatible endpoint.
                                properties:
                                  enabled:
                                    default: false
                                    description: |-
                                      Enabled enables Alloy to scrape consensus node metrics at :9999
                                      and remote-write them to the configured endpoint.
                                    type: boolean
                                  endpoint:
                                    description: Endpoint is the Prometheus remote-write
                                      URL (e.g. "http://prometheus.observability:9090/api/v1/write")
                                    type: string
                                  scrapeInterval:
                                    default: 15s
                                    description: ScrapeInterval is the Prometheus
                                      scrape interval (e.g. "15s", "30s")
                                    type: string
                                type: object
                            type: object
                          labels:
                            additionalProperties:
                              type: string
                            description: |-
                              Labels contains additional static labels to attach to all telemetry data (logs and metrics).
                              These are merged with the built-in labels (app, environment, node).
                            type: object
                          logLevel:
                            default: info
                            description: LogLevel is the logging level (e.g. "debug",
                              "info", "warn", "error")
                            type: string
                          processors:
                            description: Processors contains processor configuration
                            properties:
                              memoryLimiter:
                                description: MemoryLimiter configuration
                                properties:
                                  limitMib:
                                    default: "400"
                                    description: LimitMib is the memory limit in MiB
                                    type: string
                                  spikeLimitMib:
                                    default: "80"
                                    description: SpikeLimitMib is the spike limit
                                      in MiB (20% of limit)
                                    type: string
                                type: object
                            type: object
                          receivers:
                            description: Receivers contains receiver configuration
                            properties:
                              hashstream:
                                description: Hashstream receiver configuration
                                properties:
                                  enabled:
                                    default: false
                                    description: Enabled enables the receiver
                                    type: boolean
                                type: object
                              swirldsVMap:
                                description: SwirldsVMap receiver configuration
                                properties:
                                  enabled:
                                    default: false
                                    description: Enabled enables the receiver
                                    type: boolean
                                type: object
                            type: object
                        type: object
                      enabled:
                        default: false
                        description: Enabled enables Alloy sidecar for all capsules
                          in this orbit by default
                        type: boolean
                      image:
                        description: Image is the default Alloy container image
                        type: string
                      imagePullPolicy:
                        default: IfNotPresent
                        description: ImagePullPolicy is the default image pull policy
                        type: string
                      resources:
                        description: Resources is the default resource requirements
                          for the Alloy sidecar
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This field depends on the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
                            items:
                              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                              properties:
                                name:
                                  description: |-
                                    Name must match the name of one entry in pod.spec.resourceClaims of
                                    the Pod where this field is used. It makes that resource available
                                    inside a container.
                                  type: string
                                request:
                                  description: |-
                                    Request is the name chosen for a request in the referenced claim.
                                    If empty, everything from the claim is made available, otherwise
                                    only the result of this request.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Limits describes the maximum amount of compute resources allowed.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Requests describes the minimum amount of compute resources required.
                              If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                              otherwise to an implementation-defined value. Requests cannot exceed Limits.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                        type: object
                    type: object
                type: object
            required:
            - consensus
            type: object
          status:
            description: OrbitStatus defines the observed state of Orbit
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expirationTime:
                description: ExpirationTime is when the Orbit will expire
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  operator
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the Orbit
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Unknown
                type: string
              startTime:
                description: StartTime is when the Orbit was started
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
