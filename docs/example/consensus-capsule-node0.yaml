apiVersion: operator.solo.hedera.com/v1alpha1
kind: ConsensusCapsule
metadata:
  name: node0
spec:
  orbit: solo-orbit
  nodeId: 0
  accountId: "0.0.3"
  eligibleForDeployment: false
  podProperties: # FIXME use other pod properties
    containers:
      consensusNode:
        name: "consensus-node"
        softwareVersion:
          repository: "swirldslabs.jfrog.io/consensus-node-docker-dev"
          name: "consensus-node"
          tag: "0.57.0-develop.x6553ab8" # released on 11-22-2024 05:31:48 +1100
          imagePullPolicy: IfNotPresent
      recordStreamUploader:
        enabled: true
        name: "record-stream-uploader"
        softwareVersion:
          repository: "gcr.io/hedera-registry"
          name: "uploader-mirror"
          tag: "1.3.0"
          imagePullPolicy: IfNotPresent
        config:
          debug: true
          enableCompression: true
          enableSidecarFiles: true
          reaper:
            enabled: true
            minKeep: 1
            interval: 1
            defaultBackoff: 1
          signature:
            require: true
            prioritize: true
          streamFileExtension: "rcd"
          streamSigExtension: "rcd_sig"
          streamExtension: "rcd.gz"
          sigExtension: "rcd_sig"
          bucketName: "solo-streams"
          s3:
            enabled: true
            accessKey: solo-operator
            url: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
          gcs:
            enabled: false
          envFromSecret: "uploader-secrets"
      eventsStreamUploader:
        enabled: true
        name: "events-stream-uploader"
        softwareVersion:
          repository: "gcr.io/hedera-registry"
          name: "uploader-mirror"
          tag: "1.3.0"
          imagePullPolicy: IfNotPresent
        config:
          debug: true
          reaper:
            enabled: true
            minKeep: 1
            interval: 1
            defaultBackoff: 1
          signature:
            require: true
            prioritize: true
          streamFileExtension: "evts"
          streamSigExtension: "evts_sig"
          streamExtension: "evts"
          sigExtension: "evts_sig"
          bucketName: "solo-streams"
          s3:
            enabled: true
            accessKey: solo-operator
            url: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
          gcs:
            enabled: false
          envFromSecret: "uploader-secrets"
      backupUploader:
        enabled: true
        name: "backup-uploader"
        softwareVersion:
          repository: "gcr.io/hedera-registry"
          name: "hedera-backups"
          tag: "0.6.0"
          imagePullPolicy: IfNotPresent
        config:
          bucketName: "solo-backups"
          s3:
            enabled: true
            accessKey: solo-operator
            url: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
          gcs:
            enabled: false
          envFromSecret: "uploader-secrets"
      openTelemetryCollector:
        enabled: true
        name: "open-telemetry-collector"
        softwareVersion:
          repository: "docker.io/otel"
          name: "opentelemetry-collector-contrib"
          tag: "0.72.0"
        config:
          exporters:
            loki:
              enabled: true
              auth:
                enabled: false
              endpoint: "http://loki.telemetry.svc.cluster.local:3100/loki/api/v1/push"
  persistentVolumeClaims:
    logs:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi # 1/10th of production size
    stats:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi # 1/10th of production size
    states:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi # 1/10th of production size
    upgrade:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 200Mi
    streams:
      record:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi # 1/10th of production size
      events:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi # 1/10th of production size
