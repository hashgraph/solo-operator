apiVersion: operator.solo.hiero.org/v1alpha1
kind: ConsensusCapsule
metadata:
  name: node0
  namespace: "solo-orbit"
  labels:
    app.kubernetes.io/component: consensus-node
    app.kubernetes.io/managed-by: solo-operator
spec:
  orbit: solo-orbit
  nodeId: 0
  accountId: "0.0.3"
  weight: 500
  serviceType: ClusterIP
  podProperties:
    containers:
      consensusNode:
        name: "consensus-node"
        softwareVersion:
          repository: "gcr.io/hedera-registry"
          imageName: "consensus-node"
          imageTag: "0.72.1"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "250m"
            memory: 1Gi
        javaOpts: "-XX:+UseG1GC -XX:MaxDirectMemorySize=1500m --add-opens java.base/jdk.internal.misc=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true"

      # Block streams uploader (cheetah with blob/MinIO storage)
      blocksUploader:
        enabled: true
        name: "blockstream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Record streams uploader (includes sidecar files)
      recordsUploader:
        enabled: true
        name: "record-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Events streams uploader
      eventsUploader:
        enabled: true
        name: "event-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Backup uploader (rclone-based)
      backupUploader:
        enabled: true
        name: "backup-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "backup-uploader"
          imageTag: "0.38.0"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        config:
          bucketName: "solo-backups"
          s3:
            enabled: true
            url: "http://minio.minio-tenant.svc.cluster.local"
          gcs:
            enabled: false
          envFromSecret: "backup-uploader-secrets"

      # Alloy enabled — scrapes Prometheus metrics at :9999.
      # Loki log shipping is disabled by default; enable via exporters.loki in common/orbit.yaml.
      alloy:
        enabled: true
        # image inherited from orbit defaults; uncomment to override per-capsule:
        # softwareVersion:
        #   repository: "grafana"
        #   imageName: "alloy"
        #   imageTag: "v1.14.2"
        #   imagePullPolicy: IfNotPresent
        config:
          labels:
            zone: "us-east-1a"

  persistentVolumeClaims:
    logs:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    stats:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    state:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
    upgrade:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    streams:
      block:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      record:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      events:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  secrets:
    secretResources:
      grpcTlsPrivateKey:
        keyName: "hedera-node0.key"
        secretName: "node0-grpc-tls-keys"
      grpcTlsPublicCertificate:
        keyName: "hedera-node0.crt"
        secretName: "node0-grpc-tls-keys"
      signingPrivateKey:
        keyName: "s-private-node0.pem"
        secretName: "node0-gossip-keys"
      signingPublicCertificate:
        keyName: "s-public-node0.pem"
        secretName: "node0-gossip-keys"

  # Reference a shared Log4j2Config CR (defined in common/log4j2config.yaml).
  # All nodes share the same logging configuration; update the Log4j2Config to
  # change logging for every node at once. Takes effect on next pod restart.
  log4j2ConfigRef: network-log4j2

  # Reference a shared NodeSettings CR (defined in common/nodesettings.yaml).
  # All nodes share the same settings.txt; update the NodeSettings to change
  # platform settings for every node at once. Takes effect on next pod restart.
  settingsConfigRef: network-settings

  # Reference a shared ApplicationProperties CR (defined in common/applicationproperties.yaml).
  # Overrides the Orbit-derived application.properties for all nodes; omit to fall back
  # to spec.consensus.applicationConfiguration on the Orbit merged with Solo defaults.
  applicationPropertiesRef: network-appprops

  # Optional config CRs — omit any field to skip mounting that file entirely.

  # api-permission.properties (defined in common/apipermissionproperties.yaml)
  apiPermissionPropertiesRef: network-apipermprops

  # node.properties (defined in common/nodeproperties.yaml)
  nodePropertiesRef: network-nodeprops

  # throttles.json (defined in common/throttlesconfig.yaml)
  throttlesConfigRef: network-throttles

  # feeSchedules.json (defined in common/feeschedules.yaml)
  feeSchedulesRef: network-feesched

  # simpleFeesSchedules.json (defined in common/simplefeesschedules.yaml)
  simpleFeesSchedulesRef: network-simplefeesched

  # application-override.properties (defined in common/applicationoverrideproperties.yaml)
  applicationOverridePropertiesRef: network-appoverprops

  # bootstrap.properties (defined in common/bootstrapproperties.yaml)
  bootstrapPropertiesRef: network-bootprops
