apiVersion: operator.solo.hiero.org/v1alpha1
kind: ConsensusCapsule
metadata:
  name: node2
  namespace: "solo-orbit"
  labels:
    app.kubernetes.io/component: consensus-node
    app.kubernetes.io/managed-by: solo-operator
spec:
  orbit: solo-orbit
  nodeId: 2
  accountId: "0.0.5"
  weight: 500
  serviceType: LoadBalancer
  startPolicy: Auto  # Auto (default): CN process starts on pod boot; Manual: started out-of-band
  podProperties:
    containers:
      consensusNode:
        name: "consensus-node"
        softwareVersion:
          repository: "gcr.io/hedera-registry"
          imageName: "consensus-node"
          imageTag: "0.76.4"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "2"
            memory: 5Gi
          requests:
            cpu: "250m"
            memory: 1Gi
        # Set the Java heap explicitly. With no -Xmx the JVM defaults MaxHeapSize to
        # 25% of the memory limit, which starves a 0.74 consensus node and triggers
        # OutOfMemoryError / GC death-spiral stalls (see #1223). Heap + direct memory
        # (MaxDirectMemorySize=1500m) + JVM overhead must fit under limits.memory.
        javaHeapMin: "1g"
        javaHeapMax: "3g"
        javaOpts: "-XX:+UseG1GC -XX:MaxDirectMemorySize=1500m --add-opens java.base/jdk.internal.misc=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true"

      # Block streams uploader (cheetah with blob/MinIO storage)
      blocksUploader:
        enabled: false
        name: "blockstream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Record streams uploader (includes sidecar files)
      recordsUploader:
        enabled: false
        name: "record-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Events streams uploader
      eventsUploader:
        enabled: false
        name: "event-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Backup uploader (rclone-based)
      backupUploader:
        enabled: false
        name: "backup-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "backup-uploader"
          imageTag: "0.38.0"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        config:
          bucketName: "solo-backups"
          s3:
            enabled: true
            url: "http://minio.minio-tenant.svc.cluster.local"
          gcs:
            enabled: false
          envFromSecret: "backup-uploader-secrets"

      # UC sidecar — patches platform-status condition on its own pod; required.
      uc:
        enabled: true
        platformPollInterval: "1s"
        # The UC sidecar is the operator's own image; the operator provides no built-in
        # default, so it must be declared explicitly. The local dev flow builds and loads
        # it into kind (task kind:load:uc, tag :dev); for production pin to the operator
        # version and a digest.
        softwareVersion:
          repository: "ghcr.io/hashgraph/solo-operator"
          imageName: "uc"
          imageTag: "dev"
          imagePullPolicy: IfNotPresent

      # Alloy enabled — scrapes Prometheus metrics at :9999.
      # Loki log shipping is disabled by default; enable via exporters.loki in common/orbit.yaml.
      alloy:
        enabled: true
        config:
          labels:
            zone: "us-west-2a"

  persistentVolumeClaims:
    logs:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    stats:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    state:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
    saved:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    upgrade:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    streams:
      block:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      record:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      events:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  secrets:
    secretResources:
      grpcTlsPrivateKey:
        keyName: "hedera-node2.key"
        secretName: "node2-grpc-tls-keys"
      grpcTlsPublicCertificate:
        keyName: "hedera-node2.crt"
        secretName: "node2-grpc-tls-keys"
      signingPrivateKey:
        keyName: "private.pem"
        secretName: "node2-gossip-keys"
      signingPublicCertificate:
        keyName: "public.pem"
        secretName: "node2-gossip-keys"

  # Reference this node's Log4j2Config CR (defined in common/log4j2config.yaml). Takes effect on next pod restart.
  log4j2ConfigRef: node2-log4j2

  # Reference this node's NodeSettings CR (defined in common/nodesettings.yaml). Takes effect on next pod restart.
  settingsConfigRef: node2-settings

  # Reference this node's ApplicationProperties CR (defined in common/applicationproperties.yaml).
  applicationPropertiesRef: node2-application-properties

  # Optional config CRs — omit any field to skip mounting that file entirely.

  # api-permission.properties (defined in common/apipermissionproperties.yaml)
  apiPermissionPropertiesRef: node2-api-permission-properties

  # node.properties (defined in common/nodeproperties.yaml)
  nodePropertiesRef: node2-node-properties

  # throttles.json (defined in common/throttlesconfig.yaml)
  throttlesConfigRef: node2-throttles

  # feeSchedules.json (defined in common/feeschedules.yaml)
  feeSchedulesRef: node2-fee-schedules

  # simpleFeesSchedules.json (defined in common/simplefeesschedules.yaml)
  simpleFeesSchedulesRef: node2-simple-fee-schedules

  # application-override.properties (defined in common/applicationoverrideproperties.yaml)
  applicationOverridePropertiesRef: node2-application-override-properties

  # bootstrap.properties (defined in common/bootstrapproperties.yaml)
  bootstrapPropertiesRef: node2-bootstrap-properties

  # block-nodes.json (defined in common/blocknodesconfig.yaml); the UC overwrites
  # this CR with the package's per-node file during an upgrade.
  blockNodesConfigRef: node2-block-nodes
