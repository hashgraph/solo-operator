loki:
  auth_enabled: false
  image:
    tag: 2.9.1 # use newer version of loki
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    max_entries_limit_per_query: 10 # limit the number of entries per query
    reject_old_samples_max_age: 30m # no need to retain old samples
    retention_period: 30m # no need to retain logs for long time
  ruler:
    enable_api: true
  server:
    grpc_server_max_recv_msg_size: 1048576 # 10 MiB
    grpc_server_max_send_msg_size: 1048576 # 10 MiB
  storage_config:
    boltdb_shipper:
      enabled: false
    filesystem:
      directory: /data/loki/chunks
  compactor:
    retention_enabled: true

grafana:
  enabled: true
 
promtail:
  enabled: false

prometheus:
  enabled: true
