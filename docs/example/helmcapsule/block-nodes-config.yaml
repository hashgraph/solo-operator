# SPDX-License-Identifier: Apache-2.0
#
# node0-only variant of common/blocknodesconfig.yaml (applied by `task deploy BLOCKNODE=true`).
# Ports must match the block node's in block-node.yaml.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: BlockNodesConfig
metadata:
  name: node0-block-nodes
  namespace: solo-orbit
spec:
  orbit: solo-orbit
  scope: node0
  content: |
    {
      "nodes": [
        {
          "address": "block-node-block-node-server.solo-orbit.svc.cluster.local",
          "streamingPort": 40840,
          "servicePort": 40840,
          "priority": 0
        }
      ]
    }
