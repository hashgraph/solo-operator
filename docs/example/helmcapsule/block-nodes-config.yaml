# SPDX-License-Identifier: Apache-2.0
#
# Points node0 at the block node in block-node.yaml; ports must match the block node's.
# The ConsensusCapsule needs blockNodesConfigRef: node0-block-nodes and these ApplicationProperties:
#   blockStream.streamMode=BOTH
#   blockStream.writerMode=FILE_AND_GRPC
#   blockStream.streamWrappedRecordBlocks=false
#   tss.hintsEnabled=false, tss.historyEnabled=false, tss.wrapsEnabled=false
apiVersion: operator.solo.hiero.org/v1alpha1
kind: BlockNodesConfig
metadata:
  name: node0-block-nodes
  namespace: solo-orbit
spec:
  orbit: solo-orbit
  scope: node0
  content: |
    {
      "nodes": [
        {
          "address": "block-node-block-node-server.solo-orbit.svc.cluster.local",
          "streamingPort": 40840,
          "servicePort": 40840,
          "priority": 0
        }
      ]
    }
