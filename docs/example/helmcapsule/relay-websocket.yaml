# HelmCapsule — Hedera JSON-RPC Relay WebSocket
#
# Component: relay-websocket
# Chart:     hedera-json-rpc-relay-websocket (https://github.com/hiero-ledger/hiero-json-rpc-relay)
#
# Auto-injected values (same as relay, from OrbitRef + ConsensusCapsules):
#   config.HEDERA_NETWORK   — JSON map {"host:port": "accountId"} from ConsensusCapsules
#   config.MIRROR_NODE_URL  — "http://mirror.<namespace>.svc.cluster.local"
#   config.CHAIN_ID         — from Orbit spec.consensus.networkSettings["ledger.id"]
#
apiVersion: operator.solo.hedera.com/v1alpha1
kind: HelmCapsule
metadata:
  name: relay-websocket
  namespace: solo-orbit
spec:
  chart:
    repo: https://hiero-ledger.github.io/hiero-json-rpc-relay/charts
    chart: hedera-json-rpc-relay-websocket
    version: "0.76.1"

  component: relay-websocket

  orbitRef:
    name: solo-orbit

  values:
    replicaCount: 1
