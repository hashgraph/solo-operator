#
# Block node via the block-node-server chart. The Service is
# block-node-block-node-server.<namespace>.svc.cluster.local:40840 (also in status.outputs once
# Ready); use it in the BlockNodesConfig (block-nodes-config.yaml).
# Plugins are baked into the solo-dev image, so plugins.names is empty.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: HelmCapsule
metadata:
  name: block-node
  namespace: solo-orbit
spec:
  chart:
    repo: oci://ghcr.io/hiero-ledger/hiero-block-node
    chart: block-node-server
    version: "0.44.2"

  component: block-node

  orbitRef:
    name: solo-orbit

  wait: true
  timeout: 15m

  values:
    image:
      # includes prebuilt plugins - adhoc downloading is not supported by operator
      repository: ghcr.io/hiero-ledger/hiero-block-node-solo-dev
    plugins:
      names: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1536Mi
    blockNode:
      config:
        JAVA_OPTS: '-Xms1G -Xmx1G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath="/tmp/dump.hprof"'
        MESSAGING_BLOCK_ITEM_QUEUE_SIZE: "128"
        MESSAGING_BLOCK_NOTIFICATION_QUEUE_SIZE: "16"
        # ROSTER_BOOTSTRAP_RSA_MIRROR_NODE_BASE_URL: "http://<mirror-release>-restjava"
      persistence:
        live:
          size: 5Gi
        archive:
          size: 5Gi
        logging:
          size: 2Gi
        applicationState:
          size: 1Gi
      # backfill:
      #   sources:
      #     - address: "<peer-release>-block-node-server.solo-orbit.svc.cluster.local"
      #       port: 40840
      #       priority: 1
