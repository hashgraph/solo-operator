# SPDX-License-Identifier: Apache-2.0
#
# Shared FeeSchedules — creates a ConfigMap named network-fee-schedules
# that is subPath-mounted at data/config/feeSchedules.json in every ConsensusCapsule pod.
#
# Each ConsensusCapsule must reference this CR via:
#   spec:
#     feeSchedulesRef: network-fee-schedules
#
# This field is optional. When omitted the file is not mounted. Updating spec.content
# propagates the new file to all referencing nodes on the next pod restart.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: FeeSchedules
metadata:
  name: network-fee-schedules
  namespace: solo-orbit
spec:
  # orbit links this resource to the Orbit for cascade deletion.
  orbit: solo-orbit
  # content is a valid JSON document defining fee schedules.
  content: |
    {
      "currentFeeSchedule": [],
      "nextFeeSchedule": []
    }
