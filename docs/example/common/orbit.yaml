apiVersion: operator.solo.hiero.org/v1alpha1
kind: Orbit
metadata:
  name: solo-orbit
spec:
  # A host-level provisioner daemon runs the upgrade execute phase (consensus UC in
  # mainnet mode). Default false = cluster-only.
  provisionerDaemonEnabled: false
  telemetry:
    alloy:
      enabled: true
      softwareVersion:
        repository: "grafana"
        imageName: "alloy"
        imageTag: "v1.14.2"
        imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      config:
        appName: "hedera-node"
        environment: "integration"
        logLevel: "INFO"
        labels:
          cluster: "local-kind"
          team: "platform"
        exporters:
          loki:
            enabled: true
            endpoint: "http://loki.observability:3100/loki/api/v1/push"
          # Prometheus remote-write is disabled by default.
          # The consensus node always exposes metrics at :9999 for direct scraping.
          # Uncomment to have Alloy scrape :9999 and push to a remote endpoint:
          # prometheusRemote:
          #   enabled: true
          #   endpoint: "http://prometheus.observability:9090/api/v1/write"
          #   scrapeInterval: "15s"
  upgrade:
    consensusNode:
      # skipScaleDown: when true (default) images are patched in-place and the
      # StatefulSet RollingUpdate restarts the pod; set false to use the
      # scale-down-to-0 / scale-up sequence. Ignored (forced scale-down) when a
      # host-level provisioner daemon requires the pod to be fully absent.
      skipScaleDown: true
      prereqRequeueInterval: 2s
      daemonRequeueInterval: 2s
      nodeReadyRequeueInterval: 2s
      # prefetch: best-effort image prefetch during the prepare phase.
      # prefetch:
      #   # enabled: turn image prefetch on/off. Default: true.
      #   enabled: true
      #   # jobTTL: how long completed prefetch Jobs linger before Kubernetes
      #   # auto-deletes them. Applies to both succeeded and failed Jobs; a short
      #   # TTL deletes failed Jobs and loses debug info. Default: 2160h (90d).
      #   jobTTL: 2160h
      #   # maxNodes: max nodes matching capsule nodeSelectors for node-pinned
      #   # coverage. Above this the operator pins one Job per node running a
      #   # consensus pod instead. Default: 30. Set 0 to always use pod-node targeting.
      #   maxNodes: 30
  consensus:
    # consensus.featureGates holds transitional, rollout-only gates. Leave unset to
    # defer to the operator default; see docs/design/feature-gates.md.
    genesis:
      addressBook:
        # ledgerId is the consensus node's ledger.id (network identity);
        # mainnet, testnet, previewnet use 0x00, 0x01 and 0x02 respectively
        # 0x01 is the well-known local/dev ledger id.
        ledgerId: "0x01"
        
        # EVM chain id (EIP-155)
        # mainnet, testnet and local
        # 298 is the well-known local/dev chain id.
        chainId: "298"
        externalAddresses: []
