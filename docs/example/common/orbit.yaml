apiVersion: operator.solo.hedera.com/v1alpha1
kind: Orbit
metadata:
  name: solo-orbit
spec:
  telemetry:
    alloy:
      enabled: true
      image: "grafana/alloy:v1.14.2"
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      config:
        appName: "hedera-node"
        environment: "integration"
        logLevel: "INFO"
        labels:
          cluster: "local-kind"
          team: "platform"
        exporters:
          loki:
            enabled: true
            endpoint: "http://loki.observability:3100/loki/api/v1/push"
          # Prometheus remote-write is disabled by default.
          # The consensus node always exposes metrics at :9999 for direct scraping.
          # Uncomment to have Alloy scrape :9999 and push to a remote endpoint:
          # prometheusRemote:
          #   enabled: true
          #   endpoint: "http://prometheus.observability:9090/api/v1/write"
          #   scrapeInterval: "15s"
  consensus:
    applicationConfiguration:
      ledger.id: "0x00"
    genesis:
      addressBook:
        ledgerId: "298"
        externalAddresses: []
    networkSettings:
      state.mainClassNameOverride: "com.hedera.services.ServicesMain"
    permissionConfiguration:
      appendContent: "0-*"
      approveAllowances: "0-*"
      contractCallLocalMethod: "0-*"
      contractCallMethod: "0-*"
      contractGetBytecode: "0-*"
      createAccount: "0-*"
      createContract: "0-*"
      createFile: "0-*"
      createTopic: "0-*"
      cryptoDelete: "0-*"
      cryptoGetBalance: "0-*"
      cryptoTransfer: "0-*"
      deleteAllowances: "0-*"
      deleteContract: "0-*"
      deleteFile: "0-*"
      deleteTopic: "0-*"
      ethereumTransaction: "0-*"
      freeze: "2-58"
      getAccountDetails: "2-50"
      getAccountInfo: "0-*"
      getAccountRecords: "0-*"
      getContractInfo: "0-*"
      getFileContent: "0-*"
      getFileInfo: "0-*"
      getTopicInfo: "0-*"
      getTransactionReceipts: "0-*"
      getTxRecordByContractID: "0-*"
      getTxRecordByTxID: "0-*"
      getVersionInfo: "0-*"
      networkGetExecutionTime: "2-50"
      scheduleCreate: "0-*"
      scheduleDelete: "0-*"
      scheduleGetInfo: "0-*"
      scheduleSign: "0-*"
      submitMessage: "0-*"
      systemDelete: "2-59"
      systemUndelete: "2-60"
      tokenAccountWipe: "0-*"
      tokenAssociateToAccount: "0-*"
      tokenBurn: "0-*"
      tokenCreate: "0-*"
      tokenDelete: "0-*"
      tokenDissociateFromAccount: "0-*"
      tokenFeeScheduleUpdate: "0-*"
      tokenFreezeAccount: "0-*"
      tokenGetAccountNftInfos: "0-*"
      tokenGetInfo: "0-*"
      tokenGetNftInfo: "0-*"
      tokenGetNftInfos: "0-*"
      tokenGrantKycToAccount: "0-*"
      tokenMint: "0-*"
      tokenPause: "0-*"
      tokenRevokeKycFromAccount: "0-*"
      tokenUnfreezeAccount: "0-*"
      tokenUnpause: "0-*"
      tokenUpdate: "0-*"
      updateAccount: "0-*"
      updateContract: "0-*"
      updateFile: "0-*"
      updateTopic: "0-*"
      utilPrng: "0-*"
