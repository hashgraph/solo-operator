# SPDX-License-Identifier: Apache-2.0
#
# Shared ApiPermissionProperties — creates a ConfigMap named network-api-permission-properties
# that is subPath-mounted at data/config/api-permission.properties in every ConsensusCapsule pod.
#
# Each ConsensusCapsule must reference this CR via:
#   spec:
#     apiPermissionPropertiesRef: network-api-permission-properties
#
# This field is optional. When omitted the file is not mounted (the node falls back
# to whatever is baked into the container image). Updating spec.content propagates
# the new file to all referencing nodes on the next pod restart.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: ApiPermissionProperties
metadata:
  name: network-api-permission-properties
  namespace: solo-orbit
spec:
  # orbit links this resource to the Orbit for cascade deletion.
  orbit: solo-orbit
  # content is the raw api-permission.properties in Java key=value format.
  content: |
    # Crypto
    createAccount=0-*
    cryptoTransfer=0-*
    updateAccount=0-*
    cryptoGetBalance=0-*
    getAccountInfo=0-*
    cryptoDelete=0-*
    getAccountRecords=0-*
    getTxRecordByTxID=0-*
    getTransactionReceipts=0-*
    approveAllowances=0-*
    deleteAllowances=0-*
    # File
    createFile=0-*
    updateFile=0-*
    deleteFile=0-*
    utilPrng=0-*
    appendContent=0-*
    getFileContent=0-*
    getFileInfo=0-*
    # Contract
    createContract=0-*
    updateContract=0-*
    contractCallMethod=0-*
    getContractInfo=0-*
    contractCallLocalMethod=0-*
    contractGetBytecode=0-*
    getTxRecordByContractID=0-*
    deleteContract=0-*
    # Consensus
    createTopic=0-*
    updateTopic=0-*
    deleteTopic=0-*
    submitMessage=0-*
    getTopicInfo=0-*
    # Ethereum
    ethereumTransaction=0-*
    # Scheduling
    scheduleCreate=0-*
    scheduleSign=0-*
    scheduleDelete=0-*
    scheduleGetInfo=0-*
    # Token
    tokenCreate=0-*
    tokenFreezeAccount=0-*
    tokenUnfreezeAccount=0-*
    tokenGrantKycToAccount=0-*
    tokenRevokeKycFromAccount=0-*
    tokenDelete=0-*
    tokenMint=0-*
    tokenBurn=0-*
    tokenAccountWipe=0-*
    tokenUpdate=0-*
    tokenGetInfo=0-*
    tokenGetAccountNftInfos=0-*
    tokenAssociateToAccount=0-*
    tokenDissociateFromAccount=0-*
    tokenGetNftInfo=0-*
    tokenFeeScheduleUpdate=0-*
    tokenPause=0-*
    tokenUnpause=0-*
    tokenGetNftInfos=0-*
    # Network
    getVersionInfo=0-*
    systemDelete=2-59
    systemUndelete=2-60
    freeze=2-58
    networkGetExecutionTime=2-50
    getAccountDetails=2-50
    # Batch
    atomicBatch=0-*
