# SPDX-License-Identifier: Apache-2.0
#
# Shared NodePropertiesConfig — creates a ConfigMap named network-nodeprops-node-properties-cm
# that is subPath-mounted at data/config/node.properties in every ConsensusCapsule pod.
#
# Each ConsensusCapsule must reference this CR via:
#   spec:
#     nodePropertiesRef: network-nodeprops
#
# This field is optional. When omitted the file is not mounted. Updating spec.content
# propagates the new file to all referencing nodes on the next pod restart.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: NodePropertiesConfig
metadata:
  name: network-nodeprops
  namespace: solo-orbit
spec:
  # orbit links this resource to the Orbit for cascade deletion.
  orbit: solo-orbit
  # content is the raw node.properties in Java key=value format.
  content: |
    grpc.port=50211
    grpc.tlsPort=50212
    hapiPort=50211
    hapiTlsPort=50212
