# SPDX-License-Identifier: Apache-2.0
#
# Shared ApplicationOverrideProperties — creates a ConfigMap named
# NODEID-application-override-properties that is subPath-mounted
# at data/config/application-override.properties in every ConsensusCapsule pod.
#
# Each ConsensusCapsule must reference this CR via:
#   spec:
#     applicationOverridePropertiesRef: NODEID-application-override-properties
#
# This field is optional. When omitted the file is not mounted. Updating spec.content
# propagates the new file to all referencing nodes on the next pod restart.
apiVersion: operator.solo.hiero.org/v1alpha1
kind: ApplicationOverrideProperties
metadata:
  name: NODEID-application-override-properties
  namespace: solo-orbit
spec:
  # orbit links this resource to the Orbit for cascade deletion.
  orbit: solo-orbit
  scope: NODEID  # content is the raw application-override.properties in Java key=value format.
  # Keys here take precedence over application.properties at runtime.
  content: |
    hedera.profiles.active=TEST
    staking.periodMins=1
