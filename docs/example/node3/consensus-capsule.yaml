apiVersion: operator.solo.hedera.com/v1alpha1
kind: ConsensusCapsule
metadata:
  name: node3
  namespace: "solo-orbit"
  labels:
    app.kubernetes.io/component: consensus-node
    app.kubernetes.io/managed-by: solo-operator
spec:
  orbit: solo-orbit
  nodeId: 3
  accountId: "0.0.6"
  weight: 1
  podProperties:
    containers:
      consensusNode:
        name: "consensus-node"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-development/hiero-consensus-node"
          imageName: "consensus-node"
          imageTag: "v0.65.1"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "6"
            memory: 48Gi
          requests:
            cpu: "2"
            memory: 16Gi
      
      # Block streams uploader (cheetah 0.6.0 with blob storage)
      blocksUploader:
        enabled: true
        name: "blockstream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        # bucketPrefix: "mynetwork/testnet"  # optional — prepended to stream object paths
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Record streams uploader (includes sidecar files)
      recordsUploader:
        enabled: true
        name: "record-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO

      # Events streams uploader
      eventsUploader:
        enabled: true
        name: "event-stream-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "cheetah"
          imageTag: "0.6.0"
          imagePullPolicy: IfNotPresent
        logLevel: Debug
        maxProcessors: 10
        stopOnError: false
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        blob:
          enabled: true
          url: "s3://solo-streams?region=us-east-1&endpoint=http://minio.minio-tenant.svc.cluster.local&use_path_style=true&disable_https=true"
        envFromSecret: "uploader-mirror-secrets"  # provides AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for MinIO
      
      # Backup uploader (rclone-based, not cheetah)
      backupUploader:
        enabled: true
        name: "backup-uploader"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "backup-uploader"
          imageTag: "0.38.0"
          imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
        config:
          bucketName: "solo-backups"
          s3:
            enabled: true
            url: "http://minio.minio-tenant.svc.cluster.local"
          gcs:
            enabled: false
          envFromSecret: "backup-uploader-secrets"
      
      # OpenTelemetry collector
      openTelemetryCollector:
        enabled: true
        name: "otel-collector"
        softwareVersion:
          repository: "us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images"
          imageName: "opentelemetry-collector-contrib"
          imageTag: "0.72.0"
          imagePullPolicy: IfNotPresent
        config:
          exporters:
            loki:
              enabled: true
  
  persistentVolumeClaims:
    logs:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
    stats:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
    states:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 500Gi
    upgrade:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
    streams:
      block:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
      record:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
      events:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
  
  secrets:
    secretResources:
      grpcTlsPrivateKey:
        keyName: "hedera-node3.key"
        secretName: "node3-grpc-tls-keys"
      grpcTlsPublicCertificate:
        keyName: "hedera-node3.crt"
        secretName: "node3-grpc-tls-keys"
      signingPrivateKey:
        keyName: "s-private-node3.pem"
        secretName: "node3-gossip-keys"
      signingPublicCertificate:
        keyName: "s-public-node3.pem"
        secretName: "node3-gossip-keys"
  
  log4j2.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <Configuration status="WARN" monitorInterval="600">
      <Appenders>
        <Console name="Console" target="SYSTEM_OUT">
          <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %-4L %c{1} - %m{nolookups}%n"/>
        </Console>
      </Appenders>
      <Loggers>
        <Root level="INFO">
          <AppenderRef ref="Console"/>
        </Root>
      </Loggers>
    </Configuration>
