version: '3'

tasks:
  setup:
    desc: Install MetalLB (kind LB support), MinIO operator and tenant
    cmds:
      - task: setup:metallb
      - task: setup:minio

  setup:metallb:
    desc: Install MetalLB operator via Helm and configure an IP pool for LoadBalancer support on kind
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb
      - helm repo update
      - helm upgrade --install --namespace metallb-system --create-namespace metallb metallb/metallb --wait --timeout 300s
      - |
        # Use .200-.250 of the kind Docker subnet for LoadBalancer IPs
        SUBNET=$(docker network inspect kind | grep '"Subnet"' | awk -F'"' '{print $4}' | grep -v ':' | head -1)
        PREFIX=$(echo "$SUBNET" | cut -d'/' -f1 | cut -d'.' -f1-3)
        kubectl apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: kind-pool
          namespace: metallb-system
        spec:
          addresses:
          - ${PREFIX}.200-${PREFIX}.250
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: kind-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - kind-pool
        EOF

  setup:minio:
    desc: Install MinIO operator and tenant
    cmds:
      - helm repo add minio-operator https://operator.min.io/
      - helm repo update
      - helm upgrade --install --namespace minio-operator --create-namespace minio-operator minio-operator/operator
      - helm upgrade --install --namespace minio-tenant --create-namespace --values setup/minio-values.yaml minio-tenant minio-operator/tenant
      - echo ">> Waiting for MinIO to be ready..."
      - |
        until kubectl get pod -l v1.min.io/tenant=minio-tenant -n minio-tenant --no-headers 2>/dev/null | grep -q .; do
          echo ">> Waiting for MinIO pods..."
          sleep 5
        done
      - kubectl wait --for=condition=ready pod -l v1.min.io/tenant=minio-tenant -n minio-tenant --timeout=60s

  deploy:orbit:
    desc: Create the solo-orbit namespace and deploy Orbit
    cmds:
      - kubectl create namespace solo-orbit --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f common/orbit.yaml

  deploy:common:
    desc: Deploy all common config CRs, ConfigMaps, and secrets
    deps: [deploy:orbit]
    cmds:
      - kubectl apply -f common/

  deploy:nodes:
    desc: Deploy all node secrets and consensus capsules
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node0/secrets.yaml
      - kubectl apply -f node0/consensus-capsule.yaml
      - kubectl apply -f node1/secrets.yaml
      - kubectl apply -f node1/consensus-capsule.yaml
      - kubectl apply -f node2/secrets.yaml
      - kubectl apply -f node2/consensus-capsule.yaml
      - kubectl apply -f node3/secrets.yaml
      - kubectl apply -f node3/consensus-capsule.yaml

  deploy:genesis:
    desc: Run network genesis (all nodes must be deployed first)
    deps: [deploy:nodes]
    cmds:
      - kubectl apply -f network-genesis/network-genesis.yaml
      - echo ">> Waiting for genesis to complete..."
      - kubectl wait --for=jsonpath='{.status.phase}'=Succeeded networkgenesis/network-genesis -n solo-orbit --timeout=300s
      - echo ">> Genesis completed successfully"

  deploy:
    desc: Deploy full 4-node network (orbit + nodes + genesis), wait for pods ready
    cmds:
      - task: deploy:genesis
      - echo ">> Waiting for all consensus node pods to be ready..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n solo-orbit --timeout=300s
      - echo ">> All 4 nodes deployed, genesis completed, and pods ready"

  status:
    desc: Show status of all consensus capsules, pods, and services
    cmds:
      - echo ">> Consensus Capsules:"
      - kubectl get consensuscapsules -n solo-orbit -o wide || true
      - echo ""
      - echo ">> Pods:"
      - kubectl get pods -n solo-orbit -o wide || true
      - echo ""
      - echo ">> Services:"
      - kubectl get svc -n solo-orbit || true

  logs:
    desc: Tail logs from all consensus nodes
    cmds:
      - kubectl logs -n solo-orbit -l app.kubernetes.io/component=consensus-node -c consensus-node --tail=50 -f

  wait:
    desc: Wait for all consensus node pods to be ready
    cmds:
      - echo ">> Waiting for all consensus node pods to be ready..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=consensus-node -n solo-orbit --timeout=300s || true
      - echo ">> Node status:"
      - kubectl get pods -n solo-orbit -l app.kubernetes.io/component=consensus-node -o wide

  deploy:node0:
    desc: Deploy node0
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node0/secrets.yaml
      - kubectl apply -f node0/consensus-capsule.yaml
      - kubectl apply -f node0/haproxycapsule.yaml
      - kubectl apply -f node0/envoyproxycapsule.yaml

  deploy:node1:
    desc: Deploy node1
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node1/secrets.yaml
      - kubectl apply -f node1/consensus-capsule.yaml
      - kubectl apply -f node1/haproxycapsule.yaml
      - kubectl apply -f node1/envoyproxycapsule.yaml

  deploy:node2:
    desc: Deploy node2
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node2/secrets.yaml
      - kubectl apply -f node2/consensus-capsule.yaml
      - kubectl apply -f node2/haproxycapsule.yaml
      - kubectl apply -f node2/envoyproxycapsule.yaml

  deploy:node3:
    desc: Deploy node3
    deps: [deploy:common]
    cmds:
      - kubectl apply -f node3/secrets.yaml
      - kubectl apply -f node3/consensus-capsule.yaml
      - kubectl apply -f node3/haproxycapsule.yaml
      - kubectl apply -f node3/envoyproxycapsule.yaml

  destroy:node3:
    desc: Destroy node3
    cmds:
      - kubectl delete -f node3/envoyproxycapsule.yaml || true
      - kubectl delete -f node3/haproxycapsule.yaml || true
      - kubectl delete -f node3/consensus-capsule.yaml || true
      - kubectl delete -f node3/secrets.yaml || true

  destroy:node2:
    desc: Destroy node2
    cmds:
      - kubectl delete -f node2/envoyproxycapsule.yaml || true
      - kubectl delete -f node2/haproxycapsule.yaml || true
      - kubectl delete -f node2/consensus-capsule.yaml || true
      - kubectl delete -f node2/secrets.yaml || true

  destroy:node1:
    desc: Destroy node1
    cmds:
      - kubectl delete -f node1/envoyproxycapsule.yaml || true
      - kubectl delete -f node1/haproxycapsule.yaml || true
      - kubectl delete -f node1/consensus-capsule.yaml || true
      - kubectl delete -f node1/secrets.yaml || true

  destroy:node0:
    desc: Destroy node0
    cmds:
      - kubectl delete -f node0/envoyproxycapsule.yaml || true
      - kubectl delete -f node0/haproxycapsule.yaml || true
      - kubectl delete -f node0/consensus-capsule.yaml || true
      - kubectl delete -f node0/secrets.yaml || true

  destroy:common:
    desc: Destroy common configs and secrets
    cmds:
      - kubectl delete -f common/configs.yaml || true
      - kubectl delete -f common/secrets.yaml || true

  destroy:orbit:
    desc: Destroy Orbit and namespace
    cmds:
      - kubectl delete -f common/orbit.yaml || true
      - kubectl delete namespace solo-orbit --ignore-not-found

  destroy:
    desc: Destroy all nodes, configs, and orbit
    cmds:
      - task: destroy:node3
      - task: destroy:node2
      - task: destroy:node1
      - task: destroy:node0
      - task: destroy:common
      - task: destroy:orbit

  upgrade:prepare:
    desc: "Step 1 — apply a per-node NetworkUpgradePrepare and wait for the operator to validate images"
    cmds:
      # Per-node operationId (node<N>-upgrade-0-74-2), as the UC mints per node in
      # the real HFS flow; yq stamps identity onto the shared images template.
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          OP="${NODE}-upgrade-0-74-2"
          echo ">> Applying NetworkUpgradePrepare for ${NODE} (operationId ${OP})..."
          yq eval "
            .metadata.name = \"${OP}-prepare\" |
            .metadata.labels.\"operator.solo.hiero.org/operation-id\" = \"${OP}\" |
            .spec.operationId = \"${OP}\"
          " upgrade/network-upgrade-prepare.yaml | kubectl apply -f -
        done
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          echo ">> Waiting for ${NODE}-upgrade-0-74-2-prepare to succeed..."
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
            networkupgradeprepare/${NODE}-upgrade-0-74-2-prepare -n solo-orbit --timeout=120s
        done
      - echo ">> All per-node Prepares succeeded"

  upgrade:freeze:
    desc: "Step 2 — apply NetworkUpgradeFreeze (operator validates registries), then run hashfreeze to stop the nodes"
    cmds:
      - |
        set -eu
        SCHEDULED_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        for NODE in node0 node1 node2 node3; do
          OP="${NODE}-upgrade-0-74-2"
          SELECTED=$(kubectl get networkupgradeprepare ${OP}-prepare -n solo-orbit \
            -o jsonpath='{.status.selectedSources}')
          if [ -z "$SELECTED" ] || [ "$SELECTED" = "null" ]; then
            echo "ERROR: ${OP}-prepare status.selectedSources is empty — run upgrade:prepare first" >&2
            exit 1
          fi
          echo ">> Applying NetworkUpgradeFreeze for ${NODE} (operationId ${OP})..."
          jq -n \
            --arg op "$OP" \
            --arg scheduledTime "$SCHEDULED_TIME" \
            --argjson selectedSources "$SELECTED" \
            '{
              apiVersion: "operator.solo.hiero.org/v1alpha1",
              kind: "NetworkUpgradeFreeze",
              metadata: {
                name: ($op + "-freeze"),
                namespace: "solo-orbit",
                labels: {
                  "operator.solo.hiero.org/operation-id": $op,
                  "operator.solo.hiero.org/step": "freeze"
                }
              },
              spec: {
                orbit: "solo-orbit",
                operationId: $op,
                scheduledTime: $scheduledTime,
                images: {
                  consensusNode: {
                    version: "0.74.2",
                    deterministic: {supported: false},
                    registries: [{image: "gcr.io/hedera-registry/consensus-node:0.74.2"}]
                  }
                },
                selectedSources: $selectedSources
              }
            }' | kubectl apply -f -
        done
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          echo ">> Waiting for ${NODE}-upgrade-0-74-2-freeze to succeed..."
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
            networkupgradefreeze/${NODE}-upgrade-0-74-2-freeze -n solo-orbit --timeout=120s
        done
      - echo ">> All per-node Freeze CRs succeeded — submitting FREEZE_ONLY transaction via hashfreeze..."
      - task: upgrade:hashfreeze
      - echo ">> Nodes frozen"

  upgrade:hashfreeze:
    desc: "Submit a FREEZE_ONLY transaction to stop all consensus nodes (uses hashfreeze image)"
    vars:
      FREEZE_TIME:
        sh: date -u -v+10S '+%Y-%m-%d.%H:%M:%S' 2>/dev/null || date -u --date='10 seconds' '+%Y-%m-%d.%H:%M:%S'
    cmds:
      - |
        set -eu
        OPERATOR_KEY=$(kubectl get secret relay-operator-creds -n solo-orbit \
          -o jsonpath='{.data.values\.yaml}' | base64 -d | grep OPERATOR_KEY_MAIN | awk '{print $2}' | tr -d '"')
        echo ">> Freezing at {{.FREEZE_TIME}} UTC..."
        kubectl run hashfreeze --restart=Never --rm -i \
          --image=us-central1-docker.pkg.dev/hashsphere-public/hashsphere/images/hashfreeze:0.1.0 \
          --image-pull-policy=Always \
          --namespace=solo-orbit \
          --env="OPERATOR_KEY=${OPERATOR_KEY}" \
          -- freeze \
          --node node0.solo-orbit.svc.cluster.local:50211 \
          --node-account 0.0.3 \
          --operator 0.0.2 \
          --start-time "{{.FREEZE_TIME}}"
      - echo ">> Waiting for all consensus nodes to reach FREEZE_COMPLETE..."
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          echo ">> Waiting for ${NODE} platformStatus=FREEZE_COMPLETE..."
          kubectl wait --for=jsonpath='{.status.platformStatus}'=FREEZE_COMPLETE \
            consensuscapsule/${NODE} -n solo-orbit --timeout=120s
        done
      - echo ">> All nodes frozen"

  upgrade:execute:
    desc: "Step 3 — apply NetworkUpgradeExecute for all 4 nodes and wait for each to reach ACTIVE"
    cmds:
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          OP="${NODE}-upgrade-0-74-2"
          SELECTED=$(kubectl get networkupgradeprepare ${OP}-prepare -n solo-orbit \
            -o jsonpath='{.status.selectedSources}')
          if [ -z "$SELECTED" ] || [ "$SELECTED" = "null" ]; then
            echo "ERROR: ${OP}-prepare status.selectedSources is empty — run upgrade:prepare first" >&2
            exit 1
          fi
          echo ">> Applying NetworkUpgradeExecute for ${NODE} (operationId ${OP})..."
          jq -n \
            --arg op "$OP" \
            --arg node "$NODE" \
            --argjson selectedSources "$SELECTED" \
            '{
              apiVersion: "operator.solo.hiero.org/v1alpha1",
              kind: "NetworkUpgradeExecute",
              metadata: {
                name: ($op + "-execute"),
                namespace: "solo-orbit",
                labels: {
                  "operator.solo.hiero.org/operation-id": $op,
                  "operator.solo.hiero.org/step": "execute"
                }
              },
              spec: {
                orbit: "solo-orbit",
                operationId: $op,
                consensusNode: $node,
                images: {
                  consensusNode: {
                    version: "0.74.2",
                    deterministic: {supported: false},
                    registries: [{image: "gcr.io/hedera-registry/consensus-node:0.74.2"}]
                  }
                },
                selectedSources: $selectedSources
              }
            }' | kubectl apply -f -
        done
      - |
        set -eu
        # No real UC package on disk, so the in-pod UC never advances the CR. Patch
        # status to PendingNodeUpgrade to bypass it (status is a subresource). Loop
        # because the operator races us by writing ReadyForProvisionerDaemon once on
        # admission; a patch landing after that wins (it never reverts PendingNodeUpgrade).
        for NODE in node0 node1 node2 node3; do
          NAME="${NODE}-upgrade-0-74-2-execute"
          echo ">> Advancing ${NAME} to PendingNodeUpgrade (bypassing UC)..."
          for i in $(seq 1 30); do
            PHASE=$(kubectl get networkupgradeexecute/${NAME} \
              -n solo-orbit -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$PHASE" in
              PendingNodeUpgrade|Succeeded|Failed)
                echo ">> ${NODE} reached ${PHASE}"; break ;;
            esac
            kubectl patch networkupgradeexecute/${NAME} \
              -n solo-orbit --subresource=status --type=merge \
              -p '{"status":{"phase":"PendingNodeUpgrade"}}' >/dev/null 2>&1 || true
            sleep 1
          done
        done
      - |
        set -eu
        for NODE in node0 node1 node2 node3; do
          NAME="${NODE}-upgrade-0-74-2-execute"
          echo ">> Waiting for ${NAME} to succeed..."
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
            networkupgradeexecute/${NAME} \
            -n solo-orbit --timeout=300s
          echo ">> ${NODE} upgrade succeeded"
        done
      - echo ">> All nodes upgraded successfully"

  upgrade:status:
    desc: Show status of all per-node upgrade CRs (operationId node<N>-upgrade-0-74-2)
    cmds:
      # No shared operationId label; list all upgrade CRs in the namespace.
      - echo ">> NetworkUpgradePrepare:"
      - kubectl get networkupgradeprepare -n solo-orbit -o wide || true
      - echo ""
      - echo ">> NetworkUpgradeFreeze:"
      - kubectl get networkupgradefreeze -n solo-orbit -o wide || true
      - echo ""
      - echo ">> NetworkUpgradeExecute:"
      - kubectl get networkupgradeexecute -n solo-orbit -o wide || true
      - echo ""
      - echo ">> ConsensusCapsules:"
      - kubectl get consensuscapsules -n solo-orbit -o wide || true

  upgrade:
    desc: "Run the full upgrade flow: prepare → freeze (+ hashfreeze) → execute"
    cmds:
      - task: upgrade:prepare
      - task: upgrade:freeze
      - task: upgrade:execute

  upgrade:destroy:
    desc: Delete all per-node upgrade CRs (Prepare/Freeze/Execute) in the namespace
    cmds:
      # No shared label; delete every upgrade CR of each kind (finalizers first).
      - |
        set -eu
        for KIND in networkupgradeexecute networkupgradefreeze networkupgradeprepare; do
          for NAME in $(kubectl get ${KIND} -n solo-orbit -o name 2>/dev/null); do
            kubectl patch ${NAME} -n solo-orbit --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true
          done
          kubectl delete ${KIND} -n solo-orbit --all --ignore-not-found --wait=false
        done

  cleanup:
    desc: Uninstall MetalLB, MinIO operator and tenant
    cmds:
      - helm uninstall minio-operator -n minio-operator || true
      - helm uninstall minio-tenant -n minio-tenant || true
      - kubectl delete namespace minio-tenant --ignore-not-found
      - kubectl delete namespace minio-operator --ignore-not-found
      - helm uninstall metallb -n metallb-system || true
      - kubectl delete namespace metallb-system --ignore-not-found
