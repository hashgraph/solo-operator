#
# The payer's key material, delivered as a Secret and mounted at
# <config-dir>/keys/ so beacon's keystore finds account<N>.pem by convention.
# In a non-interactive Job there is no TTY to prompt for the PEM passphrase, so
# ship an account<N>.pass sibling (or use an unencrypted PEM and omit it).
#
# Do NOT commit real keys. Prefer creating this Secret out-of-band, e.g.:
#   kubectl -n solo create secret generic beacon-keys \
#     --from-file=account2.pem=./keys/account2.pem \
#     --from-file=account2.pass=./keys/account2.pass
apiVersion: v1
kind: Secret
metadata:
  name: beacon-keys
  namespace: solo
type: Opaque
stringData:
  account2.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PAYER_0.0.2_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  account2.pass: "REPLACE_WITH_PEM_PASSPHRASE"   # omit if the PEM is unencrypted
