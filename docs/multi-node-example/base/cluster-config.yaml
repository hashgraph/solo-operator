        </Logger>
        <Logger name="com.hedera.services.legacy.hgcca.core" level="warn" additivity="false">
          <!-- <AppenderRef ref="Console"/> -->
          <AppenderRef ref="RollingFile"/>
        </Logger>
        <Logger name="com.hedera.services.legacy.evm" level="warn" additivity="false">
          <!-- <AppenderRef ref="Console"/> -->
