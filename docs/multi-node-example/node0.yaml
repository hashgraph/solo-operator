kind: Secret
apiVersion: v1
metadata:
  name: node0-keys
  namespace: solo-network
data:
  s-private-node0.pem: 
  s-public-node0.pem: 
  a-private-node0.pem: 
  a-public-node0.pem: 
  hedera.crt: 
  hedera.key: 
---
apiVersion: operator.solo.hedera.com/v1alpha1
kind: ConsensusCapsule
metadata:
  name: node0
  namespace: solo-network
spec:
  eligibleForDeployment: false
  sidecars:
    recordStreamUploader:
      image: gcr.io/hedera-registry/uploader-mirror:1.3.0
      enabled: true
      nameOverride: "record-stream-uploader"
      config:
        debug: true
        compression: true
        sidecar: true
        reaper:
          enabled: true
          minKeep: 1
          interval: 1
          defaultBackoff: 1
        signature:
          require: true
          prioritize: true
      resources: { }
