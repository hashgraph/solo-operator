# SPDX-License-Identifier: Apache-2.0

version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gosimple
    - gocritic
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - zz_generated

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/hashgraph/solo-operator
