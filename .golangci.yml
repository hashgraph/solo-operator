version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gocritic
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
          - gosec
      - path: ^test/
        linters:
          - gosec
      # Operator-supplied CLI/config paths; UC reads are O_NOFOLLOW-hardened
      - path: ^internal/(beacon|uc)/
        linters:
          - gosec
        text: "G304"
      # math/rand only orders registry candidates
      - path: ^internal/controller/
        linters:
          - gosec
        text: "G404"
      # Reason code name, not a credential
      - path: ^internal/registry/reasons\.go
        linters:
          - gosec
        text: "G101"
      # Ignore deprecated Requeue field - it's still commonly used in controller-runtime
      - linters:
          - staticcheck
        text: "SA1019.*Requeue is deprecated"
    paths:
      - zz_generated

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        # appendAssign is a style preference
        - appendAssign
        # Octal literal style is a matter of preference
        - octalLiteral
        # Empty string test style is a matter of preference
        - emptyStringTest
    staticcheck:
      checks:
        - all
        # Disable nil check before len() - this is a style preference
        - "-S1009"
        # Disable naming convention checks - API field names are fixed for compatibility
        - "-ST1003"
        # Disable package comment requirement
        - "-ST1000"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/hashgraph/solo-operator
