# SPDX-License-Identifier: Apache-2.0

version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gosimple
    - gocritic

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/hashgraph/solo-operator
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: zz_generated
      linters:
        - all
