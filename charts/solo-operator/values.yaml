# Default values for solo-operator
# This is a YAML-formatted file.

# Number of replicas (use 1 for single instance, 2+ for HA with leader election)
replicaCount: 1

image:
  repository: ghcr.io/hashgraph/solo-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election configuration
leaderElection:
  enabled: true

# Logging configuration
logging:
  # Log level: trace, debug, info, warn, error
  level: info
  # Log format: json (structured) or console (human-readable)
  format: json

# Registry validation configuration (upgrade Prepare phase)
registry:
  # Order in which a component's registries are checked: Random or Sequential
  order: Random

# Metrics configuration
metrics:
  enabled: true
  port: 8080
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

# Health probes configuration
health:
  port: 8081

# CRD installation
crds:
  # Install CRDs with the chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true
  # Annotations to be added to all CRDs
  annotations: {}
  # Additional labels to be added to all CRDs
  additionalLabels: {}

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# Controller configuration
controller:
  # Maximum concurrent reconciles per controller
  maxConcurrentReconciles: 1
  # Reconcile period for periodic reconciliation
  syncPeriod: 10m
  # Backstop deadline for a consensus node to reach platform status ACTIVE after an
  # upgrade. When exceeded a NodeActiveDeadlineExceeded warning condition is set on
  # the NetworkUpgradeExecute CR; the upgrade keeps waiting for the node to recover.
  # Increase for large states where event replay/reconnect is slow. Empty uses the
  # operator default (10m).
  nodeActiveTimeout: 10m
  # Interval between repeated NodeActiveDeadlineExceeded warning events after the
  # initial deadline fires. Shorter values give the node operator more frequent
  # visibility. Empty uses the operator default (5m).
  nodeActiveAlertInterval: 5m
