# Default values for solo-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/hashgraph/solo-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

metricsService:
  # Expose Prometheus metrics endpoint on port 8443
  enabled: true
  type: ClusterIP
  port: 8443

serviceMonitor:
  # Deploy a Prometheus Operator ServiceMonitor resource.
  # Requires Prometheus Operator CRDs (monitoring.coreos.com/v1) in the cluster.
  enabled: false
  # Scrape interval for Prometheus
  interval: 30s
  # Scrape timeout
  scrapeTimeout: 10s
  # Additional labels to add to the ServiceMonitor (e.g. release: prometheus)
  labels: {}
  # Metrics path to scrape (defaults to /metrics)
  telemetryPath: /metrics

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# CRD Subchart configuration
crds:
  # Install CRDs along with the operator
  enabled: true

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# ValidatingAdmissionPolicies enforcing CR invariants at admission:
# 1. NetworkUpgrade* CR label invariants (operation-id and step labels).
# 2. Orbit namespace invariants (spec.orbit / spec.orbitRef.name must match metadata.namespace).
# Requires Kubernetes >= 1.32 (VAP is GA), which the chart already floors via kubeVersion.
admissionPolicy:
  # Install the ValidatingAdmissionPolicy + Binding resources.
  enabled: true
  # failurePolicy for the policies: Fail (deny on CEL evaluation error, fail closed)
  # or Ignore (admit on evaluation error, fail open).
  failurePolicy: Fail

# Controller configuration
controller:
  # Maximum concurrent reconciles per controller
  maxConcurrentReconciles: 1
  # Reconcile period for periodic reconciliation
  syncPeriod: 10m
  # Backstop deadline for a consensus node to reach platform status ACTIVE after an
  # upgrade. When exceeded a NodeActiveDeadlineExceeded warning condition is set on
  # the NetworkUpgradeExecute CR; the upgrade keeps waiting for the node to recover].
  # Increase for large states where event replay/reconnect is slow. Empty uses the
  # operator default (10m).
  nodeActiveTimeout: 10m

# Upgrades Sidecar (UC) image configuration
uc:
  image:
    repository: ghcr.io/hashgraph/solo-operator-uc
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
