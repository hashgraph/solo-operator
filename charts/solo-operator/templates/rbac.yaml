{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solo-operator.fullname" . }}-manager-role
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "endpoints", "persistentvolumeclaims", "secrets", "serviceaccounts", "services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["patch"]
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["operator.solo.hiero.org"]
  resources: ["apipermissionproperties", "applicationoverrideproperties", "applicationproperties", "blocknodesconfigs", "bootstrapproperties", "consensuscapsules", "envoyproxies", "feeschedules", "haproxycapsules", "helmcapsules", "log4j2configs", "networkgeneses", "networkupgradeexecutes", "networkupgradefreezeaborts", "networkupgradefreezes", "networkupgradeprepares", "nodepropertiesconfigs", "nodesettings", "orbits", "simplefeesschedules", "throttlesconfigs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["operator.solo.hiero.org"]
  resources: ["apipermissionproperties/status", "applicationoverrideproperties/status", "applicationproperties/status", "blocknodesconfigs/status", "bootstrapproperties/status", "consensuscapsules/status", "envoyproxies/status", "feeschedules/status", "haproxycapsules/status", "helmcapsules/status", "log4j2configs/status", "networkgeneses/status", "networkupgradeexecutes/status", "networkupgradefreezeaborts/status", "networkupgradefreezes/status", "networkupgradeprepares/status", "nodepropertiesconfigs/status", "nodesettings/status", "orbits/status", "simplefeesschedules/status", "throttlesconfigs/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["operator.solo.hiero.org"]
  resources: ["consensuscapsules/finalizers", "envoyproxies/finalizers", "haproxycapsules/finalizers", "helmcapsules/finalizers", "networkgeneses/finalizers", "networkupgradeexecutes/finalizers", "networkupgradefreezeaborts/finalizers", "networkupgradefreezes/finalizers", "networkupgradeprepares/finalizers", "orbits/finalizers"]
  verbs: ["update"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings", "roles"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "solo-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "solo-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "solo-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "solo-operator.fullname" . }}-leader-election-role
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "solo-operator.fullname" . }}-leader-election-rolebinding
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "solo-operator.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "solo-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
