{{- if .Values.rbac.create }}
{{- $fullname := include "solo-operator.fullname" . }}
{{- $serviceAccount := include "solo-operator.serviceAccountName" . }}
{{- $allowedNamespaces := regexSplit " " (include "solo-operator.allowedNamespaces" .) -1 }}
{{- range $index, $namespace := $allowedNamespaces }}
{{- if eq $index 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-manager-role
  labels:
    {{- include "solo-operator.labels" $ | nindent 4 }}
rules:
{{ include "solo-operator.rbac.clusterRules" $ }}
{{- end }}
{{- if ne $namespace "_all_namespaces_placeholder" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-manager-role
  namespace: {{ $namespace }}
  labels:
    {{- include "solo-operator.labels" $ | nindent 4 }}
rules:
{{- end }}
{{ include "solo-operator.rbac.namespacedRules" $ }}
{{- end }}
{{- range $index, $namespace := $allowedNamespaces }}
{{- if eq $index 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  labels:
    {{- include "solo-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if ne $namespace "_all_namespaces_placeholder" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  namespace: {{ $namespace }}
  labels:
    {{- include "solo-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
# Leader election role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election-role
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election-rolebinding
  labels:
    {{- include "solo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
