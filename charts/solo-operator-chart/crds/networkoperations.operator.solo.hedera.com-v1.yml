                  workflowStep:
                    description: |
                      Workflow step is handled as below:
                      # ExecuteImmediate (T = 0) # the build.zip file will contain manifest and other configuration files so that the "solo | solo-provisioner-bridge | ?" can use it to create the CR
                        1. validate image (ensure we can pull the image from specified registries and validate the layer hashes, we may use HEAD request instead of downloading the image) # most likely the registries will be public, but solo-provisioner may inject k8s secrets for permissioned registries.
                          1a. store the resolved manifest hashes (?), registry details as well as their validation status in the status field (e.g. probably need a new object e.g. SoftwareVersionStatus datamodel with status)
                          1b. select a valid registry randomly and store the selected registry in the status field
                          1c. add a condition to the status field explaining the validation status
                        2. potentially deploy firewall rule changes (TBD)
                      # FreezeScheduled (T + 2 days)
                        3. check that selected registry still has image and hashes match (e.g. use HEAD request)
                          3a. iff registry doesn't have a valid image anymore, lookup other registries in sequence softwareVersionSource and pick the first valid one
                            - update the status with this valid registry information.
                            - update the old one with failed status
                          3b. if no valid registry is found, emit error and abort. We mark the NI as failed.
                          3c. add a condition to the status field explaining the validation status
                      # FreezeAbort
                        4. rollback firewall rule changes (potentially)
                          4a. add a condition to the status field explaining the validation status
                      # NowFrozen ( T + 3 days)
                        5. check that selected registry still has image and hashes match (see 3)
                        6. rollout config file bundle (patch the orbit CR)
                            6a. orbit reconciler will creates config-map: settings.txt, application.properties, api-permission.properties...
                            6b. network-operation reconciler creates config.txt
                        7. single atomic patch to consensus-capsule CR
                          7a. apply consensus-node changeset
                          7b. apply streamUploader changesets (e.g recordStreamUploader, backUploader etc.)
                        8. Ensure everything is up or emit error (NI already does this check)
                        9. add a condition to the status field explaining the validation status
                    enum:
                    - "ExecuteImmediate"
                    - "FreezeAbort"
                    - "FreezeScheduled"
                    - "NowFrozen"
                    type: "string"
                required:
                - "changesets"
                - "workflowStep"
