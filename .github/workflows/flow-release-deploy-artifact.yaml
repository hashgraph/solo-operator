# SPDX-License-Identifier: Apache-2.0

---
name: "Release: Deploy Artifact"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false
      jfrog-enabled:
        description: "Push artifacts to JFrog"
        type: boolean
        required: false
        default: true

defaults:
  run:
    shell: bash

env:
  GH_OCI_REGISTRY: ghcr.io
  GH_OCI_GROUP: hashgraph/solo-operator
  JF_OCI_REGISTRY: ${{ vars.JF_HELM_REGISTRY }}
  JF_OCI_GROUP: solo-operator-docker-release

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release / Publish
    uses: ./.github/workflows/zxc-release.yaml
    with:
      dry-run: ${{ inputs.dry-run-enabled }}
      jfrog-enabled: ${{ inputs.jfrog-enabled }}
      helm-chart-path: charts/solo-operator
    secrets: inherit

  docker-publish:
    name: Release / Docker (operator + UC + beacon)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' && !inputs.dry-run-enabled }}
    runs-on: solo-linux-medium
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Stamp the release version into both binaries so the operator's
      # version.Version matches the UC image (solo-operator/uc:<version>)
      # published below, keeping operator + UC in lockstep.
      - name: Build Operator Binaries & Checksums
        run: task hash VERSION="${{ needs.release.outputs.version }}"

      - name: Build UC Binaries & Checksums
        run: task hash:uc VERSION="${{ needs.release.outputs.version }}"

      - name: Build beacon Binaries & Checksums
        run: task hash:beacon VERSION="${{ needs.release.outputs.version }}"

      - name: Setup QEMU
        uses: step-security/setup-qemu-action@1d653f731ddc90c553742100d15205c94b792314 # v4.2.0

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Docker Login (GitHub)
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ${{ env.GH_OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JFrog CLI
        id: jfrog-cli
        if: ${{ inputs.jfrog-enabled }}
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: hashgraph

      - name: Docker Login (JFrog)
        if: ${{ inputs.jfrog-enabled }}
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ${{ env.JF_OCI_REGISTRY }}
          username: ${{ steps.jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli.outputs.oidc-token }}

      - name: Build and Push Docker Image (GitHub)
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/solo-operator:${{ needs.release.outputs.version }}

      - name: Build and Push Docker Image (JFrog)
        if: ${{ inputs.jfrog-enabled }}
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator:${{ needs.release.outputs.version }}

      - name: Build and Push UC Image (GitHub)
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/uc:${{ needs.release.outputs.version }}

      - name: Build and Push UC Image (JFrog)
        if: ${{ inputs.jfrog-enabled }}
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/uc:${{ needs.release.outputs.version }}

      - name: Build and Push beacon Image (GitHub)
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          file: Dockerfile.beacon
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/beacon:${{ needs.release.outputs.version }}

      - name: Build and Push beacon Image (JFrog)
        if: ${{ inputs.jfrog-enabled }}
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          file: Dockerfile.beacon
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/beacon:${{ needs.release.outputs.version }}
