# SPDX-License-Identifier: Apache-2.0

---
name: "Release: Deploy Artifact"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  GH_OCI_REGISTRY: ghcr.io
  GH_OCI_GROUP: hashgraph/solo-operator
  JF_OCI_REGISTRY: ${{ vars.JF_HELM_REGISTRY }}
  JF_OCI_GROUP: solo-operator-docker-release

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release / Publish
    uses: ./.github/workflows/zxc-release.yaml
    with:
      dry-run: ${{ inputs.dry-run-enabled }}
      helm-chart-path: charts/solo-operator
    secrets: inherit

  docker-publish:
    name: Release / Docker (operator + UC + beacon)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' && !inputs.dry-run-enabled }}
    runs-on: solo-linux-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Stamp the release version into both binaries so the operator's
      # version.Version (and thus UCDefaultImage() -> solo-operator-uc:<version>)
      # matches the UC image published below, keeping operator + UC in lockstep.
      - name: Build Operator Binaries & Checksums
        run: task hash VERSION="${{ needs.release.outputs.version }}"

      - name: Build UC Binaries & Checksums
        run: task hash:uc VERSION="${{ needs.release.outputs.version }}"

      - name: Build beacon Binaries & Checksums
        run: task hash:beacon VERSION="${{ needs.release.outputs.version }}"

      - name: Setup QEMU
        uses: step-security/setup-qemu-action@1d653f731ddc90c553742100d15205c94b792314 # v4.2.0

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Docker Login (GitHub)
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        with:
          registry: ${{ env.GH_OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login (JFrog)
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        with:
          registry: ${{ env.JF_OCI_REGISTRY }}
          username: ${{ vars.JF_USERNAME }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Build and Push Docker Image (GitHub)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}:${{ needs.release.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}:latest

      - name: Build and Push Docker Image (JFrog)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator:${{ needs.release.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator:latest

      - name: Build and Push UC Image (GitHub)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/hashgraph/solo-operator-uc:${{ needs.release.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/hashgraph/solo-operator-uc:latest

      - name: Build and Push UC Image (JFrog)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator-uc:${{ needs.release.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator-uc:latest

      - name: Build and Push beacon Image (GitHub)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          file: Dockerfile.beacon
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/hashgraph/solo-operator-beacon:${{ needs.release.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/hashgraph/solo-operator-beacon:latest

      - name: Build and Push beacon Image (JFrog)
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          file: Dockerfile.beacon
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator-beacon:${{ needs.release.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator-beacon:latest
