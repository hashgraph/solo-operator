# SPDX-License-Identifier: Apache-2.0

---
name: "Release: Deploy Artifact"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  GH_OCI_REGISTRY: ghcr.io
  GH_OCI_GROUP: hashgraph/solo-operator
  GH_HELM_GROUP: hashgraph/solo-operator
  JF_OCI_REGISTRY: ${{ vars.JF_HELM_REGISTRY }}
  JF_OCI_GROUP: solo-operator-docker-release
  JF_HELM_GROUP: solo-operator-helm-release

permissions:
  contents: read
  packages: write

jobs:
  publish-release:
    name: Release / Publish
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Install GnuPG Tools
        run: |
          if ! command -v gpg2 >/dev/null 2>&1; then
            echo "::group::Updating APT Repository Indices"
              sudo apt update
            echo "::endgroup::"
            echo "::group::Installing GnuPG Tools"
              sudo apt install -y gnupg2
            echo "::endgroup::"
          fi

      - name: Import GPG key
        id: gpg_key
        uses: step-security/ghaction-import-gpg@69c854a83c7f79463f8bdf46772ab09826c560cd # v6.3.1
        with:
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "v3.13.3"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Docker Login (GitHub)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.GH_OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login (JFrog)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.JF_OCI_REGISTRY }}
          username: ${{ vars.JF_USERNAME }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Helm Registry Login (GitHub)
        run: helm registry login ${{ env.GH_OCI_REGISTRY }} -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Helm Registry Login (JFrog)
        run: helm registry login ${{ env.JF_OCI_REGISTRY }} -u ${{ vars.JF_USERNAME }} -p "${{ secrets.JF_ACCESS_TOKEN }}"

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Sync CRD Templates into Subchart
        run: task helm:sync-crds

      - name: Helm Lint
        run: helm lint charts/solo-operator

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release@23.0.0 @semantic-release/git@10.0.1 @semantic-release/exec@6.0.3
          npm install -g conventional-changelog-conventionalcommits@7.0.2 @commitlint/cli@18.6.0 @commitlint/config-conventional@18.6.0
          npm install -g marked-mangle@1.1.6 marked-gfm-heading-id@3.1.2 semantic-release-conventional-commits@3.0.0

      - name: Run Semantic Release
        id: semantic-release
        env:
          EDITOR: 'sh -c "echo chore: auto tag > ${1}"'
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        if: ${{ !cancelled() && !failure() }}
        run: |
          npx semantic-release ${{ github.event.inputs.dry-run-enabled == 'true' && '--dry-run' || '' }}
          if [[ -f .release-version ]]; then
            VERSION=$(cat .release-version)
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image (GitHub)
        if: ${{ steps.semantic-release.outputs.released == 'true' && github.event.inputs.dry-run-enabled != 'true' && !cancelled() && !failure() }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: GO_VERSION=${{ steps.setup-go.outputs.go-version }}
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}:${{ steps.semantic-release.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}:latest

      - name: Build and Push Docker Image (JFrog)
        if: ${{ steps.semantic-release.outputs.released == 'true' && github.event.inputs.dry-run-enabled != 'true' && !cancelled() && !failure() }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: GO_VERSION=${{ steps.setup-go.outputs.go-version }}
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator:${{ steps.semantic-release.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/solo-operator:latest

      - name: Push Helm Chart (GitHub)
        if: ${{ steps.semantic-release.outputs.released == 'true' && github.event.inputs.dry-run-enabled != 'true' && !cancelled() && !failure() }}
        run: |
          helm push solo-operator-${{ steps.semantic-release.outputs.version }}.tgz "oci://${{ env.GH_OCI_REGISTRY }}/${{ env.GH_HELM_GROUP }}"

      - name: Push Helm Chart (JFrog)
        if: ${{ steps.semantic-release.outputs.released == 'true' && github.event.inputs.dry-run-enabled != 'true' && !cancelled() && !failure() }}
        run: |
          helm push solo-operator-${{ steps.semantic-release.outputs.version }}.tgz "oci://${{ env.JF_OCI_REGISTRY }}/${{ env.JF_HELM_GROUP }}"
