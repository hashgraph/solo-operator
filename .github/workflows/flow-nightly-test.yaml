# SPDX-License-Identifier: Apache-2.0

---
name: Nightly Test

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  KIND_NODE_IMAGE: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
  VERSION: 0.0.0-${{ github.sha }}

jobs:
  test:
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          version: v0.31.0
          kubectl_version: v1.31.4
          verbosity: 3

      - name: Create KinD Cluster with Registry
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: 0.31.0
          kubectl_version: v1.31.4
          registry: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: solo-operator-nightly

      - name: Build Binaries
        run: task build:binary:all

      - name: Generate Checksums
        run: task hash

      - name: Build and Push to Local Registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: localhost:5000/solo-operator:${{ env.VERSION }}

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Sync CRD Templates into Subchart
        run: task helm:sync-crds

      - name: Deploy Operator
        run: |
          helm upgrade --install solo-operator charts/solo-operator \
            --namespace solo-operator --create-namespace --wait --timeout 120s \
            --set image.repository=kind-registry:5000/solo-operator \
            --set image.tag=${{ env.VERSION }}

      - name: Run nightly test
        run: task -d test/nightly deploy

      - name: Collect logs
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p logs
          kubectl logs -n solo-operator -l app.kubernetes.io/name=solo-operator --tail=-1 > logs/operator.log 2>&1 || true
          kubectl logs -n solo-orbit -l app.kubernetes.io/component=consensus-node -c consensus-node --tail=-1 > logs/consensus-nodes.log 2>&1 || true

      - name: Publish test logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Logs
          path: logs
