# SPDX-License-Identifier: Apache-2.0

---
name: Nightly Test

on:
  # Scheduled runs are temporarily disabled: the test/nightly fixtures use the
  # old inline ConsensusCapsule schema and fail strict decoding against the
  # current reference-based config CRs. Re-enable after updating the fixtures.
  # Tracking: https://github.com/hashgraph/solo-operator/issues/1142
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  KIND_NODE_IMAGE: kindest/node:v1.32.2@sha256:142f543559cc55d64e1ab9341df08e5ced84bd2e893736da8f51320f26f5950b
  VERSION: 0.0.0-${{ github.sha }}

jobs:
  test:
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: step-security/setup-qemu-action@fe44c529aab16157fc475f4991a7f926aa9a02a2 # v4.1.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          version: v0.31.0
          kubectl_version: v1.32.2
          verbosity: 3

      - name: Create KinD Cluster with Registry
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: 0.31.0
          kubectl_version: v1.32.2
          registry: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: solo-operator-nightly

      - name: Build Binaries
        run: task build:binary:all

      - name: Generate Checksums
        run: task hash

      - name: Build and Push to Local Registry
        uses: step-security/docker-build-push-action@9af9b5acc1751dcec2aa5375a068979fa526bc9a # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: localhost:5000/solo-operator:${{ env.VERSION }}

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Sync CRD Templates into Subchart
        run: task helm:sync-crds

      - name: Deploy Operator
        run: |
          helm upgrade --install solo-operator charts/solo-operator \
            --namespace solo-operator --create-namespace --wait --timeout 120s \
            --set image.repository=kind-registry:5000/solo-operator \
            --set image.tag=${{ env.VERSION }}

      - name: Run nightly test
        run: task -d test/nightly deploy

      - name: Collect logs
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p logs
          kubectl logs -n solo-operator -l app.kubernetes.io/name=solo-operator --tail=-1 > logs/operator.log 2>&1 || true
          kubectl logs -n solo-orbit -l app.kubernetes.io/component=consensus-node -c consensus-node --tail=-1 > logs/consensus-nodes.log 2>&1 || true

      - name: Publish test logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Logs
          path: logs
