# SPDX-License-Identifier: Apache-2.0

---
name: Nightly Test

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

env:
  CACHE_DIR: cache_dir
  CACHE_KEY: nightly-test
  HOSTNAME_PREFIX: github-
  MACHINE: n4-highmem-4
  VERSION: 0.0.0-${{ github.sha }}
  VERSION_A: 0.59.0
  VERSION_B: 0.59.5
  ZONE: us-central1-a

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
        with:
          workload_identity_provider: projects/970521953460/locations/global/workloadIdentityPools/solo-op-automation-pool/providers/gh-provider
          service_account: gh-solo-test-driver@solo-operator-automated-tests.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Install tools
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y gettext moreutils parallel

      - name: Try restoring cache
        id: restore
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHE_DIR }}.tar
          key: ${{ env.CACHE_KEY }}

      - name: Run nightly test
        id: nightly_test
        run: |
          :
          cache_dir_hash() {
            find "${CACHE_DIR}" -type f -exec sha1sum {} + | sort | sha1sum | cut -d ' ' -f1
          }
          test -f "${CACHE_DIR}.tar" && tar -xf "${CACHE_DIR}.tar"
          mkdir -p "${CACHE_DIR}"
          hash_a=$(cache_dir_hash)
          ./test/nightly/scripts/main.sh
          find "${CACHE_DIR}" -name "*.yaml" -exec rm {} \;
          hardlink -cq "${CACHE_DIR}"
          hash_b=$(cache_dir_hash)
          tar -cf "${CACHE_DIR}.tar" "${CACHE_DIR}"
          echo "refresh_cache=$([ "${hash_a}" != "${hash_b}" ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Publish test logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Logs
          path: "logs"

      - name: Delete old cache (if refresh requested)
        if: ${{ steps.nightly_test.outcome == 'success' && steps.nightly_test.outputs.refresh_cache == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting existing cache with key '${{ env.CACHE_KEY }}'"
          curl -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=${{ env.CACHE_KEY }}"

      - name: Save new cache
        if: ${{ steps.nightly_test.outcome == 'success' && steps.nightly_test.outputs.refresh_cache == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHE_DIR }}.tar
          key: ${{ env.CACHE_KEY }}

      - name: Delete VMs
        if: ${{ always() }}
        run: |
          gcloud compute instances list --format='value(name)' | grep "^${HOSTNAME_PREFIX}" | xargs gcloud compute instances delete --quiet --zone="${ZONE}" || true
