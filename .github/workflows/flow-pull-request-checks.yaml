---
name: "PR Checks"
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

defaults:
  run:
    shell: bash

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Code
    uses: ./.github/workflows/zxc-compile-code.yaml

  code-style:
    name: Code Style
    uses: ./.github/workflows/zxc-compile-code.yaml
    needs:
      - build
    with:
      custom-job-label: Check
      enable-lint-check: true

  vuln-check:
    name: Vulnerability Check
    uses: ./.github/workflows/zxc-compile-code.yaml
    needs:
      - build
    with:
      custom-job-label: Govulncheck
      enable-vuln-check: true

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/zxc-compile-code.yaml
    needs:
      - build
    with:
      custom-job-label: Standard
      enable-unit-tests: true

  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/zxc-compile-code.yaml
    needs:
      - build
    with:
      custom-job-label: Standard
      enable-integration-tests: true

  codecov:
    name: CodeCov
    uses: ./.github/workflows/zxc-code-analysis.yaml
    needs:
      - unit-tests
    if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    with:
      custom-job-label: Standard
      enable-codecov-analysis: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

##### Codacy Coverage cannot be enabled until the repository is made public.

