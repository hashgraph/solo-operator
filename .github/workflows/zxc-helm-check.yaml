---
name: "ZXC: Helm Check"

on:
  workflow_call:
    inputs:
      helm-version:
        description: "Helm version"
        type: string
        required: false
        default: "v3.18.0"
      chart-path:
        description: "Path to the Helm chart directory"
        type: string
        required: false
        default: "charts/solo-operator"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  helm-check:
    name: "Lint & Template"
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ inputs.helm-version }}

      - name: Sync CRD Templates into Subchart
        run: task helm:sync-crds

      - name: Helm lint
        run: helm lint ${{ inputs.chart-path }}

      - name: Helm template (default values)
        run: helm template solo-operator ${{ inputs.chart-path }} > /tmp/default.yaml

      - name: Helm template (CRDs disabled)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set crds.install=false \
            > /tmp/no-crds.yaml

      - name: Helm template (ServiceMonitor enabled)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set metrics.serviceMonitor.enabled=true \
            > /tmp/service-monitor.yaml

      - name: Helm template (HA mode)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set replicaCount=2 \
            > /tmp/ha.yaml

      - name: Validate rendered output
        run: |
          set -eu
          for f in /tmp/default.yaml /tmp/no-crds.yaml /tmp/service-monitor.yaml /tmp/ha.yaml; do
            echo "Validating $f"
            test -s "$f"
            grep -q '^kind:' "$f"
          done
