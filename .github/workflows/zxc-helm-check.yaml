---
name: "ZXC: Helm Check"

on:
  workflow_call:
    inputs:
      helm-version:
        description: "Helm version"
        type: string
        required: false
        default: "v3.18.0"
      chart-path:
        description: "Path to the Helm chart directory"
        type: string
        required: false
        default: "charts/solo-operator"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  helm-check:
    name: "Lint & Template"
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Sync CRD Templates into Subchart
        run: task helm:sync-crds

      - name: Helm lint
        run: helm lint ${{ inputs.chart-path }}

      - name: Helm template (default values)
        run: helm template solo-operator ${{ inputs.chart-path }} > /tmp/default.yaml

      - name: Helm template (CRDs disabled)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set crds.install=false \
            > /tmp/no-crds.yaml

      - name: Helm template (ServiceMonitor enabled)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set metrics.serviceMonitor.enabled=true \
            > /tmp/service-monitor.yaml

      - name: Helm template (HA mode)
        run: |
          helm template solo-operator ${{ inputs.chart-path }} \
            --set replicaCount=2 \
            > /tmp/ha.yaml

      - name: Validate rendered output
        run: |
          set -eu
          for f in /tmp/default.yaml /tmp/no-crds.yaml /tmp/service-monitor.yaml /tmp/ha.yaml; do
            echo "Validating $f"
            test -s "$f"
            grep -q '^kind:' "$f"
          done
