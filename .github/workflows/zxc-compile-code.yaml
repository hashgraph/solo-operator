# SPDX-License-Identifier: Apache-2.0

---
name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-lint-check:
        description: "Lint Check Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

env:
  GO_VERSION: "1.21"

jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: ${{ inputs.enable-lint-check && '0' || '' }}

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Compile Code
        run: go build -v ./...

      - name: Lint Check
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          version: latest
          args: --timeout=5m

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./api/...
          go tool cover -html=coverage.out -o coverage.html

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: |
            coverage.out
            coverage.html

      - name: Kubernetes KinD Cluster
        id: kind
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: helm/kind-action@b72c923563e6e80ea66e8e8c810798cc73e97e5e
        with:
          registry: true

      - name: Set up QEMU
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          buildkitd-config-inline: |
            [registry."kind-registry:5000"]
              http = true
          driver-opts: |
            network=container:kind-registry

      - name: Set up Helm
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Build and Push to Registry
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          REGISTRY: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
          VERSION: 0.0.0-${{ github.sha }}
        run: |
          # Build multi-arch image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${REGISTRY}/solo-operator:${VERSION} \
            --push \
            .

          # Package and install Helm chart
          helm package charts/solo-operator --version ${VERSION} --app-version ${VERSION}
          helm upgrade solo-operator solo-operator-${VERSION}.tgz \
            -i -n solo-operator --create-namespace \
            --set image.repository=${REGISTRY}/solo-operator \
            --set image.tag=${VERSION}

      - name: Wait for Operator Ready
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl -n solo-operator rollout status deployment/solo-operator-controller-manager --timeout=120s

      - name: Install CRDs
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl apply --server-side -f config/crd/bases/

      - name: Capture Operator Log
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          kubectl -n solo-operator logs -l app.kubernetes.io/name=solo-operator --tail -1 --timestamps > operator.log || true

      - name: Publish Operator Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: "Operator Log"
          path: "operator.log"
