---
name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-integration-tests:
        description: "Integration Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-lint-check:
        description: "Lint Check Enabled"
        type: boolean
        required: false
        default: false
      enable-docker-build:
        description: "Docker Build Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

env:
  KIND_NODE_IMAGE: kindest/node:v1.32.2@sha256:142f543559cc55d64e1ab9341df08e5ced84bd2e893736da8f51320f26f5950b

jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.enable-lint-check && '0' || '' }}

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Dependencies
        run: task mod:download

      - name: Compile Code
        run: task build

      - name: Setup Linter
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Lint Check
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        run: task lint

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: task test:unit

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: |
            coverage.out
            coverage.html

      - name: Install setup-envtest
        if: ${{ inputs.enable-integration-tests && !cancelled() && !failure() }}
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1

      - name: Integration Tests
        if: ${{ inputs.enable-integration-tests && !cancelled() && !failure() }}
        run: task test:integration

      - name: Set up QEMU
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: step-security/setup-qemu-action@1d653f731ddc90c553742100d15205c94b792314 # v4.2.0

      - name: Set up Docker Buildx
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Set up Helm
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        with:
          install_only: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          version: v0.31.0
          kubectl_version: v1.32.2
          verbosity: 3

      - name: Kubernetes KinD Cluster with Registry
        id: kind
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: 0.31.0
          kubectl_version: v1.32.2
          registry: true
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Build Binaries
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        run: task build:binary:all

      - name: Generate Checksums
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        run: task hash

      - name: Build and Push to Local Registry
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: localhost:5000/solo-operator:0.0.0-${{ github.sha }}

      - name: Install yq
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: go install github.com/mikefarah/yq/v4@v4.53.6

      - name: Sync CRD Templates into Subchart
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: task helm:sync-crds

      - name: Helm Lint
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: helm lint charts/solo-operator

      - name: Deploy to KinD
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          VERSION: 0.0.0-${{ github.sha }}
        run: |
          # Package and install Helm chart. helm package names the archive after
          # the chart (name: solo-operator-chart), not the directory.
          helm package charts/solo-operator --version ${VERSION} --app-version ${VERSION}
          helm upgrade solo-operator solo-operator-chart-${VERSION}.tgz \
            -i -n solo-operator --create-namespace \
            --set image.repository=kind-registry:5000/solo-operator \
            --set image.tag=${VERSION}

      - name: Wait for Operator Ready
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl -n solo-operator rollout status deployment/solo-operator-controller-manager --timeout=120s

      - name: Install CRDs
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl apply --server-side -f config/crd/bases/

      - name: Capture Operator Log
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          kubectl -n solo-operator logs -l app.kubernetes.io/name=solo-operator --tail -1 --timestamps > operator.log || true

      - name: Publish Operator Log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: "Operator Log"
          path: "operator.log"
