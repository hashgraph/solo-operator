# SPDX-License-Identifier: Apache-2.0

---
name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-lint-check:
        description: "Lint Check Enabled"
        type: boolean
        required: false
        default: false
      enable-docker-build:
        description: "Docker Build Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

env:
  KIND_NODE_IMAGE: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30

jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ inputs.enable-lint-check && '0' || '' }}

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Dependencies
        run: task mod:download

      - name: Compile Code
        run: task build

      - name: Setup Linter
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Lint Check
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        run: task lint

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: task test:unit

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: |
            coverage.out
            coverage.html

      - name: Set up QEMU
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Set up Helm
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Setup Kind
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        with:
          install_only: true
          node_image: ${{ env.KIND_NODE_IMAGE }}
          version: v0.31.0
          kubectl_version: v1.31.4
          verbosity: 3

      - name: Kubernetes KinD Cluster with Registry
        id: kind
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: 0.31.0
          kubectl_version: v1.31.4
          registry: true
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Build and Push to Local Registry
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: localhost:5000/solo-operator:0.0.0-${{ github.sha }}
          build-args: GO_VERSION=${{ steps.setup-go.outputs.go-version }}

      - name: Install yq
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Sync CRD Templates into Subchart
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: task helm:sync-crds

      - name: Helm Lint
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: helm lint charts/solo-operator

      - name: Deploy to KinD
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          VERSION: 0.0.0-${{ github.sha }}
        run: |
          # Package and install Helm chart
          helm package charts/solo-operator --version ${VERSION} --app-version ${VERSION}
          helm upgrade solo-operator solo-operator-${VERSION}.tgz \
            -i -n solo-operator --create-namespace \
            --set image.repository=kind-registry:5000/solo-operator \
            --set image.tag=${VERSION}

      - name: Wait for Operator Ready
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl -n solo-operator rollout status deployment/solo-operator-controller-manager --timeout=120s

      - name: Install CRDs
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl apply --server-side -f config/crd/bases/

      - name: Capture Operator Log
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          kubectl -n solo-operator logs -l app.kubernetes.io/name=solo-operator --tail -1 --timestamps > operator.log || true

      - name: Publish Operator Log
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: "Operator Log"
          path: "operator.log"
