# SPDX-License-Identifier: Apache-2.0

---
name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-lint-check:
        description: "Lint Check Enabled"
        type: boolean
        required: false
        default: false
      enable-docker-build:
        description: "Docker Build Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

env:
  GO_VERSION: "1.25"

jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: ${{ inputs.enable-lint-check && '0' || '' }}

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Compile Code
        run: go build -v ./...

      - name: Lint Check
        if: ${{ inputs.enable-lint-check && !cancelled() && !failure() }}
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          args: --timeout=5m

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./api/...
          go tool cover -html=coverage.out -o coverage.html

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: |
            coverage.out
            coverage.html

      - name: Set up QEMU
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host

      - name: Start Ephemeral Registry
        id: registry
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        run: |
          docker run -d --restart=always -p 5000:5000 --network bridge --name kind-registry registry:2
          echo "host=localhost" >> $GITHUB_OUTPUT
          echo "port=5000" >> $GITHUB_OUTPUT

      - name: Build and Push to Ephemeral Registry
        if: ${{ (inputs.enable-docker-build || inputs.enable-unit-tests) && !cancelled() && !failure() }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: localhost:5000/solo-operator:0.0.0-${{ github.sha }}

      - name: Kubernetes KinD Cluster
        id: kind
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          cluster_name: kind

      - name: Connect Registry to KinD Network
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          # Connect the registry to the kind network
          docker network connect kind kind-registry || true

          # Configure containerd to use the local registry
          REGISTRY_DIR="/etc/containerd/certs.d/localhost:5000"
          for node in $(kind get nodes --name kind); do
            docker exec "${node}" mkdir -p "${REGISTRY_DIR}"
            docker exec "${node}" sh -c "cat > ${REGISTRY_DIR}/hosts.toml" <<EOF
          [host."http://kind-registry:5000"]
          EOF
          done

          # Document the local registry
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: local-registry-hosting
            namespace: kube-public
          data:
            localRegistryHosting.v1: |
              host: "localhost:5000"
              help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
          EOF

      - name: Set up Helm
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Deploy to KinD
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          VERSION: 0.0.0-${{ github.sha }}
        run: |
          # Package and install Helm chart
          helm package charts/solo-operator --version ${VERSION} --app-version ${VERSION}
          helm upgrade solo-operator solo-operator-${VERSION}.tgz \
            -i -n solo-operator --create-namespace \
            --set image.repository=localhost:5000/solo-operator \
            --set image.tag=${VERSION}

      - name: Wait for Operator Ready
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl -n solo-operator rollout status deployment/solo-operator-controller-manager --timeout=120s

      - name: Install CRDs
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: |
          kubectl apply --server-side -f config/crd/bases/

      - name: Capture Operator Log
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          kubectl -n solo-operator logs -l app.kubernetes.io/name=solo-operator --tail -1 --timestamps > operator.log || true

      - name: Publish Operator Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: "Operator Log"
          path: "operator.log"

      - name: Cleanup Registry
        if: ${{ always() }}
        run: |
          docker rm -f kind-registry || true
