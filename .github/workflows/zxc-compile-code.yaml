# SPDX-License-Identifier: Apache-2.0

---
name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-spotless-check:
        description: "Spotless Check Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write


jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ inputs.enable-spotless-check && '0' || '' }}

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Compile Code
        run: ./gradlew clean assemble --scan

      - name: Spotless Check
        if: ${{ inputs.enable-spotless-check && !cancelled() && !failure() }}
        run: ./gradlew spotlessCheck --scan

      - name: Checkstyle Check
        if: ${{ inputs.enable-spotless-check && !cancelled() && !failure() }}
        run: ./gradlew checkstyleComponentTest checkstyleMain checkstyleTest checkstyleTestFixtures --scan

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: ./gradlew check --scan

      - name: Publish Unit Test Report
        uses: step-security/publish-unit-test-result-action@43e0c963eea0ace6eca353cb1d814d857fee5c53 # v2.20.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          check_name: "Unit Test Results"
          files: "**/build/test-results/test/TEST-*.xml"

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: "**/jacoco*.xml"

      - name: Publish Test Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Test Reports
          path: "**/build/test-results/test/TEST-*.xml"

      - name: Archive Test Snapshots
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          (cd build; zip -qr snapshots.zip snapshots) || :

      - name: Publish Test Snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Test Snapshots
          path: build/snapshots.zip
          if-no-files-found: ignore

      - name: Kubernetes KinD Cluster
        id: kind
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: helm/kind-action@b72c923563e6e80ea66e8e8c810798cc73e97e5e
        with:
          registry: true

      - name: Set up QEMU
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          buildkitd-config-inline: |
            [registry."kind-registry:5000"]
              http = true
          driver-opts: |
            network=container:kind-registry

      - name: Set up Helm
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Publish to registry
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          QUARKUS_CONTAINER_IMAGE_BUILD: true
          QUARKUS_CONTAINER_IMAGE_PUSH: true
          QUARKUS_CONTAINER_IMAGE_REGISTRY: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
          QUARKUS_DOCKER_BUILDX_PLATFORM: linux/amd64,linux/arm64
          ORG_GRADLE_PROJECT_version: 0.0.0-${{ github.sha }}
        run: |
          ./gradlew clean assemble
          helm package build/helm
          helm upgrade solo-operator solo-operator-${ORG_GRADLE_PROJECT_version}.tgz -i -n solo-operator --create-namespace

      - name: Helm Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        env:
          SOLO_OPERATOR_TEST_USING_EXTERNAL_OPERATOR_INSTANCE: true
          QUARKUS_KUBERNETES_CLIENT_DEVSERVICES_OVERRIDE_KUBECONFIG: false
        run: |
          ./gradlew test --scan -Dtags=helm-test


      - name: Capture Operator Log
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        run: |
          kubectl -n solo-operator logs -l app.kubernetes.io/name=solo-operator --tail -1 --timestamps > operator.log
      - name: Publish Operator Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: "Operator Log"
          path: "operator.log"

      - name: Publish Heap Dumps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Test Heap Dumps
          path: "java_*.hprof"
          if-no-files-found: ignore
