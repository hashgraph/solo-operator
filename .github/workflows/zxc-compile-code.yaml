name: "ZXC: Compile Code"
# The purpose of this reusable workflow is to compile the code and run the unit tests on every PR and commit.
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      enable-unit-tests:
        description: "Unit Testing Enabled"
        type: boolean
        required: false
        default: false
      enable-spotless-check:
        description: "Spotless Check Enabled"
        type: boolean
        required: false
        default: false
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Compiles"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write


jobs:
  compile:
    name: ${{ inputs.custom-job-label || 'Compiles' }}
    runs-on: solo-linux-medium
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: ${{ inputs.enable-spotless-check && '0' || '' }}

      - name: Setup Java
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Compile Code
        run: ./gradlew clean assemble --scan

      - name: Spotless Check
        if: ${{ inputs.enable-spotless-check && !cancelled() && !failure() }}
        run: ./gradlew spotlessCheck --scan

      - name: Pre Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: ./gradlew test -i --tests ConsensusCapsuleTest.testMultiNodeDeployment --scan

      - name: Unit Tests
        if: ${{ inputs.enable-unit-tests && !cancelled() && !failure() }}
        run: ./gradlew check --scan

      - name: Publish Unit Test Report
        uses: EnricoMi/publish-unit-test-result-action@567cc7f8dcea3eba5da355f6ebc95663310d8a07 # v2.17.0
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          check_name: "Unit Test Results"
          files: "**/build/test-results/test/TEST-*.xml"

      - name: Publish Unit Test Coverage Reports
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.3.5
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Unit Test Coverage Reports
          path: "**/jacoco*.xml"

      - name: Publish Test Reports
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.3.5
        if: ${{ inputs.enable-unit-tests && !cancelled() }}
        with:
          name: Test Reports
          path: "**/build/test-results/test/TEST-*.xml"
