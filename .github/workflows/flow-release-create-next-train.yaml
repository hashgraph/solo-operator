---
name: "Release: Create Next Train"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  prepare-release-train:
    name: Release Train / Prepare
    runs-on: solo-linux-medium
    outputs:
      version: ${{ steps.current.outputs.version }}
      tag: ${{ steps.current.outputs.tag }}
      next-version: ${{ steps.next.outputs.version }}
      next-snapshot-version: ${{ steps.next.outputs.snapshot }}
      release-branch: ${{ steps.release-branch.outputs.name }}
      release-branch-exists: ${{ steps.release-branch.outputs.exists }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Semantic Version Tools
        run: |
          echo "::group::Download SemVer Binary"
          sudo curl -L -o /usr/local/bin/semver https://raw.githubusercontent.com/fsaintjacques/semver-tool/master/src/semver
          echo "::endgroup::"
          echo "::group::Change SemVer Binary Permissions"
          sudo chmod -v +x /usr/local/bin/semver
          echo "::endgroup::"
          echo "::group::Show SemVer Binary Version Info"
          semver --version
          echo "::endgroup::"

      - name: Extract Current Version
        id: current
        run: |
          CURRENT_TAG="$(git describe --tags --abbrev=0 | tr -d '[:space:]')"
          [[ -z "${CURRENT_TAG}" ]] && CURRENT_TAG="v0.0.0"

          CURRENT_RELEASE="$(semver get release "${CURRENT_TAG}" | tr -d '[:space:]')"
          [[ -z "${CURRENT_RELEASE}" ]] && CURRENT_RELEASE="0.0.0"

          CURRENT_PREREL="$(semver get prerel "${CURRENT_TAG}" | tr -d '[:space:]')"
          CURRENT_BUILD="$(semver get build "${CURRENT_TAG}" | tr -d '[:space:]')"

          CURRENT_VERSION="${CURRENT_RELEASE}"
          [[ -n "${CURRENT_PREREL}" ]] && CURRENT_VERSION="${CURRENT_VERSION}-${CURRENT_PREREL}"
          [[ -n "${CURRENT_BUILD}" ]] && CURRENT_VERSION="${CURRENT_VERSION}+${CURRENT_BUILD}"

          echo "version=${CURRENT_VERSION}" >> ${GITHUB_OUTPUT}
          echo "tag=${CURRENT_TAG}" >> ${GITHUB_OUTPUT}

      - name: Next Version
        id: next
        run: |
          NEXT_VERSION="$(semver bump minor "${{ steps.current.outputs.version }}" | tr -d '[:space:]')"
          NEXT_SNAPSHOT_VERSION="$(semver bump prerel SNAPSHOT "${NEXT_VERSION}" | tr -d '[:space:]')"
          echo "version=${NEXT_VERSION}" >> ${GITHUB_OUTPUT}
          echo "snapshot=${NEXT_SNAPSHOT_VERSION}" >> ${GITHUB_OUTPUT}

      - name: Check for Existing Release Branch
        id: release-branch
        run: |
          VERSION_MAJOR="$(semver get major "${{ steps.current.outputs.version }}" | tr -d '[:space:]')"
          VERSION_MINOR="$(semver get minor "${{ steps.current.outputs.version }}" | tr -d '[:space:]')"
          BRANCH_NAME="alpha/release-${VERSION_MAJOR}.${VERSION_MINOR}"
          BRANCH_EXISTS="false"
          if git rev-list "${BRANCH_NAME}" >/dev/null 2>&1; then
            BRANCH_EXISTS="true"
          fi

          echo "exists=${BRANCH_EXISTS}" >> ${GITHUB_OUTPUT}
          echo "name=${BRANCH_NAME}" >> ${GITHUB_OUTPUT}

  create-release-branch:
    name: Release Train / Branch
    runs-on: solo-linux-medium
    needs:
      - prepare-release-train
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare-release-train.outputs.tag }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Install GnuPG Tools
        run: |
          if ! command -v gpg2 >/dev/null 2>&1; then
            echo "::group::Updating APT Repository Indices"
              sudo apt update
            echo "::endgroup::"
            echo "::group::Installing GnuPG Tools"
              sudo apt install -y gnupg2
            echo "::endgroup::"
          fi

      - name: Import GPG key
        id: gpg_key
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Create Release Branch
        if: ${{ github.event.inputs.dry-run-enabled != 'true' && needs.prepare-release-train.outputs.release-branch-exists != 'true' }}
        run: |
          git checkout -b "${{ needs.prepare-release-train.outputs.release-branch }}"
          git push -u origin "${{ needs.prepare-release-train.outputs.release-branch }}"

  finalize-release-train:
    name: Release Train / Finalize
    runs-on: solo-linux-medium
    needs:
      - prepare-release-train
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
#          ref: main
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Install GnuPG Tools
        run: |
          if ! command -v gpg2 >/dev/null 2>&1; then
            echo "::group::Updating APT Repository Indices"
              sudo apt update
            echo "::endgroup::"
            echo "::group::Installing GnuPG Tools"
              sudo apt install -y gnupg2
            echo "::endgroup::"
          fi

      - name: Import GPG key
        id: gpg_key
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Update Version as Snapshot
        run: ./gradlew versionAsSpecified -PnewVersion=${{ needs.prepare-release-train.outputs.next-snapshot-version }} --scan

      - name: Commit Changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        if: ${{ github.event.inputs.dry-run-enabled != 'true' && needs.prepare-release-train.outputs.release-branch-exists != 'true' }}
        with:
          push: true
          add: "gradle.properties"
          author_name: ${{ secrets.GIT_USER_NAME }}
          author_email: ${{ secrets.GIT_USER_EMAIL }}
          message: "chore(release): prepare for next development iteration [skip ci]"
          pathspec_error_handling: exitImmediately
          commit: "--signoff -S"
