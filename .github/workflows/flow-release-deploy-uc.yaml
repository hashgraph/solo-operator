# SPDX-License-Identifier: Apache-2.0

---
name: "Release: Deploy Artifact (UC Sidecar)"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version, e.g. 0.32.0 — must be the next patch/minor/major of the latest uc-v* tag (from 0.31.1 that means 0.31.2, 0.32.0, or 1.0.0). Leave empty to use 'bump'."
        type: string
        required: false
        default: ""
      bump:
        description: "Version bump — used only when 'version' is empty"
        type: choice
        required: false
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run-enabled:
        description: "Perform Dry Run (compute version + notes only; no tag, build, or push)"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  GH_OCI_REGISTRY: ghcr.io
  GH_OCI_GROUP: hashgraph
  GH_OCI_IMAGE: solo-operator-uc
  JF_OCI_REGISTRY: ${{ vars.JF_HELM_REGISTRY }}
  JF_OCI_GROUP: solo-operator-docker-release

permissions:
  contents: write
  packages: write

concurrency:
  group: release-uc
  cancel-in-progress: false

jobs:
  release-uc:
    name: Release / UC
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # UC is released by hand (rarely), so the version is chosen at dispatch time
      # rather than derived from commit messages. Provide an exact `version`, or
      # leave it empty to bump the latest `uc-v*` tag by `bump` (default: patch).
      - name: Compute Version & Release Notes
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet

          LATEST_TAG="$(git tag -l 'uc-v*' --sort=-v:refname | head -n1)"
          if [[ -n "${LATEST_TAG}" ]]; then
            PREV="${LATEST_TAG#uc-v}"
          else
            PREV="0.0.0"
          fi

          if [[ -n "${VERSION_INPUT}" ]]; then
            NEXT="${VERSION_INPUT#uc-v}"   # tolerate a leading "uc-v" in the input
          else
            IFS='.' read -r MAJ MIN PAT <<< "${PREV}"
            case "${BUMP}" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN + 1)); PAT=0 ;;
              patch) PAT=$((PAT + 1)) ;;
              *) echo "::error::unknown bump '${BUMP}'"; exit 1 ;;
            esac
            NEXT="${MAJ}.${MIN}.${PAT}"
          fi

          # Reject malformed versions (proper semver core, no leading zeros).
          if [[ ! "${NEXT}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${NEXT}' is not a valid semantic version (expected MAJOR.MINOR.PATCH, e.g. 0.32.0)"; exit 1
          fi

          # Reject nonsensical jumps: the version must be a single-step patch/minor/major
          # increment of the latest uc-v* tag (e.g. 0.31.1 -> 3.1.1 is rejected).
          PREV_CORE="${PREV%%-*}"
          IFS='.' read -r pa pb pc <<< "${PREV_CORE}"
          NEXT_CORE="${NEXT%%-*}"
          CAND_PATCH="${pa}.${pb}.$((10#${pc} + 1))"
          CAND_MINOR="${pa}.$((10#${pb} + 1)).0"
          CAND_MAJOR="$((10#${pa} + 1)).0.0"
          case "${NEXT_CORE}" in
            "${CAND_PATCH}" | "${CAND_MINOR}" | "${CAND_MAJOR}") : ;;
            *)
              echo "::error::Version '${NEXT}' is not a valid increment from the latest UC release '${LATEST_TAG:-none}' (baseline ${PREV_CORE})."
              echo "::error::Valid next versions are ${CAND_PATCH} (patch), ${CAND_MINOR} (minor), or ${CAND_MAJOR} (major)."
              exit 1
              ;;
          esac

          TAG="uc-v${NEXT}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists — pick a different version"; exit 1
          fi

          echo "version=${NEXT}"        >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}"             >> "${GITHUB_OUTPUT}"
          echo "prev_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"

          # Release notes: (uc)-scoped commit subjects since the previous UC release.
          if [[ -n "${LATEST_TAG}" ]]; then RANGE="${LATEST_TAG}..HEAD"; else RANGE="HEAD"; fi
          UC_LOG="$(git log ${RANGE} --no-merges --pretty=format:'- %s (%h)' | grep -E '^- [a-z]+\(uc\)!?:' || true)"

          {
            echo "## solo-operator-uc ${TAG}"
            echo
            echo "Manually cut UC sidecar release."
            echo
            if [[ -n "${UC_LOG}" ]]; then
              echo "### \`(uc)\`-scoped changes since ${LATEST_TAG:-repository start}"
              echo
              echo "${UC_LOG}"
            else
              echo "_No \`(uc)\`-scoped commits since ${LATEST_TAG:-repository start}._"
            fi
          } > uc-release-notes.md

          {
            echo "### UC release plan"
            echo "- Version: \`${TAG}\` (previous: \`${LATEST_TAG:-none}\`)"
            echo "- Dry run: \`${{ inputs.dry-run-enabled }}\`"
            echo
            echo "#### Notes preview"
            echo '```markdown'
            cat uc-release-notes.md
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Stamp the chosen version into the binaries via the shared VERSION var
      # (overrides the default `git describe`). hash:uc depends on build:uc:all,
      # so this builds both arch binaries and their checksums in one invocation.
      - name: Build UC Binaries & Checksums
        if: ${{ !inputs.dry-run-enabled }}
        run: task hash:uc VERSION="${{ steps.plan.outputs.tag }}"

      - name: Setup QEMU
        if: ${{ !inputs.dry-run-enabled }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Setup Docker Buildx
        if: ${{ !inputs.dry-run-enabled }}
        uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Docker Login (GitHub)
        if: ${{ !inputs.dry-run-enabled }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.GH_OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login (JFrog)
        if: ${{ !inputs.dry-run-enabled }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.JF_OCI_REGISTRY }}
          username: ${{ vars.JF_USERNAME }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Build and Push UC Image (GitHub)
        if: ${{ !inputs.dry-run-enabled }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:${{ steps.plan.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:latest

      - name: Build and Push UC Image (JFrog)
        if: ${{ !inputs.dry-run-enabled }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:${{ steps.plan.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:latest

      # Tag + release last, so they only exist once the images are published.
      - name: Create Tag & GitHub Release
        if: ${{ !inputs.dry-run-enabled }}
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release solo-operator-uc ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "solo-operator-uc ${TAG}" \
            --notes-file uc-release-notes.md \
            --latest=false \
            bin/uc-linux-amd64 \
            bin/uc-linux-arm64 \
            bin/uc-linux-amd64.sha256 \
            bin/uc-linux-arm64.sha256
          echo "::notice::Released ${TAG}"
