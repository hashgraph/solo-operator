# SPDX-License-Identifier: Apache-2.0

---
name: "Release: Deploy Artifact (UC Sidecar)"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  GH_OCI_REGISTRY: ghcr.io
  GH_OCI_GROUP: hashgraph
  GH_OCI_IMAGE: solo-operator-uc
  JF_OCI_REGISTRY: ${{ vars.JF_HELM_REGISTRY }}
  JF_OCI_GROUP: solo-operator-docker-release

permissions:
  contents: write
  packages: write

jobs:
  release-uc:
    name: Release / UC
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install Semantic Release & plugins
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "solo-operator-uc-release-tooling",
            "private": true,
            "devDependencies": {
              "semantic-release": "24.2.4",
              "@semantic-release/commit-analyzer": "13.0.1",
              "@semantic-release/release-notes-generator": "14.1.1",
              "@semantic-release/github": "11.0.6",
              "@semantic-release/exec": "7.1.0",
              "conventional-changelog-conventionalcommits": "8.0.0"
            }
          }
          JSON
          npm install --no-audit --no-fund

      - name: Publish Semantic Release (UC)
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          FLAGS=""
          if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
            FLAGS="--dry-run"
          fi

          npx semantic-release ${FLAGS} --extends "$(pwd)/.releaserc_uc.json" 2>&1 | tee semantic-release-output.txt

          if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
            NEXT_VERSION=$(sed -n 's/.*The next release version is \([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\(-[0-9A-Za-z.-]\{1,\}\)\{0,1\}\).*/\1/p' semantic-release-output.txt || echo "")
            echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
            echo "released=false" >> "${GITHUB_OUTPUT}"
            if [[ -n "$NEXT_VERSION" ]]; then
              echo "::notice::Dry-run: next UC release would be uc-v${NEXT_VERSION}"
            else
              echo "::notice::Dry-run: no new UC release would be created"
            fi
          else
            if [[ -s ".release-version-uc" ]]; then
              VERSION="$(tr -d '[:space:]' < .release-version-uc)"
              echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
              echo "released=true" >> "${GITHUB_OUTPUT}"
              echo "::notice::Released UC uc-v${VERSION}"
            else
              echo "released=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::No new UC release was created"
            fi
          fi

      - name: Build UC Binaries
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        run: task build:uc:all

      - name: Generate Checksums
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        run: task hash:uc

      - name: Setup QEMU
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Setup Docker Buildx
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1

      - name: Docker Login (GitHub)
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.GH_OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login (JFrog)
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.JF_OCI_REGISTRY }}
          username: ${{ vars.JF_USERNAME }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Build and Push UC Image (GitHub)
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:${{ steps.semantic-release.outputs.version }}
            ${{ env.GH_OCI_REGISTRY }}/${{ env.GH_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:latest

      - name: Build and Push UC Image (JFrog)
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.uc
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:${{ steps.semantic-release.outputs.version }}
            ${{ env.JF_OCI_REGISTRY }}/${{ env.JF_OCI_GROUP }}/${{ env.GH_OCI_IMAGE }}:latest
