[versions]
assertj = "3.27.3"
fabric8 = "7.4.0"
foojay-resolver = "0.7.0"
gradle-enterprise = "3.15.1"
hedera = "2.61.0"
javaoperatorsdk = "5.1.1"
jgit = "7.3.0.202506031305-r"
junit = "5.13.4"
lombok = "1.18.38"
quarkus = "3.25.0"
semver = "2.0.0"
smallrye-cert = "0.9.2"
spotbugs = "4.9.3"
spotless = "7.2.1"
sundr = "0.200.4"
wiremock = "3.13.1"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility" }
crd-generator-collector = { module = "io.fabric8:crd-generator-collector", version.ref = "fabric8" }
fabric8-crd-generator-api-v2 = { module = "io.fabric8:crd-generator-api-v2", version.ref = "fabric8" }
fabric8-generator-annotations = { module = "io.fabric8:generator-annotations", version.ref = "fabric8" }
fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay-resolver" }
fullstack-helm-client = { module = "com.hedera.fullstack:fullstack-helm-client", version = "0.32.0" }
gradle-enterprise = { module = "com.gradle:gradle-enterprise-gradle-plugin", version.ref = "gradle-enterprise" }
grpc-netty = { module = "io.grpc:grpc-netty" }
hedera-sdk = { module = "com.hedera.hashgraph:sdk", version.ref = "hedera" }
java-generator-core = { module = "io.fabric8:java-generator-core", version.ref = "fabric8" }
javaoperatorsdk-junit5 = { module = "io.javaoperatorsdk:operator-framework-junit-5", version.ref = "javaoperatorsdk" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jgit-archive = { module = "org.eclipse.jgit:org.eclipse.jgit.archive", version.ref = "jgit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kindcontainer = { module = "com.dajudge.kindcontainer:kindcontainer" }
kubernetes-model-core = { module = "io.fabric8:kubernetes-model-core", version.ref = "fabric8" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
microprofile-config-api = { module = "org.eclipse.microprofile.config:microprofile-config-api" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-image-docker = { module = "io.quarkus:quarkus-container-image-docker" }
quarkus-jacoco = { module = "io.quarkus:quarkus-jacoco" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
quarkus-junit5-mockito = { module = "io.quarkus:quarkus-junit5-mockito" }
quarkus-kubernetes = { module = "io.quarkus:quarkus-kubernetes" }
quarkus-kubernetes-client = { module = "io.quarkus:quarkus-kubernetes-client" }
quarkus-operator-sdk = { module = "io.quarkiverse.operatorsdk:quarkus-operator-sdk" }
quarkus-operator-sdk-bom = { module = "io.quarkus.platform:quarkus-operator-sdk-bom", version.ref = "quarkus" }
quarkus-operator-sdk-bundle = { module = "io.quarkiverse.operatorsdk:quarkus-operator-sdk-bundle-generator" }
quarkus-resteasy-qute = { module = "io.quarkus:quarkus-resteasy-qute" }
quarkus-security = { module = "io.quarkus:quarkus-security" }
semver = { module = "net.swiftzer.semver:semver", version.ref = "semver" }
smallrye-cert-junit = { module = "io.smallrye.certs:smallrye-certificate-generator-junit5", version.ref = "smallrye-cert" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
sundr-builder-annotations = { module = "io.sundr:builder-annotations", version.ref = "sundr" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }

[bundles]
quarkus-platform = [
    "quarkus.arc",
    "quarkus.image.docker",
    "quarkus.kubernetes",
    "quarkus.kubernetes.client",
    "quarkus.resteasy.qute",
    "quarkus.security",
]
quarkus-junit5-platform = [
    "quarkus.jacoco",
    "quarkus.junit5",
    "quarkus.junit5.mockito",
]
